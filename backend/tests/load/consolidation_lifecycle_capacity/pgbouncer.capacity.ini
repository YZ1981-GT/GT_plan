; PgBouncer configuration for the consolidation lifecycle 6000 VU capacity run.
; Spec: consolidation-run-and-workpaper-lifecycle-closure — Task 8.4
; Design: §6 性能与观测, §7 安全/事务/降级.
;
; This is a DELIVERABLE config for a DEDICATED, DISPOSABLE capacity environment.
; Do NOT point it at the shared dev/prod PG. It mirrors the committed
; docker-compose.yml pgbouncer env (edoburu/pgbouncer:1.22.1-p0, transaction
; pooling) and is kept consistent with:
;   - docker-compose.yml : max_connections=200, POOL_MODE=transaction,
;                          MAX_CLIENT_CONN=10000, DEFAULT_POOL_SIZE=50,
;                          RESERVE_POOL_SIZE=10
;   - backend/app/core/config.py : DB_PGBOUNCER_PORT=6432, DB_POOL_SIZE=50,
;                          DB_MAX_OVERFLOW=100, DB_USE_PGBOUNCER toggles asyncpg
;                          to NullPool + statement_cache_size=0
;
; The per-service backend budget (api_read 90 / sse_longpoll 20 /
; operation_worker 40 = 150, + ops_reserve 10 = 160 < 200, >=20% admin reserve)
; is enforced by connection_budget.check_budget() BEFORE a run. PgBouncer itself
; multiplexes the 6000 front-side clients onto those small backend pools via
; transaction pooling.
;
; The backend MUST run with asyncpg NullPool when fronted by PgBouncer
; (DB_USE_PGBOUNCER=true): per-session prepared statements are incompatible with
; transaction pooling. See backend/app/core/database.py (NullPool +
; statement_cache_size=0 branch).

[databases]
; One logical DB entry per PG service class so pool sizes can be tuned
; independently. All point at the SAME disposable capacity PG, different
; pool_size so the sum respects the budget invariant.
;
; api_read: metadata/readiness/post-elimination/trial/operation-status reads.
gt_capacity = host=capacity-db port=5432 dbname=gt_capacity pool_size=90 pool_mode=transaction
; sse_longpoll: operation SSE / long-poll; each connection holds a
; function-scope get_db so it does not sit idle-in-transaction.
gt_capacity_sse = host=capacity-db port=5432 dbname=gt_capacity pool_size=20 pool_mode=transaction
; operation_worker: refresh-all / push / report / snapshot worker short
; per-stage transactions. Bounded — NOT per virtual user (design §7).
gt_capacity_worker = host=capacity-db port=5432 dbname=gt_capacity pool_size=40 pool_mode=transaction

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Transaction pooling is MANDATORY for this workload (design §7 + the
; connection_budget invariant). Session pooling would pin a backend connection
; per client and blow the 200-connection ceiling long before 6000 VU.
pool_mode = transaction

; Front-side client ceiling. 6000 VU each may hold at most one transient client
; connection; 10000 leaves headroom above the raw VU count so PgBouncer does not
; reject clients before backend pooling applies.
max_client_conn = 10000

; Default + reserve backend pool sizing (per-database overrides above win).
default_pool_size = 50
reserve_pool_size = 10
reserve_pool_timeout = 3

; Keep server connections healthy under a 40-minute run.
server_idle_timeout = 600
server_lifetime = 3600
server_reset_query = DISCARD ALL
; transaction pooling: server_reset_query only runs in session mode; harmless here.
server_reset_query_always = 0

; Observability: expose PgBouncer's own SHOW POOLS / SHOW STATS to the stats
; user so resource_samples can capture pool wait + client/server counts.
stats_period = 15
ignore_startup_parameters = extra_float_digits

; Admin / stats access (read-only stats user; no superuser over the pooler).
admin_users = pgbouncer_admin
stats_users = pgbouncer_stats
