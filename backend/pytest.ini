[pytest]
asyncio_mode = auto
testpaths = tests
# 🔴 不要加 `pythonpath = tests`：它把 tests/ 放到导入路径首位，tests/playwright 包会遮蔽真实 playwright，
#    pytest-playwright 插件加载即崩（只能 `-p no:playwright` 绕开）；tests/scripts 同样遮蔽 backend/scripts。
#    测试根目录的辅助模块一律写 `from tests.authz_world import …`（守卫 test_pytest_import_isolation.py）。
markers =
    e2e: end-to-end integration tests (require PostgreSQL + Redis)
    slow: marks tests as slow (deselect with '-m "not slow"')
    pg_only: marks tests that require PostgreSQL (skip on SQLite)
    perf: performance benchmark tests (deselect with '-m "not perf"')
    evidence_governance: attachment-ocr-ai-evidence-governance-hardening backend suite (Task 8.3 aggregation); run with '-m evidence_governance'
    release_gate_p30: independent release gate — P30 quality-snapshot recompute on a fixed immutable snapshot (Task 11.3); distinct from UAT-15/6000VU, no DB/online data; run with '-m release_gate_p30'
filterwarnings =
    ignore::DeprecationWarning:sqlalchemy.sql.schema
