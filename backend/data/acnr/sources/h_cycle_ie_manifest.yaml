# ═══════════════════════════════════════════════════════════════════════════════
# ACNR H 循环 Import/Export 手维清单（h_cycle_ie_manifest.yaml）
# ═══════════════════════════════════════════════════════════════════════════════
#
# 用途：ACNR 生成器（generate_catalog.py）的 H 循环 import_export 输入源
#       （design.md「Generator pipeline」/ R1.2 / R18.6 / R-ROUTE）。
#
# 铁律：本文件为「手工整理」，**禁止 AST 自动扫描** h*_import_export.py。
#
# 数据来源（逐 sheet 手工阅读）：
#   _h0_confirmation_import_export.py   (H0 函证 parsed_data 存储)
#   _h1_import_export.py    (create_cycle_import_export_router api_prefix=h1)
#   _h2_import_export.py    (create_cycle_import_export_router api_prefix=h2)
#   _h3_import_export.py    (create_cycle_import_export_router api_prefix=h3)
#   _h4_import_export.py    (create_cycle_import_export_router api_prefix=h4)
#   _h6_import_export.py    (create_cycle_import_export_router api_prefix=h6)
#   _h8_import_export.py    (create_cycle_import_export_router api_prefix=h8)
#   _h10_asset_disposal_income_import_export.py (api_prefix=h10)
#
# 字段说明：同 d_cycle_ie_manifest.yaml。
#
# 备注：
#   - H1/H2/H3 使用虚拟 sheet_code 分区段（如 H1-2-base/H1-2-cost/H1-2-dep/H1-2-impair）
#     但 item_id 共享同一 key（H1-2-rows）。manifest 中只登记逻辑 sheet_code（如 H1-2）。
#   - H5（生产性生物资产）/H7（林木类生物资产）为行业特殊底稿，
#     目前无独立 import_export 文件，首期不登记。
#   - H9 为租赁/使用权资产，目前无独立 import_export 文件，首期不登记。
# ═══════════════════════════════════════════════════════════════════════════════

