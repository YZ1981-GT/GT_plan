# ═══════════════════════════════════════════════════════════════════════════════
# ACNR D 循环 Import/Export 手维清单（d_cycle_ie_manifest.yaml）
# ═══════════════════════════════════════════════════════════════════════════════
#
# 用途：ACNR 生成器（generate_catalog.py）的 D 循环 import_export 输入源
#       （design.md「Generator pipeline」/ R1.2 / R18.6 / R-ROUTE）。
#
# 铁律（design.md §「d_cycle_ie_manifest.yaml 示例结构」与蓝图 §13.11）：
#   - 本文件为「手工整理」，**禁止 AST 自动扫描** d*_import_export.py。
#   - I/E 路由只认本清单的 api_prefix + item_id（R18.6 / R-ROUTE）。
#   - CI `check-ie-catalog-sync` 校验本清单与 catalog 的 import_export 段一致（首期先 D）。
#
# 数据来源（逐 sheet 手工阅读，2026 修订版底稿）：
#   backend/app/routers/wp_render_strategies/_d1_import_export.py  (_SHEET_ITEM_ID)
#   backend/app/routers/wp_render_strategies/_d2_import_export.py  (SHEET_ITEM_ID_MAP + 多 key 分流)
#   backend/app/routers/wp_render_strategies/_d3_import_export.py  (_SHEET_ITEM_ID)
#   backend/app/routers/wp_render_strategies/_d4_import_export.py  (item_id = {sheet}-rows 默认 + 特例)
#   backend/app/routers/wp_render_strategies/_d5_import_export.py  (_SHEET_ITEM_ID)
#   backend/app/routers/wp_render_strategies/_d6_import_export.py  (_SHEET_ITEM_ID)
#   backend/app/routers/wp_render_strategies/_d7_import_export.py  (_SHEET_ITEM_ID)
#
# 字段说明：
#   sheet_code        : Tab 编码（= API ?sheet= 参数），如 D2-2。
#   api_prefix        : 三级端点前缀，如 d2 → POST /api/workpapers/{wp_id}/d2/{export-template|export-data|import-data}。
#   item_id           : checklist_responses.item_id；多 key sheet（导入分流/导出合并）用列表。
#   storage_field     : 落库列（本循环统一存 checklist_responses.remark，值为 JSON 数组/对象）。
#   import_order      : bulk 导入次序（每循环 10 起、步长 10；审定表 D*-1 先行）。
#   depends_on_sheets : 依赖 sheet（沿用示例约定：明细/子表依赖本循环审定表 D*-1；D6 无 D6-1 则为空）。
#   storage_mode      : （可选）row_json = 单/多 item_id 存 JSON 行数组；keyed_fields = 按行键×字段逐格存（审定表）。
#
# 备注：
#   - 审定表 D*-1（及 D1-14 政策问答）为固定行、按字段逐格落库（keyed_fields），
#     item_id 为前缀模式（如 D7-1-adj-*），非单一 JSON 数组；已标 storage_mode: keyed_fields。
#   - D1-15 使用独立端点前缀 d1-ecl（hardcoded sheet=D1-15），单独标注。
# ═══════════════════════════════════════════════════════════════════════════════

