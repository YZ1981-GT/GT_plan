# backend/data/wp_render_schema/M2-1.yaml
# 实收资本审定表 — d-form-table 渲染 schema
# Requirements: §5（M2 实收资本/股本）
# Design: §3 审定表标准字段（按股东分行：持股比例/出资方式/认缴/实缴）
# Template: M2 实收资本（股本）.xlsx

wp_code: M2-1
wp_name: 实收资本审定表
component_type: d-form-table
template_path: backend/wp_templates/M/M2 实收资本（股本）.xlsx
template_version: v2025-R5
applicable_standards: [soe_standalone, listed_standalone, soe_consolidated, listed_consolidated]
related_accounts:
  - code: '4001'
    name: 实收资本（股本）

# ═══════════════════════════════════════════════════════════════════════════════
# 审定表 — 按股东分行（动态行）
# ═══════════════════════════════════════════════════════════════════════════════

dynamic_rows: true

row_template:
  fields:
    - { field: shareholder_name, label: 股东名称, type: text }
    - { field: shareholding_ratio, label: 持股比例, type: percent }
    - { field: contribution_type, label: 出资方式, type: select, options: ["货币出资", "实物出资", "知识产权", "土地使用权", "其他非货币"] }
    - { field: subscribed_amount, label: 认缴出资额, type: number }
    - { field: paid_in_amount, label: 实缴出资额, type: number }
    - { field: contribution_date, label: 出资日期, type: date }
    - { field: opening_balance, label: 期初余额, type: number, auto_source: trial_balance.opening_balance }
    - { field: unadjusted_amount, label: 未审金额, type: number, auto_source: trial_balance.unadjusted_amount }
    - { field: aje_debit, label: 审计调整借方, type: number }
    - { field: aje_credit, label: 审计调整贷方, type: number }
    - { field: rje_debit, label: 重分类调整借方, type: number }
    - { field: rje_credit, label: 重分类调整贷方, type: number }
    - { field: audited_amount, label: 审定金额, type: number, formula: "unadjusted_amount + aje_debit - aje_credit + rje_debit - rje_credit" }
    - { field: prior_year_audited, label: 上年审定金额, type: number, auto_source: trial_balance.prior_audited }
    - { field: variance_amount, label: 变动金额, type: number, formula: "audited_amount - prior_year_audited" }
    - { field: variance_note, label: 差异说明, type: textarea }

# ─── 合计行 ─────────────────────────────────────────────────────────────────
totals:
  - field: shareholding_ratio
    formula: "SUM(shareholding_ratio)"
    expected: 1.0
  - field: subscribed_amount
    formula: "SUM(subscribed_amount)"
  - field: paid_in_amount
    formula: "SUM(paid_in_amount)"
  - field: audited_amount
    formula: "SUM(audited_amount)"

# ═══════════════════════════════════════════════════════════════════════════════
# 联动配置
# ═══════════════════════════════════════════════════════════════════════════════

writeback:
  target: trial_balance.audited_amount
  trigger: WORKPAPER_SAVED
  handler: _on_d_audit_determination_saved
  match_pattern: "^[D-N]\\d+-1$"
  key_field: account_code
  value_field: audited_amount

# ═══════════════════════════════════════════════════════════════════════════════
# 跨底稿引用
# ═══════════════════════════════════════════════════════════════════════════════

cross_refs:
  - ref_id: CW-M2-1-001
    target_wp: M2-3
    target_field: 验资报告
    description: '审定表 → M2-3 验资报告核实'
    severity: required
    direction: outbound

  - ref_id: CW-M2-1-002
    target_wp: M2-4
    target_field: 工商变更
    description: '审定表 → M2-4 工商变更核实'
    severity: required
    direction: outbound
