# S4 非货币性资产交换 — 专属渲染 schema
# component_type: s4-nonmonetary-exchange
# Template: S4 非货币性资产交换202401.xlsx
# 整册统一路由到 GtS4NonmonetaryExchange，前端按 sheetName v-if 分发

wp_code: S4
wp_name: 非货币性资产交换
component_type: s4-nonmonetary-exchange
template_path: backend/wp_templates/S/S4 非货币性资产交换202401.xlsx
template_version: v2025-R5
applicable_standards: [soe_standalone, listed_standalone, soe_consolidated, listed_consolidated]

# 整册专属组件：前端按 sheetName v-if 分发
whole_workbook_dedicated: true

sheets:
  - sheet_name: 非货币性资产交换审计程序S4
    internal_type: sheet-audit-program
    description: 非货币性资产交换审计程序表
    has_formulas: true
    formula_count: 4

  - sheet_name: 审定表S4-1
    internal_type: sheet-adjudication
    description: 非货币性资产交换审定表（换入/换出资产明细 + 损益）
    has_formulas: true
    formula_count: 4

  - sheet_name: 商业实质的判断S4-2
    internal_type: sheet-judgment
    description: 商业实质判断（6项排除情形 + 现金流量差异判断）
    has_formulas: true
    formula_count: 5

# 公式引擎元数据
formula_engine:
  name: useS4FormulaEngine
  type: pure_function
  functions:
    - calcExchangeGainLoss: "gainLoss = outFairValue - outBookValue; inCost = outFairValue + taxes"
    - judgeApplicable: "ALL(exclusions == false) → 适用准则"
    - judgeCommercialSubstance: "cashflowDifferent → 具有商业实质"
  zero_protection: []

# 判断逻辑
judgment:
  applicable:
    description: 6项排除情形全为false（"不属于"）则适用非货币性资产交换准则
    exclusions_count: 6
  commercial_substance:
    description: 现金流量风险/时间/金额显著不同 → 具有商业实质
    condition: cashflowDifferent

# 非经常性损益标注
non_recurring_gain_loss: true
