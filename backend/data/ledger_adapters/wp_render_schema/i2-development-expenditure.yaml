      - { field: should_impair, label: 应计提减值, type: number, width: 100, formula: "MAX(book_value - recoverable_amount, 0)" }
      - { field: already_impaired, label: 已计提, type: number, width: 80 }
      - { field: diff, label: 差额, type: number, width: 80, formula: "should_impair - already_impaired" }
