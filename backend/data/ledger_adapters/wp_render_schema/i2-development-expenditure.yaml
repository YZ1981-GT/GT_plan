# backend/data/ledger_adapters/wp_render_schema/i2-development-expenditure.yaml
# I2 开发支出 — 专属组件渲染 schema
# componentType: i2-development-expenditure
# 科目 1717 开发支出（借方/资产类）
# Template: I2 开发支出.xlsx（21 有效 sheet）
# 公式特征：期末=期初+借方-贷方（资产类）；审定=未审+AJE+RJE；
#           三角勾稽（期末=期初+增加-减少）；CAS6五条件资本化
# 核心：CAS6五条件 + I6↔I2双向联动 + I1转入 + 4类检查 + 截止双向
# 创建: 2026-07-26

wp_code: I2
wp_name: 开发支出
component_type: i2-development-expenditure
selfLoad: true
template_path: backend/wp_templates/I/I2 开发支出.xlsx
template_version: v2025-R5
applicable_standards: [soe_standalone, listed_standalone, soe_consolidated, listed_consolidated]
account_codes: ['1717']
related_accounts:
  - code: '1717'
    name: 开发支出
    direction: debit
    category: asset

features:
  - selfLoad
  - dualMode
  - importExport
  - eventBus
  - cas6Capitalization
  - crossWpLinkage

# ═══════════════════════════════════════════════════════════════════════════════
# Sheet 定义（20 sheets）
# ═══════════════════════════════════════════════════════════════════════════════

sheets:
  # ─────────────────────────────────────────────────────────────────────────
  # Sheet 1: 底稿目录
  # ─────────────────────────────────────────────────────────────────────────
  底稿目录:
    code: I2
    group: core
    dimensions: "30×13"
    component: I2TabIndex
    class_code: B-底稿目录
    layout:
      left_panel:
        - { field: entity_name, label: 被审计单位, type: text, readonly: true }
        - { field: period_end, label: 截止日, type: text, readonly: true }
        - { field: preparer, label: 编制人, type: text }
        - { field: reviewer, label: 复核人, type: text }
      right_panel:
        type: directory_table
        columns:
          - { field: seq, label: 序号, type: number, width: 50 }
          - { field: content, label: 内容, type: text, width: 200 }
          - { field: index_no, label: 索引号, type: index_chip, width: 80 }
          - { field: remark, label: 备注, type: text, width: 120 }
        rows: 30
    progress_bar: true

  # ─────────────────────────────────────────────────────────────────────────
  # Sheet 2: 开发支出实质性程序表I2A
  # ─────────────────────────────────────────────────────────────────────────
  开发支出实质性程序表I2A:
    code: I2A
    group: core
    dimensions: "32×11"
    component: a-program-console
    class_code: A-实质性程序
    columns:
      - { field: seq, label: 序号, type: number, width: 50 }
      - { field: procedure, label: 审计程序, type: text, width: 300 }
      - { field: category, label: 程序分类, type: text, width: 80 }
      - { field: assertion, label: 财务报表的认定, type: text, width: 100 }
      - { field: executor, label: 执行人, type: text, width: 80, editable: true }
      - { field: exec_date, label: 执行日期, type: date, width: 100, editable: true }
      - { field: conclusion, label: 结论, type: text, width: 100, editable: true }
      - { field: auto_data, label: 自动取数, type: text, width: 80, auto_source: true }
      - { field: index_ref, label: 底稿索引号, type: index_chip, width: 80 }
      - { field: remark, label: 备注, type: text, width: 100, editable: true }
      - { field: applicability, label: 适用性, type: text, width: 80 }
    rows: 32
    integrations:
      - voucher_sampling_engine: { mode: dialog }
      - cutoff_auto_sampling: true

  # ─────────────────────────────────────────────────────────────────────────
  # Sheet 3: 审定表I2-1 (32行×10列, 61公式)
  # ─────────────────────────────────────────────────────────────────────────
  审定表I2-1:
    code: I2-1
    group: core
    dimensions: "32×10"
    component: I2TabAdjudication
    class_code: F-审定表
    account_codes: ['1717']
    formula_count: 61
    layout_sections:
      - { id: lead, label: 期初/期末未审·调整·审定 + 变动比较 }
      - { id: tb, label: 合计 / TB数据 / 差异 }
      - { id: notes, label: 审计说明与结论 }
    columns:
      - { field: project_name, label: 项目, type: text }
      - { field: begin_unadj, label: 期初未审数, type: number }
      - { field: begin_adj, label: 期初账项调整, type: number }
      - { field: begin_audited, label: 期初审定数, type: number, formula: "begin_unadj + begin_adj" }
      - { field: end_unadj, label: 期末未审数, type: number }
      - { field: end_adj, label: 期末账项调整, type: number }
      - { field: end_audited, label: 期末审定数, type: number, formula: "end_unadj + end_adj" }
      - { field: change_amount, label: 变动额, type: number, formula: "end_audited - begin_audited" }
      - { field: change_rate, label: 变动率, type: percent, formula: "change_amount / begin_audited", note: "分母为0显示N/A" }
      - { field: reason_analysis, label: 原因分析, type: text }
    formulas:
      - { name: calcBeginAudited, expr: "beginUnadj + beginAdj" }
      - { name: calcEndAudited, expr: "endUnadj + endAdj" }
      - { name: calcChangeAmount, expr: "endAudited - beginAudited" }
      - { name: calcChangeRate, expr: "beginAudited==0 ? N/A : changeAmount/beginAudited" }
      - { name: tbDiff, expr: "total.endAudited - tb.audited1717" }
    highlights:
      - { condition: "tb_diff != 0", style: red, tooltip: "合计审定≠TB" }
    writeback:
      target: trial_balance.audited_amount
      trigger: WORKPAPER_SAVED
      key_field: account_code
      value_field: audited_amount
      accounts: ['1717']
    autofill_sources: [I2-2, I2-3, trial_balance]
    event_bus:
      publish:
        - { event: "substantive:adjudicated", payload: "{accountCode:'1717', adjudicatedAmount}" }
        - { event: "development:capitalized-to-intangible", payload: "{transferAmount}" }
    footer:
      - { type: total_row, label: 合计 }
      - { type: tb_row, label: TB数据 }
      - { type: diff_row, label: 差异 }
      - { type: audit_note, label: 审计说明 }
      - { type: audit_conclusion }
    cross_refs:
      - ref_id: CW-I2-ADJ-001
        target_wp: I2-2
        description: '审定表 ← I2-2 明细表'
        direction: inbound
      - ref_id: CW-I2-ADJ-002
        target_wp: I2-3
        description: '审定表期末调整 ← I2-3'
        direction: inbound
      - ref_id: CW-I2-ADJ-003
        target_wp: I1-5
        description: '转无形资产 → I1-5'
        direction: outbound
      - ref_id: CW-I2-ADJ-004
        target_wp: disclosure
        description: '期末审定 → 附注披露（substantive:adjudicated）'
        direction: outbound

  # ─────────────────────────────────────────────────────────────────────────
  # Sheet 4: 明细表I2-2 (51行×61列, 4区段Tab)
  # ─────────────────────────────────────────────────────────────────────────
  明细表I2-2:
    code: I2-2
    group: core
    dimensions: "51×61"
    component: I2TabDetail
    class_code: F-明细表
    dynamic_rows: true
    max_rows: 200
    formula_count: 7
    tab_sections:
      - name: 基础信息
        tab_index: 0
        columns:
          - { field: project_name, label: 项目名称, type: text, width: 150 }
          - { field: approval_date, label: 立项日期, type: date, width: 100 }
          - { field: rd_phase, label: 研发阶段, type: select, width: 100, options: [研究阶段, 开发阶段, 已资本化, 已结转] }
          - { field: capitalization_start, label: 资本化起始日, type: date, width: 100 }
          - { field: total_budget, label: 预算总额, type: number, width: 100 }
      - name: 本期投入
        tab_index: 1
        columns:
          - { field: material_cost, label: 材料费, type: number, width: 90 }
          - { field: labor_cost, label: 人工费, type: number, width: 90 }
          - { field: depreciation, label: 折旧摊销, type: number, width: 90 }
          - { field: other_cost, label: 其他费用, type: number, width: 90 }
          - { field: period_total, label: 本期投入合计, type: number, width: 100, formula: "material + labor + depreciation + other" }
      - name: 资本化
        tab_index: 2
        columns:
          - { field: cumulative_capitalized, label: 累计资本化金额, type: number, width: 110 }
          - { field: current_capitalized, label: 本期资本化, type: number, width: 100 }
          - { field: transfer_to_i1, label: 转入无形资产, type: number, width: 100 }
          - { field: closing_balance, label: 期末余额, type: number, width: 100, formula: "cumulative + current - transferToI1" }
      - name: 期末汇总
        tab_index: 3
        columns:
          - { field: total_expense, label: 费用化累计, type: number, width: 100 }
          - { field: total_capitalized, label: 资本化累计, type: number, width: 100 }
          - { field: rd_total, label: 研发总额, type: number, width: 100, formula: "totalExpense + totalCapitalized" }
    formulas:
      - { name: calcPeriodTotal, target: period_total, expr: "material + labor + depreciation + other" }
      - { name: calcClosingBalance, target: closing_balance, expr: "cumulative + current - transferToI1" }
    summary_rows:
      - { type: grand_total }
    import_export: true
    add_row_prompt: project_name
    cross_refs:
      - ref_id: CW-I2-2-001
        target_wp: I2-1
        description: '明细表合计 → 审定表I2-1'
        direction: outbound

  # ─────────────────────────────────────────────────────────────────────────
  # Sheet 5: 调整分录汇总I2-3
  # ─────────────────────────────────────────────────────────────────────────
  调整分录汇总I2-3:
    code: I2-3
    group: core
    dimensions: "21×10"
    component: I2TabAdjustment
    class_code: F-调整分录
    dynamic_rows: true
    columns:
      - { field: seq, label: 序号, type: number, width: 50, auto_increment: true }
      - { field: adjustment_item, label: 调整事项, type: text, width: 150 }
      - { field: entry_type, label: 类别, type: select, width: 80, options: [AJE, RJE] }
      - { field: account_code, label: 科目代码, type: text, width: 80 }
      - { field: account_name, label: 科目名称, type: text, width: 120 }
      - { field: summary, label: 摘要, type: text, width: 150 }
      - { field: debit_amount, label: 借方, type: number, width: 100 }
      - { field: credit_amount, label: 贷方, type: number, width: 100 }
      - { field: index_ref, label: 索引, type: index_chip, width: 80 }
      - { field: remark, label: 备注, type: text, width: 100 }
    formulas:
      - { name: isDebitCreditBalanced, target: balance_check, expr: "|SUM(debits) - SUM(credits)| < 0.01" }
    event_bus:
      publish:
        - { event: "adjustment:created", payload: "{entryType, accountCode, amount}" }

  # ─────────────────────────────────────────────────────────────────────────
  # Sheet 6: 会计政策检查I2-4
  # ─────────────────────────────────────────────────────────────────────────
  会计政策检查I2-4:
    code: I2-4
    group: inspection
    dimensions: "35×15"
    component: I2TabPolicyCheck
    class_code: D-段落检查
    layout_type: paragraph
    standards_ref: [CAS6]
    check_items:
      - { id: phase_distinction, label: 研究与开发阶段划分标准是否恰当, type: conclusion, options: [是, 否, 不适用] }
      - { id: capitalization_criteria, label: 资本化条件判断是否符合CAS6第9条, type: conclusion, options: [是, 否, 不适用] }
      - { id: capitalization_timing, label: 资本化时点确定是否准确, type: conclusion, options: [是, 否, 不适用] }
      - { id: expense_allocation, label: 费用归集和分配是否合理, type: conclusion, options: [是, 否, 不适用] }
      - { id: amort_policy, label: 资本化完成后摊销政策是否适当, type: conclusion, options: [是, 否, 不适用] }
      - { id: policy_consistency, label: 会计政策是否前后一致, type: conclusion, options: [是, 否, 不适用] }
    guidance:
      top_area: blue_gradient_steps
      methodology_context: amber_left_border

  # ─────────────────────────────────────────────────────────────────────────
  # Sheet 7: 实质性分析I2-5 (51行×16列, 31公式)
  # ─────────────────────────────────────────────────────────────────────────
  实质性分析I2-5:
    code: I2-5
    group: core
    dimensions: "51×16"
    component: I2TabAnalysis
    class_code: G-测算
    formula_count: 31
    columns:
      - { field: project_name, label: 项目, type: text, width: 150 }
      - { field: opening_balance, label: 期初余额, type: number, width: 100 }
      - { field: period_increase, label: 本期增加, type: number, width: 100 }
      - { field: period_decrease, label: 本期减少, type: number, width: 100 }
      - { field: closing_balance, label: 期末余额, type: number, width: 100 }
      - { field: prior_balance, label: 上年期末, type: number, width: 100 }
      - { field: change_rate, label: 变动率(%), type: percent, width: 80, formula: "(closing - prior) / prior" }
      - { field: expected_value, label: 预期值, type: number, width: 100 }
      - { field: variance, label: 差异, type: number, width: 100, formula: "closing - expected" }
      - { field: is_material, label: 超阈值, type: boolean, width: 60 }
    formulas:
      - { name: calcChangeRate, target: change_rate, expr: "(closing - prior) / prior" }
      - { name: calcVariance, target: variance, expr: "closing - expected" }
    highlights:
      - { condition: "is_material = true", style: red, tooltip: "差异超重要性水平" }
    ai_assist:
      section: analysis-anomaly
      button_position: section_title_right

  # ─────────────────────────────────────────────────────────────────────────
  # Sheet 8: 资本化时点判断I2-6（CAS6五条件核心！）(45行×66列)
  # ─────────────────────────────────────────────────────────────────────────
  资本化时点判断I2-6:
    code: I2-6
    group: inspection
    dimensions: "45×66"
    component: I2TabCapitalization
    class_code: D-段落检查
    formula_count: 7
    is_core: true
    cas6_conditions:
      - { id: 1, name: 技术可行性, description: "完成该无形资产以使其能够使用或出售在技术上具有可行性" }
      - { id: 2, name: 完成意图, description: "具有完成该无形资产并使用或出售的意图" }
      - { id: 3, name: 使用或出售能力, description: "能够证明运用该无形资产生产的产品存在市场或无形资产自身存在市场" }
      - { id: 4, name: 未来经济利益, description: "有足够的技术、财务资源和其他资源支持" }
      - { id: 5, name: 资源充足, description: "归属于该无形资产开发阶段的支出能够可靠地计量" }
    check_per_project: true
    guidance:
      top_area: blue_gradient_steps
      methodology_context: amber_left_border
      cas6_article_9: true
    ai_assist:
      section: cas6-suggestion
      button_position: section_title_right
    cross_refs:
      - ref_id: CW-I2-6-001
        target_wp: I2-2
        description: '资本化时点 → I2-2明细表"资本化起点"列'
        direction: outbound

  # ─────────────────────────────────────────────────────────────────────────
  # Sheet 9: 研发项目构成明细表I2-7 (25行×73列, 5区段Tab)
  # ─────────────────────────────────────────────────────────────────────────
  研发项目构成明细表I2-7:
    code: I2-7
    group: inspection
    dimensions: "25×73"
    component: I2TabProjectDetail
    class_code: F-明细表
    dynamic_rows: true
    formula_count: 199
    layout_sections:
      - { id: objectives, label: 一、审计目标 }
      - { id: process, label: 二、审计过程 }
      - { id: detail, label: 三、研发项目构成明细 }
      - { id: notes, label: 四、审计说明 }
      - { id: conclusion, label: 五、审计结论 }
    # 按滚动阶段分 Tab（避免 73 列横向不可用），每段费用性质一致
    tab_sections:
      - name: 汇总
        tab_index: 0
        columns:
          - { field: project_code, label: 项目编号, type: text }
          - { field: project_name, label: 项目名称, type: text }
          - { field: period_start, label: 研发周期起, type: date }
          - { field: period_end, label: 研发周期止, type: date }
          - { field: stage, label: 项目阶段, type: select, options: [研究, 开发, 完成] }
          - { field: increase_total, label: 本期增加合计, type: number, formula: true }
          - { field: increase_capitalized, label: 其中资本化, type: number, formula: true }
          - { field: increase_expensed, label: 其中费用化, type: number, formula: true }
          - { field: audited_total, label: 期末审定合计, type: number, formula: true }
      - name: 账面期初余额
        tab_index: 1
        stage: begin
      - name: 账面本期增加
        tab_index: 2
        stage: increase
      - name: 账面本期减少
        tab_index: 3
        stage: decrease
      - name: 账面期末余额
        tab_index: 4
        stage: ending
        formula: "begin + increase - decrease"
      - name: 审计调整
        tab_index: 5
        stage: adjustment
      - name: 期末审定金额
        tab_index: 6
        stage: audited
        formula: "ending + adjustment"
    cost_nature_columns:
      - { field: material, label: 直接材料 }
      - { field: labor, label: 直接人工 }
      - { field: depreciation, label: 折旧与摊销 }
      - { field: energy, label: 能耗 }
      - { field: outsource, label: 委外研发费 }
      - { field: other, label: 其他费用 }
      - { field: capitalized, label: 资本化金额 }
      - { field: expensed, label: 费用化金额 }
    formulas:
      - { name: ending, expr: "begin + increase - decrease" }
      - { name: audited, expr: "ending + adjustment" }
      - { name: treatment_check, expr: "nature_sum ≈ capitalized + expensed", tolerance: 0.01 }
    summary_rows:
      - { type: grand_total }
    import_export: true
    add_row_prompt: project_name
    cross_refs:
      - ref_id: CW-I2-7-001
        target_wp: I2-2
        description: '项目构成资本化合计 → I2-2 明细表'
        direction: outbound
      - ref_id: CW-I2-7-002
        target_wp: I2-8
        description: '本期增加.直接材料 → I2-8 检查比例分母'
        direction: outbound
      - ref_id: CW-I2-7-003
        target_wp: I2-6
        description: '资本化/费用化划分 ← I2-6 资本化时点判断'
        direction: inbound
      - ref_id: CW-I2-7-004
        target_wp: I6
        description: '费用化金额 ↔ I6 研发费用'
        direction: bidirectional

  # ─────────────────────────────────────────────────────────────────────────
  # Sheet 10: 研发材料投入检查表I2-8
  # ─────────────────────────────────────────────────────────────────────────
  研发材料投入检查表I2-8:
    code: I2-8
    group: inspection
    dimensions: "38×18"
    component: I2TabMaterialCheck
    class_code: F-检查表
    dynamic_rows: true
    layout_sections:
      - { id: objectives, label: 一、审计目标 }
      - { id: sampling, label: 二、样本选取标准与依据 }
      - { id: process, label: 三、审计过程（账簿↔领料单） }
      - { id: notes, label: 四、审计说明 }
      - { id: conclusion, label: 五、审计结论 }
    columns:
      # 记账凭证资料
      - { field: project_name, label: 项目名称, type: text, width: 120, group: book }
      - { field: voucher_no, label: 凭证编号, type: text, width: 100, group: book }
      - { field: business_desc, label: 业务内容, type: text, width: 120, group: book }
      - { field: inventory_name, label: 存货名称, type: text, width: 110, group: book }
      - { field: unit, label: 单位, type: text, width: 60, group: book }
      - { field: quantity, label: 数量, type: number, width: 70, group: book }
      - { field: debit_amount, label: 借方金额, type: number, width: 100, group: book }
      - { field: counterpart_account, label: 对方科目, type: text, width: 100, group: book }
      - { field: counterpart_detail, label: 对方明细科目, type: text, width: 100, group: book }
      # 出库单/领料单资料
      - { field: slip_date_no, label: 日期编号, type: text, width: 100, group: slip }
      - { field: recipient, label: 领用人员, type: text, width: 90, group: slip }
      - { field: recipient_dept, label: 领用部门, type: text, width: 100, group: slip }
      - { field: slip_project, label: 研发项目, type: text, width: 120, group: slip }
      - { field: slip_qty, label: 领料数量, type: number, width: 70, group: slip }
      # 控制列
      - { field: index_ref, label: 索引号, type: text, width: 90 }
      - { field: is_abnormal, label: 是否异常, type: select, width: 100, options: [否, 是, 数量不符, 项目不符, 领用人非研发, 生产混入, 其他] }
      - { field: conclusion, label: 审核结论, type: select, width: 80, options: [相符, 不符, 待查] }
      - { field: attachment, label: 📎附件, type: attachment, width: 50, ocr: true }
    formulas:
      - { name: coverage_ratio, expr: "checked_total / population_amount", note: "总体为0时显示N/A，避免#DIV/0!" }
