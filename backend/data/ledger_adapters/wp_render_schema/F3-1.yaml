# backend/data/wp_render_schema/F3-1.yaml
# 应付票据审定表 — d-form-table 渲染 schema（降级/元数据）
# Requirements: F3-1 审定表
# Template: F3 应付票据.xlsx / sheet: 审定表F3-1
# 真实结构：银行承兑汇票/商业承兑汇票两类(从明细表F3-2 SUMPRODUCT取数)
#           审定数 = 未审数 + 账项调整 + 重分类调整；表尾试算平衡表数/差异数
# 修订(2026-07-01)：修正公式列AJE/RJE→账项调整+重分类调整；cross_ref调整分录F3-4→F3-3

wp_code: F3-1
wp_name: 应付票据审定表
component_type: d-form-table
template_path: backend/wp_templates/F/F3 应付票据.xlsx
template_version: v2025-R5
applicable_standards: [soe_standalone, listed_standalone, soe_consolidated, listed_consolidated]
related_accounts:
  - code: '2201'
    name: 应付票据

# ═══════════════════════════════════════════════════════════════════════════════
# 项目行：银行承兑汇票/商业承兑汇票 + 合计 + 试算平衡表数 + 差异数
# 期初/期末各含：未审数/账项调整/重分类调整/审定数(=之和)
# ═══════════════════════════════════════════════════════════════════════════════

sections:
  - name: 应付票据审定
    account_code_prefix: '2201'
    row_layout: category_rows          # 银行承兑汇票/商业承兑汇票/合计/试算平衡差异
    fields: &audit_determination_fields
      - { field: item_name, label: 项目, type: text, readonly: true }
      - { field: opening_unaudited, label: 期初未审数, type: number, auto_source: trial_balance.opening_balance }
      - { field: opening_aje, label: 期初账项调整, type: number }
      - { field: opening_rje, label: 期初重分类调整, type: number }
      - { field: opening_audited, label: 期初审定数, type: number, formula: "opening_unaudited + opening_aje + opening_rje" }
      - { field: ending_unaudited, label: 期末未审数, type: number, auto_source: trial_balance.unadjusted_amount }
      - { field: ending_aje, label: 期末账项调整, type: number }
      - { field: ending_rje, label: 期末重分类调整, type: number }
      - { field: ending_audited, label: 期末审定数, type: number, formula: "ending_unaudited + ending_aje + ending_rje" }
      - { field: index_ref, label: 索引, type: text }

# ═══════════════════════════════════════════════════════════════════════════════
# 联动配置
# ═══════════════════════════════════════════════════════════════════════════════

writeback:
  target: trial_balance.audited_amount
  trigger: WORKPAPER_SAVED
  handler: _on_d_audit_determination_saved
  match_pattern: "^[D-N]\\d+-1$"
  key_field: account_code
  value_field: ending_audited

# ═══════════════════════════════════════════════════════════════════════════════
# 跨底稿引用
# ═══════════════════════════════════════════════════════════════════════════════

cross_refs:
  - ref_id: CW-F3-1-001
    target_wp: F3-2
    target_field: 应付票据明细合计
    description: '应付票据审定 ← F3-2 明细表合计（SUMPRODUCT按票据类别）'
    severity: info
    direction: inbound

  - ref_id: CW-F3-1-002
    target_wp: F3-3
    target_field: 调整分录汇总
    description: '审定表账项调整 ← F3-3 调整分录汇总'
    severity: required
    direction: inbound

  - ref_id: CW-F3-1-003
    target_wp: F3-4
    target_field: 应付票据利息测算
    description: '带息应付票据 ← F3-4 利息测算表（应计利息）'
    severity: info
    direction: inbound
