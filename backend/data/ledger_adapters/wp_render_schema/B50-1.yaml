# B50-1.yaml — 风险汇总表：固有风险评估（财务报表层次）
# componentType: d-form-table + render_hint: risk_level
# Requirements: G7 风险评估汇总 — 关键核心底稿
# Design: §1.2 风险汇总=d-form-table+risk_level+条件着色

wp_code: B50-1
template_path: backend/wp_templates/B/B50-1 风险汇总表（财务报表层次）.xlsx
template_version: v2025-R5

sheets:
  财务报表层次风险:
    component_type: d-form-table
    form_type: table
    title: 固有风险评估—财务报表层次
    description: 汇总财务报表层次的固有风险评估结果

    fields:
      - field: entity_name
        label: 被审计单位
        type: text
        source: project.client_name
        readonly: true
      - field: assessment_date
        label: 评估日期
        type: date
        format: 'YYYY-MM-DD'

    dynamic_table:
      start_row: 5
      end_row: dynamic
      header_row: 4
      add_row_button: true
      max_rows: 30
      columns:
        seq:
          field: seq
          type: number
          label: 序号
          width: 50
        risk_area:
          field: risk_area
          type: text
          label: 风险领域
          width: 180
        risk_description:
          field: risk_description
          type: textarea
          label: 风险描述
          width: 250
        risk_level:
          field: risk_level
          type: enum
          label: 风险等级
          width: 100
          dict_source: risk_level_dict
          render_hint: risk_level
        risk_response:
          field: risk_response
          type: textarea
          label: 总体应对措施
          width: 220
        reference:
          field: reference
          type: text
          label: 参考索引
          width: 100
          render: index_chip

    dictionaries:
      risk_level_dict:
        - value: high
          label: 高
          color: red
        - value: medium
          label: 中
          color: yellow
        - value: low
          label: 低
          color: green

    conclusion:
      mode: composite
      audit_explanation_field:
        name: audit_explanation
        label: 审计说明
        type: textarea
      overall_conclusion_field:
        name: overall_conclusion
        label: 财务报表层次风险整体评估
        type: textarea
