# backend/data/wp_render_schema/J1-1.yaml
# 应付职工薪酬审定表 — d-form-table 渲染 schema
# Requirements: §5.1（J1 应付职工薪酬）
# Design: §3 审定表标准字段 + §4 联动实现方案
# Template: J1 应付职工薪酬.xlsx
#
# 特殊结构：按薪酬类别分行（工资/奖金/社会保险/住房公积金/职工福利/辞退福利/其他）

wp_code: J1-1
wp_name: 应付职工薪酬审定表
component_type: d-form-table
template_path: backend/wp_templates/J/J1 应付职工薪酬.xlsx
template_version: v2025-R5
applicable_standards: [soe_standalone, listed_standalone, soe_consolidated, listed_consolidated]
related_accounts:
  - code: '2211'
    name: 应付职工薪酬

# ═══════════════════════════════════════════════════════════════════════════════
# 审定表 — 按薪酬类别分行
# 结构：工资 / 奖金 / 社会保险 / 住房公积金 / 职工福利 / 辞退福利 / 其他
#        → 应付职工薪酬合计
# ═══════════════════════════════════════════════════════════════════════════════

sections:
  - name: 工资
    group_key: wages
    row_type: category_row
    account_code_prefix: '221101'
    fields: &audit_determination_fields
      - { field: category_name, label: 薪酬类别, type: text, readonly: true }
      - { field: account_code, label: 科目编码, type: text, readonly: true }
      - { field: account_name, label: 科目名称, type: text, readonly: true }
      - { field: opening_balance, label: 期初余额, type: number, auto_source: trial_balance.opening_balance }
      - { field: unadjusted_amount, label: 未审金额, type: number, auto_source: trial_balance.unadjusted_amount }
      - { field: aje_debit, label: 审计调整借方, type: number }
      - { field: aje_credit, label: 审计调整贷方, type: number }
      - { field: rje_debit, label: 重分类调整借方, type: number }
      - { field: rje_credit, label: 重分类调整贷方, type: number }
      - { field: audited_amount, label: 审定金额, type: number, formula: "unadjusted_amount + aje_debit - aje_credit + rje_debit - rje_credit" }
      - { field: prior_year_audited, label: 上年审定金额, type: number, auto_source: trial_balance.prior_audited }
      - { field: variance_amount, label: 变动金额, type: number, formula: "audited_amount - prior_year_audited" }
      - { field: variance_pct, label: 变动比例, type: percent, formula: "variance_amount / prior_year_audited" }
      - { field: variance_note, label: 差异说明, type: textarea }

  - name: 奖金
    group_key: bonus
    row_type: category_row
    account_code_prefix: '221102'
    fields: *audit_determination_fields

  - name: 社会保险
    group_key: social_insurance
    row_type: category_row
    account_code_prefix: '221103'
    fields: *audit_determination_fields

  - name: 住房公积金
    group_key: housing_fund
    row_type: category_row
    account_code_prefix: '221104'
    fields: *audit_determination_fields

  - name: 职工福利
    group_key: employee_benefits
    row_type: category_row
    account_code_prefix: '221105'
    fields: *audit_determination_fields

  - name: 辞退福利
    group_key: termination_benefits
    row_type: category_row
    account_code_prefix: '221106'
    fields: *audit_determination_fields

  - name: 其他
    group_key: others
    row_type: category_row
    account_code_prefix: '221107'
    fields: *audit_determination_fields

  # ─── 合计行 ─────────────────────────────────────────────────────────────────
  - name: 应付职工薪酬合计
    row_type: total
    formula_source: "SUM(工资, 奖金, 社会保险, 住房公积金, 职工福利, 辞退福利, 其他)"
    fields: *audit_determination_fields

# ═══════════════════════════════════════════════════════════════════════════════
# 联动配置
# ═══════════════════════════════════════════════════════════════════════════════

writeback:
  target: trial_balance.audited_amount
  trigger: WORKPAPER_SAVED
  handler: _on_d_audit_determination_saved
  match_pattern: "^[D-N]\\d+-1$"
  key_field: account_code
  value_field: audited_amount

# ═══════════════════════════════════════════════════════════════════════════════
# 跨底稿引用
# ═══════════════════════════════════════════════════════════════════════════════

cross_refs:
  - ref_id: CW-J1-1-001
    target_wp: J1-8
    target_field: 调整分录汇总
    description: '审定表调整金额 → J1-8 调整分录汇总'
    severity: required
    direction: outbound

  - ref_id: CW-J1-1-002
    target_wp: J1-3
    target_field: 工资测算合计
    description: '工资审定 ← J1-3 工资测算验证'
    severity: info
    direction: inbound

  - ref_id: CW-J1-1-003
    target_wp: J1-4
    target_field: 社保测算合计
    description: '社保审定 ← J1-4 社保测算验证'
    severity: info
    direction: inbound
