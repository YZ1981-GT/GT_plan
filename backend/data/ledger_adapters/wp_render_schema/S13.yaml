# S13 利用管理层的专家编制的信息形成审计证据 — 专属渲染 schema
# component_type: s13-mgmt-expert
# Template: S13 利用管理层的专家编制的信息形成审计证据.xlsx
# 整册统一路由到 GtS13MgmtExpert，前端按 sheetName v-if 分发

wp_code: S13
wp_name: 利用管理层的专家编制的信息形成审计证据
component_type: s13-mgmt-expert
template_path: backend/wp_templates/S/S13 利用管理层的专家编制的信息形成审计证据.xlsx
template_version: v2025-R5
applicable_standards: [soe_standalone, listed_standalone, soe_consolidated, listed_consolidated]

# 整册专属组件：前端按 sheetName v-if 分发
whole_workbook_dedicated: true

sheets:
  - sheet_name: S13 利用管理层的专家形成审计证据程序表
    internal_type: sheet-program
    description: 利用管理层专家形成审计证据程序表
    has_formulas: false
    formula_count: 0

  - sheet_name: S13-1 评价胜任能力、专业素质和客观性
    internal_type: sheet-evaluation
    description: 评价管理层专家胜任能力、专业素质和客观性
    has_formulas: true
    formula_count: 2

  - sheet_name: S13-2 了解专家的工作
    internal_type: sheet-understanding
    description: 了解管理层专家的工作内容和范围
    has_formulas: true
    formula_count: 4

  - sheet_name: S13-3 评价管理层专家工作的适当性
    internal_type: sheet-evaluation
    description: 评价管理层专家工作适当性概览
    has_formulas: true
    formula_count: 4

  - sheet_name: S13-3-1 管理层专家的报告
    internal_type: sheet-report
    description: 管理层专家报告记录
    has_formulas: true
    formula_count: 4

  - sheet_name: S13-3-2 评价管理层专家工作的适当性
    internal_type: sheet-evaluation-general
    description: 通用评价（general domain）
    has_formulas: true
    formula_count: 4

  - sheet_name: S13-3-3 评价管理层专家工作的适当性(股份支付)
    internal_type: sheet-evaluation-share-payment
    description: 股份支付专项评价（share-based-payment domain）
    has_formulas: true
    formula_count: 4

  - sheet_name: S13-3-4 评价管理层专家工作的适当性(金融工具公允价值)
    internal_type: sheet-evaluation-fair-value
    description: 金融工具公允价值专项评价（financial-instrument-fair-value domain）
    has_formulas: true
    formula_count: 4

# 多分支渲染
domain_branches:
  field: expert_domain
  options:
    general: S13-3-2
    share-based-payment: S13-3-3
    financial-instrument-fair-value: S13-3-4
  default: general
