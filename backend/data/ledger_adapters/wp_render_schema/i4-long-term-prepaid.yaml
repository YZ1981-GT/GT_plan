      - { name: calcPeriodAmort, target: calc_period_amort, expr: "periodUnits × amortStandard" }
      - { name: calcAccumAmort, target: calc_accum_amort, expr: "accumUnits × amortStandard" }
      - { name: calcPeriodDiff, target: period_diff, expr: "calcPeriodAmort - bookPeriodAmort" }
      - { name: calcAccumDiff, target: accum_diff, expr: "calcAccumAmort - bookAccumAmort" }
