# backend/data/wp_render_schema/i4-long-term-prepaid.yaml
# I4 长期待摊费用 — 专属组件渲染 schema
# componentType: i4-long-term-prepaid
# 科目 1801 长期待摊费用（借方/资产类）— 标准摊销类
# Template: I4 长期待摊费用.xlsx（12 有效 sheet）
# 公式特征：期末=期初+增加-摊销-减少；审定=未审+AJE+RJE
# 摊销方法：直线法(I4-6) / 工作量法(I4-7) — H折旧引擎子集
# 创建: 2026-07-30

wp_code: I4
wp_name: 长期待摊费用
component_type: i4-long-term-prepaid
selfLoad: true
template_path: backend/wp_templates/I/I4 长期待摊费用.xlsx
template_version: v2025-R5
applicable_standards: [soe_standalone, listed_standalone, soe_consolidated, listed_consolidated]
account_codes: ['1801']
related_accounts:
  - code: '1801'
    name: 长期待摊费用
    direction: debit
    category: asset

special_rules:
  amortization_methods: [straight_line, units_of_production]
  branch_selector: true
  triangle_reconciliation: "期末=期初+增加-摊销-减少"

# ═══════════════════════════════════════════════════════════════════════════════
# Sheet 定义（12 sheets）
# ═══════════════════════════════════════════════════════════════════════════════

sheets:
  # ─────────────────────────────────────────────────────────────────────────
  # Sheet 1: 底稿目录
  # ─────────────────────────────────────────────────────────────────────────
  底稿目录:
    code: 底稿目录
    group: core
    dimensions: "28×13"
    component: I4TabIndex
    class_code: B-底稿目录
    layout:
      left_panel:
        - { field: entity_name, label: 被审计单位, type: text, readonly: true }
        - { field: period_end, label: 截止日, type: text, readonly: true }
        - { field: preparer, label: 编制人, type: text }
        - { field: reviewer, label: 复核人, type: text }
      right_panel:
        type: directory_table
        columns:
          - { field: seq, label: 序号, type: number, width: 50 }
          - { field: content, label: 内容, type: text, width: 200 }
          - { field: index_no, label: 索引号, type: index_chip, width: 80 }
          - { field: remark, label: 备注, type: text, width: 120 }
    progress_bar: true

  # ─────────────────────────────────────────────────────────────────────────
  # Sheet 2: 长期待摊费用实质性程序表I4A
  # ─────────────────────────────────────────────────────────────────────────
  长期待摊费用实质性程序表I4A:
    code: I4A
    group: core
    dimensions: "25×11"
    component: a-program-console
    class_code: A-实质性程序
    columns:
      - { field: seq, label: 序号, type: number, width: 50 }
      - { field: procedure, label: 审计程序, type: text, width: 300 }
      - { field: category, label: 程序分类, type: text, width: 80 }
      - { field: assertion, label: 财务报表的认定, type: text, width: 100 }
      - { field: executor, label: 执行人, type: text, width: 80, editable: true }
      - { field: exec_date, label: 执行日期, type: date, width: 100, editable: true }
      - { field: conclusion, label: 结论, type: text, width: 100, editable: true }
      - { field: auto_data, label: 自动取数, type: text, width: 80, auto_source: true }
      - { field: index_ref, label: 底稿索引号, type: index_chip, width: 80 }
      - { field: remark, label: 备注, type: text, width: 100, editable: true }
      - { field: applicability, label: 适用性, type: text, width: 80 }
    rows: 25
    integrations:
      - voucher_sampling_engine: { mode: dialog }

  # ─────────────────────────────────────────────────────────────────────────
  # Sheet 3: 审定表I4-1（47公式）
  # ─────────────────────────────────────────────────────────────────────────
  审定表I4-1:
    code: I4-1
    group: core
    dimensions: "47×14"
    component: I4TabAdjudication
    class_code: F-审定表
    account_codes: ['1801']
    formula_count: 47
    # 对齐致同 Excel：期初/期末×未审·调整·审定 + 上期比较；数字版保留滚动列便于与 I4-2/I4-6 勾稽
    columns:
      - { field: project_name, label: 项目, type: text, width: 150 }
      - { field: opening_balance, label: 期初, type: number, width: 100 }
      - { field: current_increase, label: 本期增加, type: number, width: 100 }
      - { field: current_amortization, label: 本期摊销, type: number, width: 100 }
      - { field: current_decrease, label: 本期减少, type: number, width: 100 }
      - { field: closing_balance, label: 期末, type: number, width: 100, formula: "opening + increase - amortization - decrease" }
      - { field: unadjusted_amount, label: 未审数, type: number, auto_source: trial_balance.unadjusted_amount }
      - { field: aje_amount, label: AJE, type: number, width: 80 }
      - { field: rje_amount, label: RJE, type: number, width: 80 }
      - { field: audited_amount, label: 审定数, type: number, formula: "unadjusted + aje + rje" }
      - { field: prior_audited, label: 上期审定, type: number, width: 100 }
      - { field: variance_amount, label: 变动额, type: number, formula: "audited - prior_audited" }
      - { field: variance_rate, label: 变动率, type: percent, formula: "IF(prior!=0, variance/ABS(prior), N/A)" }
    formulas:
      - { name: calcAssetEndBalance, target: closing_balance, expr: "opening + increase - amortization - decrease" }
      - { name: calcAuditedAmount, target: audited_amount, expr: "unadjusted + aje + rje" }
      - { name: calcVariance, target: variance_amount, expr: "audited - prior_audited" }
    highlights:
      - { condition: "triangle_mismatch", style: red, tooltip: "三角勾稽不平" }
      - { condition: "tb_variance != 0", style: red }
      - { condition: "aje_approx", style: amber, tooltip: "AJE/RJE近似分摊" }
    cross_refs:
      - { ref_id: CW-I4-1-001, target_wp: I4-2, description: '明细带入 ← I4-2', direction: inbound }
      - { ref_id: CW-I4-1-002, target_wp: I4-3, description: 'AJE/RJE ← I4-3', direction: inbound }
      - { ref_id: CW-I4-1-003, target_wp: I4-6, description: '本期摊销 ← I4-6/I4-7', direction: inbound }
    writeback:
      target: trial_balance.audited_amount
      trigger: WORKPAPER_SAVED
      key_field: account_code
      value_field: audited_amount
      accounts: ['1801']
      gate: { tb_diff_must_be_zero: true, triangle_must_balance: true }
    event_bus:
      publish:
        - { event: "substantive:adjudicated", payload: "{accountCode:'1801', adjudicatedAmount}" }
    footer:
      - { type: excel_lead_matrix, label: 期初期末审定矩阵 }
      - { type: tb_comparison, accounts: ['1801'] }
      - { type: audit_note, label: 审计说明 }
      - { type: significant_matters, label: 重大事项说明 }
      - { type: audit_conclusion, templates: [A, B, C] }
      - { type: review_dialog }
    guidance:
      reclassification_note: '一年内摊销完毕部分一般重分类；以摊销为后续计量者通常不因剩余期限不足一年而强制重分类'

  # ─────────────────────────────────────────────────────────────────────────
  # Sheet 4: 明细表I4-2（53行×25列，3区段Tab）
  # ─────────────────────────────────────────────────────────────────────────
  明细表I4-2:
    code: I4-2
    group: core
    dimensions: "53×25"
    component: I4TabDetail
    class_code: F-明细表
    layout_type: roll_forward
    dynamic_rows: true
    max_rows: 200
    formula_count: 10
    # 对齐致同 Excel：未审滚动 → 期初/账项调整 → 审定滚动；摊销/基础为补充区段
    # 旧 25 列三区段字段由审定滚动回写（beginBalance/currentIncrease/…）
    tab_sections:
      - name: 未审滚动
        tab_index: 0
        columns:
          - { field: projectName, label: 项目名称, type: text }
          - { field: category, label: 类别, type: select, options: [类别A, 类别B, 类别C] }
          - { field: assetType, label: 资产类型, type: select }
          - { field: projectCode, label: 项目编码, type: text }
          - { field: originalAmount, label: 初始入账金额, type: number }
          - { field: unadjOpening, label: 期初数, type: number }
          - { field: unadjIncrease, label: 本期增加, type: number }
          - { field: unadjAmortization, label: 本期摊销, type: number }
          - { field: unadjOtherDecrease, label: 其他减少, type: number }
          - { field: unadjEnding, label: 期末数, type: number, formula: "opening+increase-amort-other" }
      - name: 调整与审定
        tab_index: 1
        columns:
          - { field: openingAdj, label: 期初调整, type: number }
          - { field: ajeIncrease, label: 调整-增加, type: number }
          - { field: ajeAmortization, label: 调整-摊销, type: number }
          - { field: ajeOtherDecrease, label: 调整-其他减少, type: number }
          - { field: auditedOpening, label: 审定期初, type: number, formula: "unadj+openingAdj" }
          - { field: auditedIncrease, label: 审定增加, type: number, formula: "unadj+aje" }
          - { field: auditedAmortization, label: 审定摊销, type: number, formula: "unadj+aje" }
          - { field: auditedOtherDecrease, label: 审定其他减少, type: number, formula: "unadj+aje" }
          - { field: auditedEnding, label: 审定期末, type: number, formula: "open+inc-amort-other" }
      - name: 摊销信息
        tab_index: 2
        columns:
          - { field: expenseType, label: 费用类型, type: select, options: [装修费, 开办费, 租赁改良, 大修理, 其他] }
          - { field: amortizationMethod, label: 摊销方法, type: select, options: [直线法, 工作量法] }
          - { field: totalMonths, label: 期限(月), type: number }
          - { field: elapsedMonths, label: 已摊月数, type: number }
          - { field: monthlyAmortization, label: 月摊销额, type: number, formula: "original/months" }
      - name: 基础信息
        tab_index: 3
        columns:
          - { field: occurDate, label: 发生日期, type: date }
          - { field: contractNo, label: 合同编号, type: text }
          - { field: indexNo, label: 合同协议索引, type: text }
          - { field: remark, label: 备注, type: text }
    formulas:
      - { name: unadjEnding, target: unadjEnding, expr: "unadjOpening+unadjIncrease-unadjAmortization-unadjOtherDecrease" }
      - { name: auditedOpening, target: auditedOpening, expr: "unadjOpening+openingAdj" }
      - { name: auditedEnding, target: auditedEnding, expr: "auditedOpening+auditedIncrease-auditedAmortization-auditedOtherDecrease" }
    summary_rows:
      - { type: grand_total }
      - { type: category_subtotal, field: category }
    guidance:
      prep_notes: true
      tax_refs: [企业所得税法第十三条, 实施条例第六十八条]
      startup_cost_ban: true
    import_export: true
    add_row_prompt: project_name
    persist_keys: [I4-2-rows, I4-detail-audit-note, I4-detail-audit-conclusion]
    cross_refs:
      - ref_id: CW-I4-2-001
        target_wp: I4-1
        description: '明细审定合计 → 审定表I4-1'
        direction: outbound
      - ref_id: CW-I4-2-002
        target_wp: I4-5
        description: '本期增加 → 抽凭总体'
        direction: outbound
      - ref_id: CW-I4-2-003
        target_wp: I4-4
        description: '费用类型/受益期 → 摊销政策'
        direction: outbound
      - ref_id: CW-I4-2-004
        target_wp: I4-6
        description: '摊销测算勾稽'
        direction: outbound

  # ─────────────────────────────────────────────────────────────────────────
  # Sheet 5: 调整分录汇总I4-3
  # ─────────────────────────────────────────────────────────────────────────
  调整分录汇总I4-3:
    code: I4-3
    group: core
    dimensions: "21×10"
    component: I4TabAdjustment
    class_code: F-调整分录
    dynamic_rows: true
    columns:
      - { field: seq, label: 序号, type: number, width: 50, auto_increment: true }
      - { field: adjustment_item, label: 调整事项, type: text, width: 150 }
      - { field: entry_type, label: 类别, type: select, width: 80, options: [AJE, RJE] }
      - { field: account_code, label: 科目代码, type: text, width: 80 }
      - { field: account_name, label: 科目名称, type: text, width: 120 }
      - { field: summary, label: 摘要, type: text, width: 150 }
      - { field: debit_amount, label: 借方, type: number, width: 100 }
      - { field: credit_amount, label: 贷方, type: number, width: 100 }
      - { field: index_ref, label: 索引, type: index_chip, width: 80 }
      - { field: remark, label: 备注, type: text, width: 100 }
    formulas:
      - { name: isDebitCreditBalanced, target: balance_check, expr: "|SUM(debits) - SUM(credits)| < 0.01" }
    highlights:
      - { condition: "debit_credit_imbalanced", style: red, show_diff: true }
    import_export: false
    add_row_prompt: adjustment_item
    event_bus:
      publish:
        - { event: "adjustment:created", payload: "{entryType, accountCode, amount}" }
    cross_refs:
      - ref_id: CW-I4-3-001
        target_wp: I4-1
        description: 'AJE/RJE汇总 → 审定表I4-1'
        severity: required
        direction: outbound
      - ref_id: CW-I4-3-002
        target_wp: A13
        description: '调整分录 → A13错报汇总'
        direction: outbound

  # ─────────────────────────────────────────────────────────────────────────
  # Sheet 6: 摊销政策检查表I4-4
  # ─────────────────────────────────────────────────────────────────────────
  摊销政策检查表I4-4:
    code: I4-4
    group: core
    dimensions: "30×8"
    component: I4TabPolicyCheck
    class_code: D-段落检查
    layout_type: paragraph
    standards_ref: [CAS4, 企业所得税法第十三条]
    check_items:
      - { id: amort_method_appropriate, label: 摊销方法选择是否适当, type: conclusion, options: [适当, 不适当, 不适用] }
      - { id: benefit_period_reasonable, label: 受益期估计是否合理, type: conclusion, options: [合理, 不合理, 不适用] }
      - { id: policy_consistent, label: 摊销政策是否与上年一致, type: conclusion, options: [一致, 有变更, 不适用] }
      - { id: change_treatment, label: 变更处理是否合规, type: conclusion, options: [合规, 不合规, 不适用] }
      - { id: fully_amortized_cleared, label: 已摊完项目是否及时转销, type: conclusion, options: [已转销, 未转销, 不适用] }
    guidance:
      top_area: blue_gradient_steps
      methodology_context: amber_left_border

  # ─────────────────────────────────────────────────────────────────────────
  # Sheet 7: 针对性检查表I4-5
  # ─────────────────────────────────────────────────────────────────────────
  针对性检查表I4-5:
    code: I4-5
    group: core
    dimensions: "28×17"
    component: I4TabTargetedCheck
    class_code: C-抽凭检查
    layout_type: voucher_matrix
    standards_ref: [CAS4]
    # 对齐致同 Excel：凭证抽查主路径；大额新增/受益期/提前终止段落为可选补充
    # Excel 缺口已补：第5项核对、#DIV/0!→N/A、特定/抽样分层、所有权→资本化归属
    test_objectives:
      - 通过针对性测试，验证长期待摊费用的存在/发生、权利和义务（资本化归属）、计价和分摊（入账价值与受益期）
      - 抽查相关记账凭证与支持性文件，评价资本化判断、期间归属及与 I4-2 明细一致性是否恰当
    test_reasons: [大额, 关联方, 受益期变更, 提前终止, 其他]
    test_content:
      - 原始凭证是否齐全
      - 记账凭证与原始凭证是否相符
      - 账务处理是否正确（资本化/费用化判断是否满足资产确认条件）
      - 是否记录于恰当的会计期间
      - 入账价值、摊销起点与受益期与 I4-2 明细表一致
    columns:
      - { field: selectionReason, label: 选取原因, type: select, options: [大额, 关联方, 受益期变更, 提前终止, 其他] }
      - { field: projectName, label: 项目明细, type: text }
      - { field: voucherDate, label: 日期, type: date }
      - { field: voucherNo, label: 凭证编号, type: text }
      - { field: businessDesc, label: 业务内容, type: text }
      - { field: counterpartAccount, label: 对方科目, type: text }
      - { field: counterpartDetail, label: 对方明细科目, type: text }
      - { field: debitAmount, label: 借方金额, type: number }
      - { field: creditAmount, label: 贷方金额, type: number }
      - { field: supportingDocs, label: 支持性文件, type: text }
      - { field: check1, label: 核对1, type: select, options: [√, ×, N/A] }
      - { field: check2, label: 核对2, type: select, options: [√, ×, N/A] }
      - { field: check3, label: 核对3, type: select, options: [√, ×, N/A] }
      - { field: check4, label: 核对4, type: select, options: [√, ×, N/A] }
      - { field: check5, label: 核对5, type: select, options: [√, ×, N/A] }
      - { field: indexRef, label: 索引号, type: text }
      - { field: isAbnormal, label: 是否异常, type: select, options: [否, 是, 入账差异, 资本化不当, 跨期, 受益期不一致, 其他] }
      - { field: remark, label: 备注说明, type: text }
    formulas:
      - { name: sumDebit, target: checkedDebitTotal, expr: "SUM(debitAmount)" }
      - { name: sumCredit, target: checkedCreditTotal, expr: "SUM(creditAmount)" }
      - { name: coverageRate, target: coverageRate, expr: "IF(periodDebit>0, checkedDebit/periodDebit, N/A)" }
      - { name: layeredCoverage, target: layeredCoverageLabel, expr: "specific% + sampling%" }
    persist_keys: [I4-5-rows, I4-5-sample-meta, I4-5-risk-focus, I4-5-audit-note, I4-5-audit-conclusion]
    cross_refs:
      - { ref_id: CW-I4-5-001, target_wp: I4-2, description: '本期发生额 ← I4-2', direction: inbound }
      - { ref_id: CW-I4-5-002, target_wp: I4-4, description: '摊销政策交叉印证', direction: outbound }
      - { ref_id: CW-I4-5-003, target_wp: I4-3, description: '核对×调整草稿 →', direction: outbound }
      - { ref_id: CW-I4-5-004, target_wp: I4-6, description: '摊销测算勾稽 →', direction: outbound }
    guidance:
      methodology_context: amber_left_border
      coverage_zero_guard: show_NA_not_DIV0
      optional_risk_focus: [大额新增核查, 受益期变更, 提前终止处理]
    sampling:
      account_code: "1801"
      engine: GtVoucherSamplingEngine

  # ─────────────────────────────────────────────────────────────────────────
  # Sheet 8: 摊销测算表I4-6直线法（对齐源表：测算 vs 账面 vs 差异）
  # ─────────────────────────────────────────────────────────────────────────
  摊销测算表I4-6直线法:
    code: I4-6
    group: amortization
    dimensions: "65×28"
    component: I4TabAmortizationStraight
    class_code: G-测算
    dynamic_rows: true
    max_rows: 200
    formula_count: 39
    columns:
      - { field: category, label: 类别名称, type: text, width: 120 }
      - { field: item_name, label: 明细项目, type: text, width: 120 }
      - { field: original_amount, label: 原值, type: number, width: 105 }
      - { field: book_accum_amort, label: 累计摊销, type: number, width: 105 }
      - { field: start_date, label: 开始使用日期, type: date, width: 130 }
      - { field: useful_life, label: 使用年限, type: text, width: 90 }
      - { field: book_monthly_amort, label: 账面月摊销额, type: number, width: 110 }
      - { field: life_months, label: 使用月限, type: number, width: 80, formula: "parseUsefulLifeToMonths(usefulLife)" }
      - { field: full_amort_date, label: 测算到期日, type: date, width: 110, formula: "startDate + lifeMonths - 1day" }
      - { field: months_amortized, label: 已摊销月份, type: number, width: 90 }
      - { field: remaining_months, label: 剩余摊销月份, type: number, width: 100, formula: "lifeMonths - monthsAmortized" }
      - { field: period_months, label: 本期摊销月份, type: number, width: 100 }
      - { field: calc_monthly_amort, label: 测算月摊销额, type: number, width: 110, formula: "originalAmount / lifeMonths" }
      - { field: period_amortization, label: 当期摊销, type: number, width: 110, formula: "calcMonthlyAmort × periodMonths" }
      - { field: monthly_diff, label: 月摊销额差异, type: number, width: 110, formula: "bookMonthlyAmort - calcMonthlyAmort" }
      - { field: calc_accum_amort, label: 累计摊销费用, type: number, width: 110, formula: "calcMonthlyAmort × monthsAmortized" }
      - { field: accum_diff, label: 累计摊销额差异, type: number, width: 120, formula: "bookAccumAmort - calcAccumAmort" }
      - { field: remark, label: 备注, type: text, width: 100 }
    formulas:
      - { name: calcMonthlyAmort, target: calc_monthly_amort, expr: "originalAmount / lifeMonths" }
      - { name: calcPeriodAmort, target: period_amortization, expr: "calcMonthlyAmort × periodMonths" }
      - { name: calcMonthlyDiff, target: monthly_diff, expr: "bookMonthlyAmort - calcMonthlyAmort" }
      - { name: calcAccumAmort, target: calc_accum_amort, expr: "calcMonthlyAmort × monthsAmortized" }
      - { name: calcAccumDiff, target: accum_diff, expr: "bookAccumAmort - calcAccumAmort" }
    highlights:
      - { condition: "abs(monthly_diff) > 0.01", style: orange, tooltip: "月摊销差异" }
      - { condition: "abs(accum_diff) > 0.01", style: orange, tooltip: "累计摊销差异" }
      - { condition: "remaining_months <= 0", style: green, tooltip: "已摊完" }
    import_export: true
    add_row_prompt: item_name
    cross_refs:
      - ref_id: CW-I4-6-001
        target_wp: I4-1
        description: '当期摊销合计 → 审定表I4-1本期摊销'
        direction: outbound

