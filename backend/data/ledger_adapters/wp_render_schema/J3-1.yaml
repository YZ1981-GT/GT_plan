# backend/data/wp_render_schema/J3-1.yaml
# 股份支付审定表 — d-form-table 渲染 schema
# Requirements: §5.3（J3 股份支付）
# Design: §3 审定表标准字段
# Template: J3 股份支付.xlsx
#
# 结构：权益结算股份支付 / 现金结算股份支付 → 合计

wp_code: J3-1
wp_name: 股份支付审定表
component_type: d-form-table
template_path: backend/wp_templates/J/J3 股份支付.xlsx
template_version: v2025-R5
applicable_standards: [soe_standalone, listed_standalone, soe_consolidated, listed_consolidated]
related_accounts:
  - code: '2711'
    name: 股份支付

# ═══════════════════════════════════════════════════════════════════════════════
# 审定表 — 按股份支付类型分行
# 结构：权益结算股份支付 / 现金结算股份支付 → 合计
# ═══════════════════════════════════════════════════════════════════════════════

sections:
  - name: 权益结算股份支付
    group_key: equity_settled
    row_type: category_row
    account_code_prefix: '271101'
    fields: &audit_determination_fields
      - { field: category_name, label: 项目名称, type: text, readonly: true }
      - { field: account_code, label: 科目编码, type: text, readonly: true }
      - { field: account_name, label: 科目名称, type: text, readonly: true }
      - { field: opening_balance, label: 期初余额, type: number, auto_source: trial_balance.opening_balance }
      - { field: unadjusted_amount, label: 未审金额, type: number, auto_source: trial_balance.unadjusted_amount }
      - { field: aje_debit, label: 审计调整借方, type: number }
      - { field: aje_credit, label: 审计调整贷方, type: number }
      - { field: rje_debit, label: 重分类调整借方, type: number }
      - { field: rje_credit, label: 重分类调整贷方, type: number }
      - { field: audited_amount, label: 审定金额, type: number, formula: "unadjusted_amount + aje_debit - aje_credit + rje_debit - rje_credit" }
      - { field: prior_year_audited, label: 上年审定金额, type: number, auto_source: trial_balance.prior_audited }
      - { field: variance_amount, label: 变动金额, type: number, formula: "audited_amount - prior_year_audited" }
      - { field: variance_pct, label: 变动比例, type: percent, formula: "variance_amount / prior_year_audited" }
      - { field: variance_note, label: 差异说明, type: textarea }

  - name: 现金结算股份支付
    group_key: cash_settled
    row_type: category_row
    account_code_prefix: '271102'
    fields: *audit_determination_fields

  # ─── 合计行 ─────────────────────────────────────────────────────────────────
  - name: 股份支付合计
    row_type: total
    formula_source: "SUM(权益结算股份支付, 现金结算股份支付)"
    fields: *audit_determination_fields

# ═══════════════════════════════════════════════════════════════════════════════
# 联动配置
# ═══════════════════════════════════════════════════════════════════════════════

writeback:
  target: trial_balance.audited_amount
  trigger: WORKPAPER_SAVED
  handler: _on_d_audit_determination_saved
  match_pattern: "^[D-N]\\d+-1$"
  key_field: account_code
  value_field: audited_amount

# ═══════════════════════════════════════════════════════════════════════════════
# 跨底稿引用
# ═══════════════════════════════════════════════════════════════════════════════

cross_refs:
  - ref_id: CW-J3-1-001
    target_wp: J3-6
    target_field: 调整分录汇总
    description: '审定表调整金额 → J3-6 调整分录汇总'
    severity: required
    direction: outbound

  - ref_id: CW-J3-1-002
    target_wp: J3-4
    target_field: 期权公允价值
    description: '审定依据 ← J3-4 期权公允价值测算'
    severity: info
    direction: inbound

  - ref_id: CW-J3-1-003
    target_wp: J3-5
    target_field: 等待期费用分摊
    description: '审定依据 ← J3-5 等待期费用分摊验证'
    severity: info
    direction: inbound

  - ref_id: CW-J3-1-004
    target_wp: M4
    target_field: 资本公积
    description: '权益结算金额 → M4 资本公积（其他资本公积）'
    severity: info
    direction: outbound
