# backend/data/wp_render_schema/F2-1.yaml
# 存货审定表 — d-form-table 渲染 schema（降级/元数据）
# Requirements: F2-1 审定表
# Template: F2-1至F2-14 存货及跌价准备-审定明细表类（Leap-常规程序）.xlsx / sheet: 存货审定表F2-1
# 真实结构：三区块（一、原值 二、跌价准备 三、账面价值净额），各存货类别行从明细汇总表F2-2取数
#           原值：期初/本期增加/本期减少/期末（E=B+C-D）；类别含原材料/在途/周转材料/自制半成品/委托加工/库存商品/发出商品/开发产品/开发成本/合同履约成本/消耗性生物资产
# 修订(2026-07-01)：修正公式列AJE/RJE→期初+增减=期末结构；cross_ref调整分录F2-13→F2-14；跌价准备明细F2-11→F2-47

wp_code: F2-1
wp_name: 存货审定表
component_type: d-form-table
template_path: backend/wp_templates/F/F2-1至F2-14 存货及跌价准备-审定明细表类（Leap-常规程序）.xlsx
template_version: v2025-R5
applicable_standards: [soe_standalone, listed_standalone, soe_consolidated, listed_consolidated]
related_accounts:
  - code: '1401'
    name: 材料采购
  - code: '1402'
    name: 在途物资
  - code: '1403'
    name: 原材料
  - code: '1404'
    name: 材料成本差异
  - code: '1405'
    name: 库存商品
  - code: '1406'
    name: 发出商品
  - code: '1407'
    name: 商品进销差价
  - code: '1408'
    name: 委托加工物资
  - code: '1411'
    name: 周转材料
  - code: '1421'
    name: 消耗性生物资产
  - code: '1461'
    name: 存货跌价准备
  - code: '1471'
    name: 合同履约成本

# ═══════════════════════════════════════════════════════════════════════════════
# 三区块结构（真实模板 F2-1，实读校准 2026-07-02）：
#   一、原值：三层纵向（未审数 / 账项调整 / 审定数（原值）），每层13类别行
#   二、跌价准备：三层纵向（未审数 / 账项调整 / 审定数（跌价准备）），每层13类别
#   三、净值：审定数（净值）= 原值审定 - 跌价准备审定
#   列：期初数(B)/本期增加(C)/本期减少(D)/期末数(E=B+C-D)/索引
#   13类别：原材料/材料采购在途物资/周转材料低值易耗品包装物/在产品/自制半成品/
#           委托加工物资/库存商品/发出商品/开发产品/开发成本/合同履约成本/
#           消耗性生物资产/数据资源
#   表尾：试算平衡表数 / 差异数 / 审计说明 / 审计结论
# 修订(2026-07-02)：实读F2-1模板校准——原/跌价各为未审+账项调整+审定三层纵向结构
#   (非期初/期末两列)；补全在产品+数据资源两类；净值仅审定数一层
# ═══════════════════════════════════════════════════════════════════════════════

# 存货13类别（各区块各层通用）
inventory_categories: &inventory_categories
  - 原材料
  - 材料采购/在途物资
  - 周转材料/低值易耗品/包装物
  - 在产品
  - 自制半成品
  - 委托加工物资
  - 库存商品
  - 发出商品
  - 开发产品
  - 开发成本
  - 合同履约成本
  - 消耗性生物资产
  - 数据资源

sections:
  - name: 一、原值
    tiers: [未审数, 账项调整, 审定数（原值）]   # 三层纵向，各层13类别
    categories: *inventory_categories
    row_layout: tiered_category_rows    # 未审数从明细汇总表F2-2取数；审定数=未审+账项调整
    fields: &inventory_fields
      - { field: item_name, label: 项目, type: text, readonly: true }
      - { field: opening_balance, label: 期初数, type: number }
      - { field: period_increase, label: 本期增加, type: number }
      - { field: period_decrease, label: 本期减少, type: number }
      - { field: ending_balance, label: 期末数, type: number, formula: "opening_balance + period_increase - period_decrease" }
      - { field: index_ref, label: 索引, type: text }

  - name: 二、跌价准备
    account_code_prefix: '1461'
    tiers: [未审数, 账项调整, 审定数（跌价准备）]  # 三层纵向，各层13类别
    categories: *inventory_categories
    row_layout: tiered_category_rows    # 未审数从F2-47跌价准备测试表取数
    fields: *inventory_fields

  - name: 三、净值
    row_type: net
    tiers: [审定数（净值）]              # 仅审定数一层
    categories: *inventory_categories
    formula_source: "原值审定 - 跌价准备审定"
    fields: *inventory_fields

# ═══════════════════════════════════════════════════════════════════════════════
# 联动配置
# ═══════════════════════════════════════════════════════════════════════════════

writeback:
  target: trial_balance.audited_amount
  trigger: WORKPAPER_SAVED
  handler: _on_d_audit_determination_saved
  match_pattern: "^[D-N]\\d+-1$"
  key_field: account_code
  value_field: ending_balance

# ═══════════════════════════════════════════════════════════════════════════════
# 跨底稿引用
# ═══════════════════════════════════════════════════════════════════════════════

cross_refs:
  - ref_id: CW-F2-1-001
    target_wp: F2-2
    target_field: 明细汇总表合计
    description: '存货原值各类审定 ← F2-2 明细汇总表（各明细表F2-3~F2-13汇总）'
    severity: info
    direction: inbound

  - ref_id: CW-F2-1-002
    target_wp: F2-47
    target_field: 跌价准备测算
    description: '跌价准备 ← F2-47 跌价准备测试表'
    severity: info
    direction: inbound

  - ref_id: CW-F2-1-003
    target_wp: F2-14
    target_field: 调整分录汇总
    description: '审定表调整 ← F2-14 调整分录汇总'
    severity: required
    direction: inbound

  - ref_id: CW-F2-1-004
    target_wp: F5-1
    target_field: 营业成本审定金额
    description: '存货审定 → F5 营业成本成本结转验证（F5-6数量核对/F5-7倒轧）'
    severity: info
    direction: outbound

