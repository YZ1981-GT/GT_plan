# backend/data/wp_render_schema/G7-1.yaml
# 长期股权投资审定表 — d-form-table 渲染 schema（降级/元数据）
# Template: G7 长期股权投资.xlsx / sheet: 长期股权投资审定表G7-1
# 真实结构：按被投资单位分行(权益法/成本法分组)，审定数=未审数+账项调整(单列)；减值准备扣减+净额
# 修订(2026-07-01)：修正公式列AJE/RJE四列→账项调整单列；cross_ref调整分录G7-8→G7-3/权益法G7-3→G7-14/减值G7-4→G7-17

wp_code: G7-1
wp_name: 长期股权投资审定表
component_type: d-form-table
template_path: backend/wp_templates/G/G7 长期股权投资.xlsx
template_version: v2025-R5
applicable_standards: [soe_standalone, listed_standalone, soe_consolidated, listed_consolidated]
related_accounts:
  - code: '1511'
    name: 长期股权投资
  - code: '1512'
    name: 长期股权投资减值准备

# ═══════════════════════════════════════════════════════════════════════════════
# 审定表 — 按被投资单位分行 + 权益法/成本法分组 + 减值准备扣减 + 净额
# 期初/期末各含：未审数/账项调整/审定数(=未审数+账项调整)
# ═══════════════════════════════════════════════════════════════════════════════

sections:
  - name: 权益法核算
    group_key: equity_method
    row_type: group_header
    dynamic_rows: true
    row_source: investee_list
    row_filter: "method == 'equity'"
    fields: &audit_determination_fields
      - { field: investee_name, label: 被投资单位, type: text }
      - { field: opening_unaudited, label: 期初未审数, type: number, auto_source: trial_balance.opening_balance }
      - { field: opening_adjustment, label: 期初账项调整, type: number }
      - { field: opening_audited, label: 期初审定数, type: number, formula: "opening_unaudited + opening_adjustment" }
      - { field: ending_unaudited, label: 期末未审数, type: number, auto_source: trial_balance.unadjusted_amount }
      - { field: ending_adjustment, label: 期末账项调整, type: number }
      - { field: ending_audited, label: 期末审定数, type: number, formula: "ending_unaudited + ending_adjustment" }
      - { field: variance_amount, label: 变动额, type: number, formula: "ending_audited - opening_audited" }
      - { field: variance_pct, label: 变动率, type: percent, formula: "variance_amount / opening_audited" }
      - { field: variance_note, label: 原因分析, type: textarea }

  - name: 权益法小计
    row_type: subtotal
    formula_source: "SUM(权益法核算)"
    fields: *audit_determination_fields

  - name: 成本法核算
    group_key: cost_method
    row_type: group_header
    dynamic_rows: true
    row_source: investee_list
    row_filter: "method == 'cost'"
    fields: *audit_determination_fields

  - name: 成本法小计
    row_type: subtotal
    formula_source: "SUM(成本法核算)"
    fields: *audit_determination_fields

  - name: 长期股权投资合计
    row_type: total
    formula_source: "权益法小计 + 成本法小计"
    fields: *audit_determination_fields

  - name: 减：长期股权投资减值准备
    account_code_prefix: '1512'
    row_type: deduction
    fields: *audit_determination_fields

  - name: 长期股权投资净额
    row_type: net
    formula_source: "长期股权投资合计 - 减：长期股权投资减值准备"
    fields: *audit_determination_fields

# ═══════════════════════════════════════════════════════════════════════════════
# 联动配置
# ═══════════════════════════════════════════════════════════════════════════════

writeback:
  target: trial_balance.audited_amount
  trigger: WORKPAPER_SAVED
  handler: _on_d_audit_determination_saved
  match_pattern: "^[D-N]\\d+-1$"
  key_field: account_code
  value_field: ending_audited

# ═══════════════════════════════════════════════════════════════════════════════
# 跨底稿引用（真实：G7-3调整分录/G7-14权益法测算/G7-17减值测试）
# ═══════════════════════════════════════════════════════════════════════════════

cross_refs:
  - ref_id: CW-G7-1-001
    target_wp: G7-3
    target_field: 调整分录汇总
    description: '审定表账项调整 ← G7-3 调整分录汇总'
    severity: required
    direction: inbound

  - ref_id: CW-G7-1-002
    target_wp: G7-14
    target_field: 权益法测算
    description: '权益法审定 ← G7-14 权益法测算表'
    severity: info
    direction: inbound

  - ref_id: CW-G7-1-003
    target_wp: G7-17
    target_field: 减值测试
    description: '减值准备扣减 ← G7-17 减值测试表'
    severity: info
    direction: inbound
