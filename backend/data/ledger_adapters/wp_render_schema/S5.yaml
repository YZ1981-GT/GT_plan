# S5 债务重组 — 专属渲染 schema
# component_type: s5-debt-restructuring
# Template: S5 债务重组202401.xlsx
# 整册统一路由到 GtS5DebtRestructuring，前端按 sheetName v-if 分发

wp_code: S5
wp_name: 债务重组
component_type: s5-debt-restructuring
template_path: backend/wp_templates/S/S5 债务重组202401.xlsx
template_version: v2025-R5
applicable_standards: [soe_standalone, listed_standalone, soe_consolidated, listed_consolidated]

# 整册专属组件：前端按 sheetName v-if 分发
whole_workbook_dedicated: true

sheets:
  - sheet_name: 债务重组审计程序S5
    internal_type: sheet-audit-program
    description: 债务重组审计程序表
    has_formulas: true
    formula_count: 4

  - sheet_name: 审定表S5-1
    internal_type: sheet-adjudication
    description: 债务重组审定表（债权人/债务人视角 + 损益计算）
    has_formulas: true
    formula_count: 7

  - sheet_name: 债务重组损益确认时点S5-2
    internal_type: sheet-judgment
    description: 损益确认时点判断（不得提前确认重组损益）
    has_formulas: true
    formula_count: 4

# 公式引擎元数据
formula_engine:
  name: useS5FormulaEngine
  type: pure_function
  functions:
    - calcCreditorGainLoss: "债权人重组损益（按源模板口径）"
    - calcDebtorGainLoss: "debtBook - assetBook - equityFair"
  zero_protection: []

# 重要提示
warnings:
  - "不得提前确认重组损益"
  - "债权人须关注减值准备转回"

# 非经常性损益标注
non_recurring_gain_loss: true
