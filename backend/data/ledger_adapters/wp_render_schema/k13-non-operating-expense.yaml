# backend/data/wp_render_schema/k13-non-operating-expense.yaml
# K13 营业外支出 — 专属组件渲染 schema
# componentType: k13-non-operating-expense
# 科目 6711 营业外支出（**损益类/借方科目！取发生额非余额**）
# Template: K13 营业外支出.xlsx（9 有效 sheet）
# 公式特征：净发生额=借方-贷方；审定=未审+AJE+RJE；按去向分行明细
# K循环损益类最简底稿（借方科目，与日常活动无关的损失）

wp_code: K13
wp_name: 营业外支出
component_type: k13-non-operating-expense
selfLoad: true
template_path: backend/wp_templates/K/K13 营业外支出.xlsx
template_version: v2025-R5
applicable_standards: [soe_standalone, listed_standalone, soe_consolidated, listed_consolidated]
account_codes: ['6711']
income_statement: true  # 损益类标识！
related_accounts:
  - code: '6711'
    name: 营业外支出
    direction: debit
    category: income_statement

special_rules:
  income_statement: true
  account_direction: debit  # 借方科目！（支出类）
  net_formula: "借方发生-贷方发生"
  source_table: "tb_ledger"  # 从tb_ledger取数
  non_operating_classification: true
  tax_deductibility: true  # K13核心关注：税前扣除性
  vs_operating_expense: "管理费用(K8)/销售费用(K7)"  # 与日常活动相关→费用类

formula_count: 90
description: K循环损益类最简底稿（9sheet，损益类取发生额+营业外支出按去向分类+税前扣除性）

# ═══════════════════════════════════════════════════════════════════════════════
# TB 回写配置（损益类！回写发生额而非期末余额）
# ═══════════════════════════════════════════════════════════════════════════════

tb_writeback:
  account_code: '6711'
  direction: debit
  source_sheet: K13-1
  value_field: audited_amount  # 审定发生额
  value_type: occurrence_amount  # 发生额非余额！
  trigger: WORKPAPER_SAVED

# ═══════════════════════════════════════════════════════════════════════════════
# AI 生成配置
# ═══════════════════════════════════════════════════════════════════════════════

ai_sections:
  - id: non-operating-eval
    name: 营业外支出分类评价
    description: 营业外支出按去向分析+分类正确性+税前扣除性评价
    location: K13-1审定表底部
  - id: overall-opinion
    name: 总体审计意见
    description: K13底稿总体审计结论
    location: K13-1审定表结论区

# ═══════════════════════════════════════════════════════════════════════════════
# 跨底稿引用
# ═══════════════════════════════════════════════════════════════════════════════

cross_wp_references:
  - ref_id: CW-K13-01
    source_wp: K13-2
    target_wp: K13-1
    description: '明细表合计 → 审定表K13-1净发生额'
    direction: outbound
  - ref_id: CW-K13-02
    source_wp: K13-3
    target_wp: K13-1
    description: 'AJE/RJE汇总 → 审定表K13-1'
    direction: outbound
  - ref_id: CW-K13-03
    source_wp: K13-3
    target_wp: A13
    description: '调整分录 → A13错报汇总'
    direction: outbound
  - ref_id: CW-K13-04
    source_wp: K13-4
    target_wp: K13-2
    description: '检查表分类核对 → 明细表'
    direction: outbound

# ═══════════════════════════════════════════════════════════════════════════════
# Sheet 定义（9 sheets，含K13A程序表+底稿目录）
# ═══════════════════════════════════════════════════════════════════════════════

sheets:
  # ─────────────────────────────────────────────────────────────────────────
  # Sheet 1: 底稿目录
  # ─────────────────────────────────────────────────────────────────────────
  底稿目录:
    code: K13
    group: core
    dimensions: "15×8"
    component: K13TabIndex
    class_code: B-底稿目录

  # ─────────────────────────────────────────────────────────────────────────
  # Sheet 2: 营业外支出实质性程序表K13A
  # ─────────────────────────────────────────────────────────────────────────
  营业外支出实质性程序表K13A:
    code: K13A
    group: core
    dimensions: "20×11"
    component: a-program-console
    class_code: A-实质性程序

  # ─────────────────────────────────────────────────────────────────────────
  # Sheet 3: 审定表K13-1（69公式！损益类！取发生额，借方科目）
  # ─────────────────────────────────────────────────────────────────────────
  审定表K13-1:
    code: K13-1
    group: core
    dimensions: "19×11"
    component: K13TabAdjudication
    class_code: F-审定表
    account_codes: ['6711']
    formula_count: 69
    income_statement: true
    writeback:
      target: trial_balance.audited_amount
      trigger: WORKPAPER_SAVED
      key_field: account_code
      value_field: audited_amount
      value_type: occurrence_amount
      accounts: ['6711']
    event_bus:
      publish:
        - { event: "substantive:adjudicated", payload: "{accountCode:'6711', adjudicatedAmount}" }
      subscribe:
        - { event: "adjustment:created", filter: "accountCode=6711" }

  # ─────────────────────────────────────────────────────────────────────────
  # Sheet 4: 明细表K13-2（26列3区段，27行）
  # ─────────────────────────────────────────────────────────────────────────
  明细表K13-2:
    code: K13-2
    group: core
    dimensions: "27×26"
    component: K13TabDetail
    class_code: F-明细表
    dynamic_rows: true
    max_rows: 200
    formula_count: 31
    import_export: true
    add_row_prompt: nonOperatingExpenseItem
    segments:
      - { name: "基础", columns: "序号/支出去向/支出类型/对方单位/金额/发生日期" }
      - { name: "分析", columns: "占比/同比/说明" }
      - { name: "检查", columns: "依据文件/审批/凭证号/税前扣除性/结论/备注" }

  # ─────────────────────────────────────────────────────────────────────────
  # Sheet 5: 调整分录汇总K13-3
  # ─────────────────────────────────────────────────────────────────────────
  调整分录汇总K13-3:
    code: K13-3
    group: core
    dimensions: "21×10"
    component: K13TabAdjustment
    class_code: F-调整分录
    dynamic_rows: true
    import_export: true
    event_bus:
      publish:
        - { event: "adjustment:created", payload: "{entryType, accountCode, amount}" }

  # ─────────────────────────────────────────────────────────────────────────
  # Sheet 6: 营业外支出检查表K13-4
  # ─────────────────────────────────────────────────────────────────────────
  营业外支出检查表K13-4:
    code: K13-4
    group: core
    dimensions: "30×12"
    component: K13TabNonOperatingCheck
    class_code: F-检查表
    check_items:
      - 真实性
      - 依据合规
      - 审批完整
      - 分类正确性(与日常活动无关)
      - 期间归属
      - 税前扣除性(捐赠/罚款税务处理)

  # ─────────────────────────────────────────────────────────────────────────
  # Sheet 7: 附注披露信息（上市公司）
  # ─────────────────────────────────────────────────────────────────────────
  附注披露信息（上市公司）:
    code: disc-listed
    group: disclosure
    dimensions: "30×14"
    component: K13TabDisclosureListed
    class_code: H-附注
    variant: listed
    event_bus:
      subscribe:
        - { event: "substantive:adjudicated", filter: "accountCode=6711" }
      publish:
        - { event: "disclosure:note-text-updated", payload: "{noteId:'non_operating_expense'}" }

  # ─────────────────────────────────────────────────────────────────────────
  # Sheet 8: 附注披露信息（国有企业）
  # ─────────────────────────────────────────────────────────────────────────
  附注披露信息（国有企业）:
    code: disc-soe
    group: disclosure
    dimensions: "18×5"
    component: K13TabDisclosureSoe
    class_code: H-附注
    variant: soe
    event_bus:
      subscribe:
        - { event: "substantive:adjudicated", filter: "accountCode=6711" }
      publish:
        - { event: "disclosure:note-text-updated", payload: "{noteId:'non_operating_expense'}" }
