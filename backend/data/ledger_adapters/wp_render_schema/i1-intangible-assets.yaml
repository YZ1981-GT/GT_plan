    - { code: I1-6, name: 减少明细 }
    - { code: I1-8, name: 权属检查 }
    - { code: I1-9, name: 摊销分配 }
    - { code: I1-10, name: 摊销测算(不含减值) }
    - { code: I1-11, name: 摊销测算(含减值) }

# ═══════════════════════════════════════════════════════════════════════════════
# 摊销分支选择器
# ═══════════════════════════════════════════════════════════════════════════════

branch_selector:
  field: amortization_branch
  type: el-segmented
  options:
    - { value: no_impairment, label: "不含减值（I1-10）", sheet: I1-10 }
    - { value: with_impairment, label: "含减值（I1-11）", sheet: I1-11 }
  default: no_impairment
  storage_key: i1-amort-branch

# ═══════════════════════════════════════════════════════════════════════════════
# 双模式 + 六大集成
# ═══════════════════════════════════════════════════════════════════════════════

dual_mode:
  composable: useI1DualMode
  storage_key: i1-intangible-mode
  default: html

integrations:
  version_trail: { composable: useVersionTrail, auto_snapshot: true }
  voucher_sampling: { sheet: I1A, mode: dialog }
  cutoff_auto_sampling: { composable: useCutoffAutoSampling }
  event_bus:
    subscribe: ["substantive:adjudicated", "adjustment:created"]
    publish: ["substantive:adjudicated", "disclosure:note-text-updated"]
  ocr: { sheets: [I1-5], endpoint: "/d4/contract-ocr" }
  review_dialog: { provide: openReviewDialog, position: section_title_right }

