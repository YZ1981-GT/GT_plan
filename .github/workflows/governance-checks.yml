    # ①推自造 4 行（模板要 15 行四层）②列 3 vs 5 且位置化 values:[期末,期初] 顺序与模板
    # 相反 → 期末余额落进期初余额列 ③`_note_texts` 放载荷顶层被 pydantic 静默丢弃
    # ④syncToNote 内自调度 scheduleAutoSync → 周期重复 POST 且骗过覆盖率守卫。
    # 另固化「上市侧无油气资产章节」（源 xlsx 有上市 sheet，易被误认为缺章节而凭空新建）。
