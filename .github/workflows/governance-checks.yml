          # 脚本尚未创建时优雅跳过
          if [ -f "backend/scripts/check/check_coverage_ledger.py" ]; then
            python backend/scripts/check/check_coverage_ledger.py --strict
          else
            echo "::warning::check_coverage_ledger.py 尚未创建，跳过"
          fi

  acnr-consumer-coverage:
    # ACNR Req-11: Consumer Coverage 真实扫描器
    # 扫描 backend/app/ 下 address_registry. 直接调用，阻断未登记的新增消费者
