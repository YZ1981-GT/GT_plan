    # 背景：五、13 的第 2 张表名是**段落文本泄漏**（`[披露与合同取得成本有关的资产…例如：`）
    # 且 `headers[0]` 是类别列 `[佣金支出]`（md 重建丢了空的标签列首格）；第 3 张表名是
