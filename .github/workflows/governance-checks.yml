  note-bold-marker-hygiene:
    # 平台级：附注模板不得残留 markdown 粗体标记 `**`
    # （h-cycle-legacy-cleanup-and-platform-hygiene R1）
    # 背景：`rebuild_note_from_md.py` 把 md 的 `**` 原样搬进 `text_sections` /
    # `tables[].guidance`，而附注正文 `text_content` 与 docx 导出都按纯文本渲染
    # → 用户看到字面的 `**`。实测 58 处 / 69 对（listed 49 / soe 9）。
    # 🔴 只做**成对**剥离：两段 `**` 是不成对的脱敏占位（`诉讼金额为**元`），
    # 无脑 replace 会破坏语义。守卫双向锁死（成对必抓 / 不成对必放行）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check no paired bold markers in note templates
        run: python backend/scripts/fix/fix_note_bold_markers.py --check
      - name: Install test dependencies
        run: python -m pip install pytest==8.4.2 hypothesis==6.112.1
      - name: Run bold-marker hygiene tests
        run: python -m pytest backend/tests/test_note_bold_marker_hygiene.py -q

  h-cycle-ai-wiring:
    # H 循环披露 Tab 的 AI / 复核接线守卫
    # （h-cycle-legacy-cleanup-and-platform-hygiene R2 / R3）
    # 三种「按钮可见可点但零网络请求」的形态（各已实测）：
    # ① marker stub 空转（只写 ai-trigger checklist 标记）—— K5/K7 曾中招
    # ② 孤儿事件 `emit('open-ai')` 而宿主未声明处理器 —— **H8/H9 四个 Tab**，本 spec 修
    # ③ context 传字符串（后端要 dict[str,str] → 422 被 catch 静默吞）—— K3 曾中招
    # 另拦：H1/H2/H4/H5/H6 披露文本域缺 AI 按钮；H5 两版文本无持久化（刷新即丢）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: audit-platform/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: audit-platform/frontend
        run: npm ci
      - name: Run H cycle AI wiring guard
        working-directory: audit-platform/frontend
        run: npx vitest run src/components/workpaper/composables/__tests__/hDisclosureAiWiring.spec.ts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest==8.4.2
      - name: Run H cycle prompt registration guard
        run: python -m pytest backend/tests/test_review_dialog_h_cycle_prompts.py -q

  note-section-map-naming:
    # 平台级：凡有披露映射/载荷文件的循环都必须能被 registry 生成器扫到
    # （h-cycle-legacy-cleanup-and-platform-hygiene R4）
    # 三种让循环从 note_workpaper_sync_registry.json 静默消失的根因（各已实测）：
    # ① 缺 {code}NoteSectionMap.ts 薄壳（H4）
    # ② 章节号写成标识符引用而非内联字面量（G3 / H6）
    # ③ 一个循环覆盖两个章节的嵌套形态未被生成器支持（G1 / G10）
    # 本 spec 把 entries 从 62 补到 67，并加守卫防再次退化。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: audit-platform/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: audit-platform/frontend
        run: npm ci
      - name: Run registry naming coverage guards
        working-directory: audit-platform/frontend
        run: npx vitest run src/components/workpaper/composables/__tests__/noteSectionMapNamingCoverage.spec.ts src/components/workpaper/composables/__tests__/h4h6NoteSectionMapShell.spec.ts src/components/workpaper/composables/__tests__/disclosureSheetNameRegistry.spec.ts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate registry and assert no drift
        run: |
          python backend/scripts/gen_note_wp_sync_registry.py --write
          git diff --exit-code backend/data/note_workpaper_sync_registry.json

