  note-columns-legacy-closure:
    # 附注模板列元数据 / 表名唯一性 / legacy 快照迁移就绪度守卫
    # （note-template-columns-and-legacy-snapshot-closure Task 2/3/6/21）
    #
    # 背景（2026-08-07 实测，立项数字已过期）：
    # ① 模板 `columns == 0` listed 179 / soe 61；按 scope 分桶后本 spec 作用面 =
    #    `unregistered` 234 张（母公司章 104 张已由 A spec 补齐、`registry_covered` 6 张归各 per-cycle spec）；
    # ② 表名是 `sub_table_data` 的**键** —— 空名与章节内重名会让两张表互相覆盖**丢整表**。
    #    Wave 2 已把 listed 空名 15→0 / 表头泄漏名 97→4 / 含重名表的 section 14→0；
    # ③ legacy 快照 493 章 / 892 表，其中 205 张「模板有该表但 columns==0」—— 迁过去
    #    投影会降级成 `_needs_columns`（只显示行名），**比不迁移更糟** ⇒ 列头闸不可绕过。
    #
    # 🔴 母公司章排除走 `parent_company_note_sections` 真源（按章节号逐字相等），
    #    **不是 `section_id` 前缀** —— listed 的 `chapter-12-*` 是「十二、股份支付」不是母公司章。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest==8.4.2 python-docx==1.1.2
      - name: Check note table names (空名 / 表头泄漏 / 章节内重名)
        run: python backend/scripts/fix/fix_note_table_names.py --check
      - name: Check note columns coverage (规则内欠账必须为 0)
        # Wave 3：规则表 backend/data/note_columns_rules.json 覆盖 85 张，
        # 已全部 --apply（unregistered cols0：listed 175→105 / soe 59→44）。
        # 规则外 203 张进 deficits 逐条带原因码（NO_SECTION / COUNT_MISMATCH /
        # LEN_MISMATCH / CROSS_CHAPTER / EXISTING_DIFFERS），**不得按 JSON headers 兜底补**。
        run: python backend/scripts/fix/fix_note_columns_coverage.py --check
      - name: Run note columns coverage guard
        run: python -m pytest backend/tests/test_note_columns_coverage.py -q
      - name: Run legacy snapshot readiness guard
        run: python -m pytest backend/tests/test_legacy_note_snapshot_readiness.py -q
      - name: Run shared-table segments guard (表名派生的 manifest 不得漂移)
        run: python -m pytest backend/tests/test_note_shared_table_segments.py -q

  prefill-wp-prev-resolution:
    # spec: prefill-wp-prev-resolution-repair Task 15
    #
    # 修 `prefill_engine` 的 `WP()` / `PREV()` 两个死链 resolver（337 条预设恒返 None），
    # 并把「预设中文锚点 -> checklist_responses 真实落点」建成单一真源 `prefill_anchor_map`。
    #
    # 🔴 本 job **必须带 postgres service** —— 本 spec 最贵的一条教训是：
    # `read_anchor_value` 曾把 `checklist_responses` 的列名写成不存在的 `workpaper_id`
    # （真实列名是 `wp_id`），每次取值抛 UndefinedColumnError 被 `_resolve_wp_formula`
    # 的 `except Exception` 吞成 WARNING ⇒ 8 条已对齐锚点全部仍返 None，而
    #   * 源码守卫全绿（只查「不许出现 cells」「有没有 ORDER BY」）
    #   * 44 个纯函数单测全绿（parse_anchor_value 零 DB 依赖）
    #   * characterization「恒返 None」全绿（与「没修好」不可区分）
    # ⇒ 「三层验证全绿 + fail-soft 吞异常」正是本 spec 要修的缺陷模式本身。
    # 唯一防线是 **真实执行**：TestAnchorSqlSchemaContract 连库跑一次每条映射，
    # 任何异常即打红。没有 DB 的 job 抓不到这类缺陷。
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: audit_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/audit_platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (uv accelerated)
        run: |
          pip install "uv>=0.7"
          uv pip install --system -r backend/requirements.txt || pip install -r backend/requirements.txt
      - name: Run migrations (PG schema for connected guards)
        run: python -c "import asyncio; from app.core.migration_runner import MigrationRunner; asyncio.run(MigrationRunner(database_url='postgresql+asyncpg://postgres:postgres@localhost:5432/audit_platform').run_pending())"
        working-directory: backend
      - name: Anchor map guards (Property 3/4/5/6/7/8/13/14/15/16)
        # Property 4 是本 spec 最有价值的一条：读前端 composable 源码抽 serializeRows()
        # 真正写入的字段集，断言 ANCHOR_MAP 每条的 column 都在其中 ——
        # 把「后端复刻前端派生公式」这一双真源风险变成编译期可检测。
        run: python -m pytest backend/tests/test_prefill_anchor_map.py -q
      - name: Resolution guards (cells 零命中 / characterization / SQL schema 契约)
        # 含 Property 17（连库真跑每条映射）—— 本轮 P0 的唯一防线。
        run: python -m pytest backend/tests/test_prefill_wp_prev_resolution.py -q
      - name: Zero regression (八个未触碰 resolver 逐字不变 + 键集不变)
        run: python -m pytest backend/tests/test_formula_runtime_zero_regression.py -q
  k0-source-alignment:
    # K0 管理循环函证源模板对齐（k0-confirmation-source-alignment Task 16）
    # 两个后端守卫 + 一个幂等脚本 --check：
    # 1. 源模板事实（openpyxl 直读裁决，不连库可进 CI）：11 sheet（GT_Custom 为 hidden）/
    #    底稿目录 9 行且序号序列 `[1,2,3,4,5,7,8,9,10]`（**序号 6 缺失是源模板跳号事实**，
    #    故定位与展示一律以索引号为真源，禁按序号推导底稿数量）/ K0-1 上区 28 列 6 段与
    #    七条 VLOOKUP 的 col_index / 下区四块锚点与 8 指标 SUMIF（末行 `(E35+E32)/E29`
    #    **无 ISERROR 兜底**）/ K0-2 38 列 5 段与 DV 覆盖行区**非对称**（提供信息段到 24 行、
    #    回函与二次发函段到 26 行）/ K0-7 十四列且**无「回函日期」列** / K0-8 19 条迹象 /
    #    K0A 12 条程序（含 `K0-1/K0-2//K0-4` 双斜杠事实）/ 5 条源模板笔误登记 + 6 组反向自检。
    # 2. 公式预设：K0 块 sheet 必须是源 xlsx 真实 tab（`审定表K0-1` **不存在**）+ cell_ref
    #    必须是矩阵手工覆盖键 `K0-1-matrix-{品种}-book_amount`（写裸单元格地址或审定表口径的键
    #    都落不到矩阵上）+ 七枢纽 sheet 名存在性（E0 的 `审定表E0-1` 是已知预存在缺陷，
    #    登记白名单且**只许变短**；白名单结构是 `(cycle, sheet) → reason`，因 D0 有三条）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -q
        working-directory: backend
      # 🔴 pytest 一律从**仓库根**跑 —— 从 backend/ 跑会让用相对路径读
      #    `backend/wp_templates/...` 的守卫拼成 `backend/backend/...` 而假红。
      - name: K0 source template facts (openpyxl direct read + reverse self-checks)
        run: python -m pytest backend/tests/test_k0_source_template_facts.py -q
      - name: K0 formula presets (sheet name exists in source xlsx, 7 hubs)
        run: python -m pytest backend/tests/test_k0_formula_presets.py -q
      - name: K0 prefill presets idempotent check
        run: python scripts/fix/fix_k0_prefill_presets.py --check
        working-directory: backend

  k0-source-alignment-frontend:
    # K0 函证前端守卫（k0-confirmation-source-alignment Task 15/16）
    # 覆盖六条改造线：
    # - 列集与分段（撤伪列 `send_memo` 但**字段不删**、既有值走 ConfirmationDetail 只读留档；
    #   剔 `contact_person`/`contact_phone`/`currency` 三列空列噪声；渠道 `send_channel` 与
