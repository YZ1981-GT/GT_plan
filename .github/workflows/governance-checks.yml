  note-h8-structure:
    # 附注 H8 使用权资产章节结构守卫（上市 §五、25 / 国企 §八、26）
    # （h8-right-of-use-disclosure-alignment Task 6）
    # 背景：两版行集本就与源模板一致（上市 39 行四层 / 国企 25 行五层），欠账在列元数据与文本：
    # ①两版 columns=0 → seed 路径前缀推断会给国企「本期增加/减少」反猜出凭空「本期」父表头
    # ②两版无 guidance ③上市 headers 第 5 列是 `……` 占位列头（永远收不到数据，
    # 载荷推的是底稿默认分类第 4 类 `其他`）④`_note_texts` 缺中文 title 且不过滤空文本。
    # 🔴 `……` 有两种语义：作**列头**须展开为 `其他`；作**行**是真实可扩行
    # （`cost_inc_ellipsis` 等键参与 sumOf）**必须保留** —— 守卫含正向断言锁死 6 个 `……` 行。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check note H8 section alignment (五、25 / 八、26)
        run: python backend/scripts/fix/fix_note_h8_right_of_use_structure.py --check
      - name: Install test dependencies
        run: python -m pip install pytest==8.4.2 openpyxl==3.1.5
      - name: Run note H8 structure contract tests
        run: python -m pytest backend/tests/test_note_h8_right_of_use_structure.py -q

