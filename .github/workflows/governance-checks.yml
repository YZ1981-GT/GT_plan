  cycle-specs-account-evidence:
    # per-cycle spec 兜底码 ↔ account_chart 实证对账（冻结 DB 实证结论，不连库）
    # 抓的是「凭 CAS 常识写科目码」类缺陷：I2 写 1711(实为商誉) / I3 写 1721(全库不存在)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest -q
      - name: Cycle specs account evidence
        run: python -m pytest tests/four_table/test_cycle_specs_account_evidence.py -v --tb=short
      # F2 的 `account` 字段是展示/兜底元数据（取数走 classify_f2_leaf 按名称），
      # 但「只是展示」不等于可以写全库零命中的码：1410/1412 曾如此（Task 29 已修）。
      - run: pip install -r requirements.txt -q 2>/dev/null || pip install sqlalchemy -q
      - name: F2 display account codes exist in account_chart
        run: python -m pytest tests/four_table/test_f2_display_account_codes.py -v --tb=short
      # 旧制编码守卫的**不连库**部分（行级判定纯函数 + 白名单反向锁死 + skip 可见性）。
      # 连库部分在下面的 legacy-encoding-balances job 里跑；这里保证即使 DB job
      # 挂了/被删，判定逻辑与白名单锁死仍有人守。
      - name: Legacy-encoding guard (pure predicate + whitelist integrity)
        run: >-
          python -m pytest
          tests/four_table/test_legacy_encoding_balances_stay_zero.py
          -k "not TestLiveDatabase" -v --tb=short


  legacy-encoding-balances:
    # 数据触发型守卫：旧《企业会计制度》(2001) 编码（3xxx 权益 / 5xxx 损益）
    # 一旦带非零余额即打红 —— 那就是启动 N4/N5/F5/M 语义迁移的信号
    # （那些策略硬编码 CAS 2006 码 6403/6801/6401，旧制码带真余额时会静默少算）。
    # 白名单按「码 + 科目名」两元组匹配（同一个 3201 在旧制是利润分配、
    # 在 CAS 2006 是套期工具），按码放行会把真正的触发条件一起放掉。
    # 🔴 只读，不写库；`-rs` 让「PG 不可达」的 skip 原因出现在日志里（静默 skip 是假绿源）。
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: audit_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/audit_platform
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -q
      - name: Run migrations (four-table schema)
        run: python -c "import asyncio; from app.core.migration_runner import MigrationRunner; asyncio.run(MigrationRunner(database_url='postgresql+asyncpg://postgres:postgres@localhost:5432/audit_platform').run_pending())"
      - name: Legacy encoding balances stay zero (live DB, read-only)
        run: >-
          python -m pytest
          tests/four_table/test_legacy_encoding_balances_stay_zero.py
          -v --tb=short -rs

  report-config-account-integrity:
    # `report_config` 科目码完整性守卫（spec report-config-account-code-integrity R6）
    #
    # 背景：这张表此前**零一致性校验** —— `row_name` 与 formula 引用科目的实际名从不比对，
    # 错码可以静默存在数年（两次被动修复中还有一次前提本身就是错的：V136 的 WHERE
    # 从不命中 0 行影响，因为它假设 BS-082 是专项储备，实际那行叫「其他权益工具」）。
    # V138 一次修掉 13 行；本 job 防它再漂回去。
    #
    # 三层守卫：
    # 1. **连库**一致性（`test_report_config_account_integrity`）—— 名称比对限定
    #    余额类报表 + 去重后单码（多码合成行/流量表/「其中：」明细行各有反例，
    #    第一版判据因此误报约 40 行，全是判据缺陷不是数据问题）；
    #    另含双算检测（按 `(报表, 完整码, 取数列)` 归并，按 head 归并会误判三组）
    #    与「全表 formula 只允许 TB/SUM_TB/ROW」的函数名封顶。
    # 2. **第二写入路径镜像**（`test_report_formula_filler_mirror`，不连库）——
    #    `ReportFormulaService.fill_all_formulas()` 按**行名**索引且只填 NULL 行，
    #    恰好正是 V138 置 NULL 的那批 ⇒ 不锁死就等于 V138 白做。
    # 3. **接缝防过期**（`test_cycle_specs_row_code_evidence`，不连库）——
    #    与 `CODE_CORRECTIONS` 交叉锁死：已改对的行留在 `_WRONG_FORMULA_ROWS` 即打红，
    #    防 `trust_report_config=False` 这类临时防护静默长存（关掉层③是有代价的）。
    #
    # 🔴 只读，不写库；`-rs` 让「PG 不可达」的 skip 原因出现在日志里（静默 skip 是假绿源）。
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: audit_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/audit_platform
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -q
      - name: Run migrations (report_config + four-table schema, applies V138)
        run: python -c "import asyncio; from app.core.migration_runner import MigrationRunner; asyncio.run(MigrationRunner(database_url='postgresql+asyncpg://postgres:postgres@localhost:5432/audit_platform').run_pending())"
      - name: report_config account-code integrity (live DB, read-only)
        run: >-
          python -m pytest
          tests/four_table/test_report_config_account_integrity.py
          -v --tb=short -rs
      - name: Second write path mirrors V138 (report_formula_service)
        run: python -m pytest tests/four_table/test_report_formula_filler_mirror.py -q
      - name: V138 seam does not silently expire (cross-lock CODE_CORRECTIONS)
        run: python -m pytest tests/four_table/test_cycle_specs_row_code_evidence.py -q

