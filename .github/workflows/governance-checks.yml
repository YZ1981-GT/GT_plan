    # 3. K3~K13 父子双计（startswith 累加父行+全部子行 ≈ 真值 2 倍）
    # 4. K3~K13 缺点号边界的自造 _is_leaf
    # 5. K4/K6 取不存在的科目（2245/1481/2605 三表零命中 → 宁缺勿造）
    # 6. 公式预设整块按遗留族贴错标签（9 块错位 + 5 块孤儿 K14~K18）
