    # N 循环税务类披露前端守卫（n-cycle-tax-disclosure-alignment Task 8）
    # 拦四类只有实测才暴露的缺陷：
    # 1. **子表名 / 列头与附注模板漂移** → 孤儿子表（附注 TAB 永空 + 底稿数据丢失）
    # 2. **N2 两版共用列定义** → 上市误用国企变动口径（反向断言两版列键集不等）
    # 3. **N4 国企产出载荷** → 源模板 `附注披露信息：无`，`buildN4SyncPayload('soe')` 恒 null
    # 4. **sheet 名漂移**：披露判定被 wp_code 正则抢占 / 国企写法不全认 /
    #    N5 国企 tab 名缺右括号（`附注披露信息（国企`）被"修正"
    runs-on: ubuntu-latest
    steps:
