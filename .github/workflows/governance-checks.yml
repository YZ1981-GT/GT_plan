    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: audit-platform/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: audit-platform/frontend
        run: npm ci
      - name: Run H cycle consistency guard
