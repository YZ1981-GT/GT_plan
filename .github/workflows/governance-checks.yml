    # ③国企第 3 表与第 2 表**重名** `以公允价值计量`（表名是 sub_table_data 键，同名互相覆盖丢整表）；
    # ④上市 6 处「可无限量添加行」占位当数据行 + 国企 2 处 header_label 假行；
