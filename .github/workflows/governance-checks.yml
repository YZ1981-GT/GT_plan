  k-cycle-four-table-extraction:
    # K3~K13 四表取数 / 科目映射 / 损益口径 / 公式预设守卫
    # （k-cycle-four-table-extraction-and-disclosure-completion Wave 1~5）
    #
    # 拦七类已实测缺陷：
    # 1. K5 取错整个科目族（2701 长期应付款 → 2801 预计负债）
