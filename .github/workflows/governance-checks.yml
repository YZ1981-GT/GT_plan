  note-h7-structure:
    # 附注 H7 生产性生物资产章节结构守卫（上市 §五、24 / 国企 §八、24）
    # （h7-biological-assets-disclosure-rebuild Task 11）
    # H7 是 H 循环唯一需要**整体重建**的循环：重建前两个披露 Tab 只有单行只读
    # movementRows（无产业与类别维度），既无 h7NoteSectionMap 也无载荷，
    # disclosure-sync-path-buildout 曾接线后主动撤回（强推等于自造披露内容）。
    # 上市两表是列转置 + 两级表头（openpyxl 合并区 A9:A10/B9:C9/…/J9:J10 实证）：
    # 列 = 项目 + 4 产业（各下辖用户命名的类别列）+ 合计；表1 34 行四层、表2 11 行。
    # 🔴 `……` 两种语义相反：作列头永远收不到数据 → 丢弃；作行是真实可扩明细行且参与
    # 小计 → 保留（上市表1 三处、表2 两处）。国企的 `……` 是行形态的「可继续加行」标记，
    # 动态类别行模型下不需要 → seed 删除（13 行 → 9 行）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check note H7 section alignment (五、24 / 八、24)
        run: python backend/scripts/fix/fix_note_h7_biological_assets_structure.py --check
      - name: Install test dependencies
        run: python -m pip install pytest==8.4.2 openpyxl==3.1.5
      - name: Run note H7 structure contract tests
        run: python -m pytest backend/tests/test_note_h7_biological_assets_structure.py -q

