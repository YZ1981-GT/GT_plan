    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check note H9/H10 section alignment
        run: python backend/scripts/fix/fix_note_h9_h10_structure.py --check
      - name: Install test dependencies
        run: python -m pip install pytest==8.4.2 openpyxl==3.1.5
