    #    A13 的 `source_wp_code` 恒 null）· R2.7 回读态卡片不得被样本数门控藏起来 ·
    #    A13 描述里的批次号必须与同一条描述的样本量/种子同属一个事件。
    #
    # 🔴 覆盖率守卫的 allowlist 只许变短：修好一个宿主就删一条豁免并下调
