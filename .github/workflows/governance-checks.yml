    # 3. **URL 登记率只升不降** —— formula 域未登记进 `apiPaths` 的硬编码 URL 条目数
    #    由常量钉死且只许减少（改一个 prefix 原本要手工扫 18 个文件）。
    runs-on: ubuntu-latest
