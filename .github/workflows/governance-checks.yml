  note-l-cycle-structure:
    # 附注 L 循环章节结构守卫（L7 其他非流动负债 五、52/八、57 + L8 财务费用 五、67/八、68）
    # （disclosure-sync-path-buildout Task 4.5 / 4.6）
    # 背景：①五、52 表名是**表头首格泄漏** `项  目` 且只有合计行无数据行骨架；
    # ②八、57 残留 `……` 占位行（md 重建把源模板省略号当数据行）；
    # ③**财务费用两版行集与源模板不符** —— 源 xlsx r7~r18 共 12 行（含 3 个派生小计
    # 行「利息费用/利息净支出/汇兑净损失」），而模板上市只有 7 行、国企 9 行，且
    # 「利息支出」应为「利息费用总额」、「汇兑损益」应为「汇兑损失」；
    # ④四张表 columns / guidance 全缺 → seed 路径走前缀推断塞凭空父表头。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check note L-cycle section alignment (五、52/八、57/五、67/八、68)
        run: python backend/scripts/fix/fix_note_l_cycle_structure.py --check
