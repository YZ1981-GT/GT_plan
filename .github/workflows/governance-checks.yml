  deliverable-lineage-wiring-backend:
    # 交付件溯源接线与回填闭环 —— 后端守卫（deliverable-lineage-wiring-and-writeback-closure Task 16）
    # 覆盖 Wave 1 + Wave 2 全部 Property：
    # 1. 锚点扫描/写入互逆 + 块定位降级链（anchor→marker→none 三态均不抛）；
    # 2. **生产导出路径**真的写了锚点（Property 1/2）—— 历史假绿正是
    #    `write_section_anchors` 实现正确、28 条属性测试全绿，但全仓零生产调用方
