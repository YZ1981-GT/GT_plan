    # 断言：合计不写公式 binding（P3）/ 合计口径 ≡ _backfill_totals（P4）/
    # 不新增披露内容 + valid_sources 未改（P12）/ linkage 未批量填（P13）/
    # 预设↔binding 章节集合一致（P14）/ cross_check 表达式同源（P15）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check note formula data contract (strict)
        run: python backend/scripts/check/check_note_formula_contract.py --strict

  procedure-delegation-architecture:
    # procedure-delegation-notification Wave1 Task1: exact architecture debt guard.
    # The scanner is stdlib-only; its self-tests cover Python AST, Vue/TS structure,
    # exact baseline matching, Windows paths/UTF-8, and the reserved V105 migration.
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run procedure delegation architecture guard (strict)
        run: python backend/scripts/check/check_procedure_delegation_architecture.py --strict
      - name: Install governance self-test dependency
        run: python -m pip install pytest==8.4.2
      - name: Run procedure delegation architecture self-tests
        run: python -m pytest backend/tests/scripts/test_check_procedure_delegation_architecture.py -q
      # Task 15 CI guard: 前后端通知类型同步（新增通知类型必须同步 backend + 前端字典）。
      # 这是架构守卫 5 条规则之一（GET 禁写 / TransitionService 单入口 / ProcedureInstance
      # 粒度 / parsed_data 精确写 由 --strict 覆盖；通知类型同步走此契约测试）。
      - name: Run procedure notification type sync guard
        run: python -m pytest backend/tests/procedure_delegation/test_notification_type_sync.py -q

