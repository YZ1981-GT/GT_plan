  sampling-compliance-backend:
    # 抽样/抽凭合规闭环 —— 后端守卫（sampling-compliance-closure Wave 1/2，Task 23）
    # 覆盖：
    # 1. 抽样框数据集绑定（`stats.dataset_id` 取值等于真实 active 数据集；`dataset_stale`
    #    三态判定 —— 空 ⇒ false、相等 ⇒ false、不等 ⇒ true，改造前的既有记录永不告警）；
    # 2. `POST /sampling/voucher-evaluation` upsert 幂等 + 授权先于任何写入
    #    （403/404 时目标 log 的 `extraction_criteria` 与 `updated_at` 均无变化）；
    # 3. canonical 守卫扩面：`backend/app/**` 全仓对 legacy `WpSamplingEngine` /
    #    `wp_sampling_engine` 零引用（读源码前先剥注释 + 反向自检，防守卫自身注释被数成引用）；
    # 4. 登记表投影：`sampled_vouchers` 同批次防重（唯一索引 + ON CONFLICT DO NOTHING）、
    #    fail-open 必留 WARNING（caplog 断言，防 fail-open 变静默黑洞）、构造点确实存在；
    # 5. `sampling_config` 软弃用：`SamplingConfig(` 实例化计数不增 + docstring 含
    #    `.. deprecated::`（判据用 `(?<!class )` 排除 ORM 类声明本身）。
    #
    # 🔴 连库用例走「单次 asyncio.run 取快照 + 断言同步」范式：连接池绑定首个事件循环，
    # 第二次 run 必炸成 `AttributeError: 'NoneType' object has no attribute 'send'`。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest==8.4.2 hypothesis==6.112.1
      # 🔴🔴 连库文件必须**各自独立 pytest 进程**：连接池绑定首个事件循环，同一进程里
      # 第二个连库文件必炸 `AttributeError: 'NoneType' object has no attribute 'send'`，
      # 而 fixture 会把它 `except → skip` → **连库断言静默不执行 = 假绿**。
      # 2026-08-04 实测：`test_sampling_registry_service.py` 单独跑 47 passed，
      # 与 `test_sampling_dataset_binding.py` 同进程则 7 个连库断言被跳过。
      - name: Run dataset binding guard (own process, DB-touching)
        run: python -m pytest backend/tests/test_sampling_dataset_binding.py -q -rs --tb=short
      - name: Assert dataset binding guard did not skip DB assertions
        run: |
          python -m pytest backend/tests/test_sampling_dataset_binding.py -q -rs --tb=no \
            | tee /tmp/sampling_db1.txt
          if grep -q "数据库不可用" /tmp/sampling_db1.txt; then
            echo "::error::连库断言被静默跳过（事件循环污染），守卫无效"
            exit 1
          fi
      - name: Run sampling registry projection guard (own process, DB-touching)
        run: python -m pytest backend/tests/test_sampling_registry_service.py -q -rs --tb=short
      - name: Assert registry guard did not skip DB assertions
        run: |
          python -m pytest backend/tests/test_sampling_registry_service.py -q -rs --tb=no \
            | tee /tmp/sampling_db2.txt
          if grep -q "数据库不可用" /tmp/sampling_db2.txt; then
            echo "::error::连库断言被静默跳过（事件循环污染），守卫无效"
            exit 1
          fi
      - name: Run evaluation endpoint + canonical + deprecation guards (no DB)
        run: >-
          python -m pytest
          backend/tests/test_sampling_evaluation_endpoint.py
          backend/tests/test_sampling_evaluation_fill_path.py
          backend/tests/test_voucher_sampling_canonical_guard.py
          backend/tests/test_sampling_config_deprecation.py
          -q --tb=short

