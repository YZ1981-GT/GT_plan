  note-k-cycle-structure:
    # 附注 K 系章节结构 + sheet 名守卫（批 1 损益类 K8~K13 + 批 2 负债/递延类 K3/K4/K5/K7）
    # （k-cycle-disclosure-alignment 批 1）
    # 背景（三个 P0）：①K11/K12/K13 上市侧常量章节号写 `资产减值损失` 等，而模板
    # `section_number` 是 md 重建截断值 `三、资产减值损失（损` → 上市侧同步落不到章节；
    # ②K8/K9 上市侧常量表名 `销售费用`/`管理费用`，模板实为「（按费用性质列示）」→ 孤儿子表；
    # ③K10 国企第 4 列「是否为政府补助」与 K12/K13 两版第 4 列「计入当期非经常性损益的
    # 金额」常量未声明 → 组件已录入却从未推送。
    # sheet 名守卫直接以 openpyxl 读 xlsx tab 名比对（前端 registry 守卫查不出该漂移）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check note K-cycle P/L section alignment (K8~K13)
        run: python backend/scripts/fix/fix_note_k_pl_structure.py --check
      - name: Install test dependencies
        run: python -m pip install pytest==8.4.2 openpyxl==3.1.5
      - name: Check note K-cycle liability section alignment (K3/K4/K5/K7)
        run: python backend/scripts/fix/fix_note_k_liability_structure.py --check
      - name: Check note K-cycle complex section alignment (K1/K6)
        # 批 3：K1 §五、8 / §八、9（37 表全缺 columns + 两级表头压扁 + 4 处 header_label
        # 假行 + 裸续表名 `续：`）；K6 §五、11 / §八、12 / §八、43（上市 6 张表里 5 张垃圾名、
        # tables[1] 的 name↔rows 整体错位、主表两级表头 6 列压成 3 列、11 表 guidance 全缺）
        run: python backend/scripts/fix/fix_note_k_complex_structure.py --check
      - name: Run note K-cycle structure and sheet-name contract tests
        run: >-
          python -m pytest backend/tests/services/test_note_k_pl_structure.py
          backend/tests/services/test_note_k_liability_structure.py
          backend/tests/services/test_note_k_complex_structure.py
          backend/tests/services/test_note_k_sheet_names.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: audit-platform/frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
        working-directory: audit-platform/frontend
      - name: Run K-cycle disclosure subtable + AI wiring guards
        # AI 接线守卫背景（2026-07-31 实证的三类静默失效）：
        # ①K5/K7 四个 `handleAiGenerate` 只 `emit('save', ...ai-trigger)` 写 marker、
        #   从不调端点 → 按钮可见可点但零网络请求；
        # ②K3 两版 `context` 传字符串，而后端要 `dict[str,str]` → 必然 422 被 catch 静默吞；
        # ③prompt 过短无「不得虚构」约束 → 诱导模型自造披露内容。
        run: >-
          npx vitest run
          src/components/workpaper/composables/__tests__/kLiabilityNoteSubtableContract.spec.ts
          src/components/workpaper/composables/__tests__/kPlNoteSubtableContract.spec.ts
          src/components/workpaper/composables/__tests__/kDisclosureAiWiring.spec.ts
          src/components/workpaper/composables/__tests__/k7NoteSectionMap.spec.ts
          src/components/workpaper/composables/__tests__/k6NoteSectionMap.spec.ts
          src/components/workpaper/composables/__tests__/k6NoteBlocksWiring.spec.ts
          src/components/workpaper/composables/__tests__/k1NoteSubtableContract.spec.ts
        working-directory: audit-platform/frontend

