  l0-confirmation-alignment:
    # L0 债务循环函证源模板对齐（l0-confirmation-source-alignment Task 19）
    # 四个后端守卫 + 两个幂等脚本 --check：
    # 1. 源模板事实：9 visible + 1 hidden 的 sheet_state / 底稿目录 8 行索引 / L0-1 五段合并
    #    表头与 28 列字面 / 8 指标 SUMIF 公式 / 2 品种字面 / L0A 12 条程序含分类与索引号 /
    #    四处**真实** DV（含反向自检：镜像残留 sqref `JK8:JL27` 存在于文件但不覆盖真实列）/
    #    三处索引号笔误 —— 判 DV 一律 `coord in dv.sqref` 逐格测试，禁按打印顺序取第一个；
    # 2. L0A 程序表：`get_template('L0A')` 由 None → 12 条（改造前 `resolve_program_template_code`
    #    回退 F0A、加载「采购存货循环」程序且 ref_index 全为 F0-*）+ 字段名必须是 `content`
    #    （服务侧以 `item["content"]` 必填读取，写 `description` 会 KeyError；无 `hint` 透传通道）；
    # 3. 公式预设：sheet 必须是源 xlsx 真实 tab（`审定表L0-1` 不存在）+ account_codes 禁
    #    `2001`/`2501`（短期/长期银行借款，正是 L0A 程序 1 明确排除的）+ 禁区间 `SUM_TB`/`TB_SUM`
    #    + cell_ref 必须是矩阵手工覆盖键且 formula_type 为 PLACEHOLDER（写 `TB()` 会让「按码取到
    #    的 0」伪装成审计师手填值，压住语义定位的 undefined，使「无此科目」与「余额为 0」不可区分）；
    # 4. render sheets：L0 隐藏 sheet 走 `{wp_code}-{sheet_name}` **复合键** skip（接在既有三条
    #    判定之后，既有命中路径优先）—— `函证差异检查表（示例）` 在 D0/F0 是 visible，按裸名标
    #    skip 会连它们的真实页签一起杀掉；含 characterization（全库既有 skip 条目逐条不受影响）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -q
        working-directory: backend
      # 🔴 pytest 一律从**仓库根**跑 —— 从 backend/ 跑会让用相对路径读
      #    `backend/wp_templates/...` 的守卫拼成 `backend/backend/...` 而假红。
      - name: L0 source template facts (openpyxl direct read + mirror-sqref self-check)
        run: python -m pytest backend/tests/test_l0_source_template_facts.py -q
      - name: L0A procedure template (get_template no longer falls back to F0A)
        run: python -m pytest backend/tests/test_l0a_program_template.py -q
      - name: L0 book amounts (reuse l_cycle_specs L5/L4 + three-state)
        run: python -m pytest backend/tests/four_table/test_l0_book_amounts.py -q
      - name: L0 render sheets (compound-key skip, D0/F0 not harmed)
        run: python -m pytest backend/tests/test_l0_render_sheets.py -q
      - name: L0A program template idempotent check
        run: python scripts/fix/fix_l0a_program_template.py --check
        working-directory: backend
      - name: L0 prefill presets idempotent check
        run: python scripts/fix/fix_l0_prefill_presets.py --check
        working-directory: backend

