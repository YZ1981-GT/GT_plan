  h-cycle-consistency:
    # H 循环披露内部勾稽引擎守卫
    # （h-cycle-legacy-cleanup-and-platform-hygiene R5）
    # 平台共用勾稽件在 shared/disclosureConsistency.ts（容差 0.01 元 / null → skip）；
    # H1/D1/F1 已改委托共用容差常量（零回归）；H2/H5/H8/H9/H10 新建规则文件并接入
    # WpDisclosureConsistencyPanel（H3/H7 的合计是自派生 sumOf，无独立第二来源可比对，
