  formula-management-runtime:
    # 公式管理运行层闭环守卫（spec formula-management-runtime-closure R8/R9）
    #
    # 背景：该模块「定义层与治理层完整、运行层在真实库空转」——2026-08-06 实证
    # `wp_formula` 表 0 行 ⇒ `FormulaRuntimeCoordinator._load_formulas` 每次返空并
    # early-return，整条 mutation plan 流水线从上线起没有真实数据流经过。
    # 本 job 拦六类已实测缺陷的回退：
    #
    # 1. **静默回退期末余额（数字错，不是取不到）** —— `COLUMN_ALIASES` 原只 8 键，
    #    `本期借方`/`本期贷方`/`借方发生额`/`贷方发生额` 四个未注册，而两条求值路径
    #    （`_handle_tb` AST 路径 与 `_execute_regex` 降级路径）**都**写
    #    `account_data.get(resolved_col, account_data.get("期末余额", 0))`
    #    ⇒ 全库 48 个公式格的「本期增加/减少/计提」列拿到期末余额。
    #    🔴 规范名必须是 `本期借方`/`本期贷方`（与共享件 `DEBIT_KEY`/`CREDIT_KEY` 一致），
    #    写成 `借方发生额` 会让共享件与引擎两侧对不上。
    # 2. **两套互不可见的公式存储** —— 用户公式原落 `parsed_data['user_formulas']`，
    #    而运行时只 `select(WpFormula)` ⇒ 用户在公式管理里保存的公式**永远不被求值**。
    #    Wave 3 收敛进 `wp_formula` 表（0 行 = 零迁移压力）；GET 保留读时合并兼容分支，
    #    该分支必须有守卫钉死，否则下个会话会当死代码删掉（将来某环境有存量即静默丢数据）。
    # 3. **`WP()` 双实现语义无守卫** —— `prefill_engine` 读 `parsed_data['cells']`（0 行=死）、
    #    `formula_engine` 读 `ctx.wp_data`；修一份不会修另一份且无人提醒（死链本体归
    #    `prefill-wp-prev-resolution-repair`，本 spec 只做一致性锁死）。
    # 4. **三类型只有一类真跑起来** —— `logic_check` 结果原不落库（`cross_check_results`
    #    0 行）；`_load_formulas` 空结果静默 early-return（现进 `scope_failures`）。
    # 5. **零回归** —— `_REGISTRY` 14 个内置函数 / `_FORMULA_RESOLVERS` 9 个 resolver
    #    键集逐字不变；`COLUMN_ALIASES` 原 8 键映射目标逐字不变（改一个就是数字级回归，
    #    影响 467 格已注册列名公式）；三个 user-formulas 端点响应形状不变。
    # 6. **诊断脚本四态可复算** —— `ok` / `missing_column` / `no_data` / `no_formula`
    #    禁合并成「无数据」（合并会让「本项目没数据」与「链路仍是死的」不可区分）。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        run: python -m pip install -r requirements.txt
      - name: COLUMN_ALIASES coverage + 两条求值路径无静默回退
        # 🔴 复用 h-cycle spec 已交付的守卫文件（同一不变式禁两份守卫 = 双真源）
        run: python -m pytest tests/test_formula_column_alias_coverage.py -q
      - name: 零回归 —— 函数集 / 列名映射 / 响应形状
        run: python -m pytest tests/test_formula_runtime_zero_regression.py -q
      - name: 用户公式存储收敛（写表 + GET 读时兼容 + cell_key 往返 PBT）
        run: python -m pytest tests/test_user_formula_storage_convergence.py -q
      - name: 三类型执行链定性 + 三张 0 行表登记
        run: python -m pytest tests/test_formula_type_runtime_status.py -q
      - name: WP() 双实现语义登记锁死
        run: python -m pytest tests/test_formula_wp_semantics.py -q
      - name: 诊断脚本可运行且四态齐备（--no-db，不连库）
        run: python scripts/diagnose/diagnose_formula_runtime_state.py --no-db --out /tmp/formula_runtime_state.txt
      - name: 诊断报告须复算出 0 格未注册列名（修复前 48）
        # 结构性判据：报告里必须出现「0 格 —— Wave 2 修复已生效」，
        # 出现「仍是修复前的 48 格」即说明 COLUMN_ALIASES 被回退。
        run: |
          set -e
          if grep -q "仍是修复前的 48 格" /tmp/formula_runtime_state.txt; then
            echo "::error::COLUMN_ALIASES 被回退 —— 48 格公式又在静默取期末余额"
            exit 1
          fi
          grep -q "Wave 2 修复已生效" /tmp/formula_runtime_state.txt
          echo "✅ 未注册列名格数 = 0"

  formula-management-frontend:
    # 公式管理前端守卫（spec formula-management-runtime-closure R1/R2/R7）
    #
    # 1. **平台级端点存在性** —— 前端公式相关 `/api/` URL 去掉插值后必须 ⊆
    #    后端真实注册路由（读 `backend/app/routers/**` 抽装饰器交叉锁死，
