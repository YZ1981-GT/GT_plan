  d-cycle-four-table-completion:
    # D 类取数 / 公式预设 / 披露附注收口后端守卫
    # （d-cycle-four-table-extraction-and-disclosure-completion Task 28）
    #
    # 覆盖本 spec 的判据真源，五类都是「四层验证全绿、只有真实数据或守卫能发现」的形态：
    # 1. 语义槽与备抵名称过滤（Task 11/12）—— 共享件 `fetch_d_cycle_tb` 用
    #    `getattr(codes, 'subject_keywords', ())` 读行为开关型字段，而 `D1AccountCodes`
    #    改造前**没有该字段** ⇒ 默认值 `()` 恰好就是「功能关闭」，D1 备抵取到整个 `1231`
    #    （一个项目 1.02 亿）。守卫要求同域全部 dataclass 都真有该字段且非空。
    # 2. 公式预设自洽（Task 18~21）—— sheet 名必须是源 xlsx 真实 tab；`PREV()` 目标必须
    #    是真实 tab（**不是**「必须指向自己 sheet」，明细表取上年审定数是平台既有范式）；
    #    「明细表不得引用审定表」只禁**同 wp_code 内**（跨循环引用如 D0→D2 是合法分母）。
    # 3. 母公司附注章禁删（Task 22）—— 立项的「孤儿重复章」实为 listed 十六章 / soe 十二章
    #    母公司附注的正当子节（`parent_section_id` + `scope='consolidated_only'` 双证），
    #    删它等于删整章。锁死的不变量是**归属关系**，不是「columns 全 0」那种会被
    #    并发会话补列打红的观测值；且诊断脚本本体必须只读（禁 `--apply`/`db.delete(`）。
    # 4. D3 枚举单一真源（Task 26）—— `审定表D3-1!B8=SUMIF(D3-2!$C$12:$C$22, A8, ...)`
    #    ⇒ D3-2 的 C 列是联动键，两侧标签必须逐字相同。openpyxl 三向锁死
    #    （源 xlsx DV ↔ 审定表行名 ↔ 前端 `d3NatureCategories.ts`）。
    #    顺带登记源模板两处缺陷（C23 挂了另一套 6 项枚举 / SUMIF 到 R22 而合计含 R23）。
    # 5. D4（4）分解信息表行列（Task 31）—— 源模板 9 列 9 行，**无横向合计列**（合计是行），
    #    父行是 SUM 且覆盖空可扩行。改造前自造 `total_revenue`/`total_cost` 两列。
    #
    # 🔴 pytest 一律从**仓库根**跑：多个守卫用相对路径读 `backend/wp_templates/**.xlsx`，
    #    从 backend/ 跑会拼成 `backend/backend/...` 而假红（FileNotFoundError 表现为
    #    文件级失败、零断言执行，极易被当噪声跳过）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -q
        working-directory: backend
      - name: D cycle semantic slots evidence (subject_keywords must exist on all dataclasses)
        run: python -m pytest backend/tests/four_table/test_d_cycle_specs_evidence.py -q
      - name: D cycle TB fetch (provision name filter must not be a no-op)
        run: python -m pytest backend/tests/d_cycle_extraction/test_d_tb_fetch.py -q
      - name: D cycle render characterization (gray flag on/off byte-equivalent)
        run: python -m pytest backend/tests/d_cycle_extraction/test_d_render_characterization.py -q
      - name: D cycle prefill presets (sheet names / PREV targets / no cross-ref cycles)
        run: python -m pytest backend/tests/test_d_cycle_prefill_presets.py -q
      - name: Parent-company note chapters must not be deleted (ownership invariant)
        run: python -m pytest backend/tests/services/test_note_d_orphan_sections.py -q
      - name: D3 nature/relation enums locked to source xlsx (three-way)
        run: python -m pytest backend/tests/services/test_d3_nature_categories.py -q
      - name: D4 segment table rows/columns match source template (9x9, no total column)
        run: python -m pytest backend/tests/services/test_note_d4_segment_structure.py -q
      - name: D cycle prefill preset fix idempotent check
        run: python backend/scripts/fix/fix_d_cycle_prefill_presets.py --check
      - name: D cycle disclosure preset fix idempotent check
        run: python backend/scripts/fix/fix_d_cycle_disclosure_presets.py --check
      - name: D4 segment structure fix idempotent check
        run: python backend/scripts/fix/fix_note_d4_segment_structure.py --check
      - name: D cycle amount control fix idempotent check
        run: python backend/scripts/fix/fix_d_cycle_amount_inputs.py --check
      # 只读诊断（母公司章归属 + D 类合并章列元数据健康度），连库故在 CI 里只作烟测
      - name: Note section hygiene diagnose (read-only; DB-less in CI)
        run: python backend/scripts/diagnose/diagnose_d_cycle_note_section_hygiene.py --strict || true

