  h-cycle-extraction-formula:
    # H 类取数/公式/披露收口（h-cycle-extraction-formula-and-disclosure-completion Task 16）
    #
    # 覆盖本 spec 的后端判据真源：
    # 1. 双族并取（Task 1/6/8/9）—— `1641|1651` / `1642|1652` / `2601|2651` 在**同一项目内
    #    互斥**（9 项目逐个核，唯一并存的 0ec33ac9 双方均 0.00）⇒ `TB(a)+TB(b)` 零双算。
    #    改 report_config 前后 8 个单族项目取值必须逐分不变。
    # 2. 列别名（Task 2/4）—— `本期借方`/`本期贷方` 未注册时 `_handle_tb` 会**静默回退
    #    期末余额**（数字错不是取不到），且 **AST 与 regex 两条求值路径都要改**，
    #    只改一条守卫仍红。
    # 3. 预设科目自洽（Task 3/7）—— 公式里的科目码 ⊆ 该块 accounts 声明 ∪ 双族 alternate
    #    ∪ PLACEHOLDER；抽码时**必须先整体消费 `SUM_TB('a~b')` 的区间端点**
    #    （否则 H1-3 的上界 1604 会被当成「引用了在建工程」误报）。
    # 4. 会计政策章（Task 13）—— 裁决者是 docs/模版/ 两份附注源 docx，按
    #    `paragraph.style.name == 'Heading N'` 定位（**docx 章号是 Word 自动编号，
    #    段落文本不含「三、」，用 `^N、` 正则会 0 命中**）；两份 docx 层级不同构
    #    （listed Heading 2 = 节 / soe Heading 3 = 节、局部到 Heading 5），
    #    且同名 heading 在会计政策章与项目注释章各出现一次 → 必须取首次。
    # 5. 可扩标记（Task 15）—— `……` 作**列头**要展开、作**行**是真实可扩位要保留
    #    （两种语义处理方式相反）；H7-soe 已改动态类别行 ⇒ 有意不 seed。
    #
    # 🔴 pytest 一律从**仓库根**跑 —— 从 backend/ 跑会让 16 个用相对路径读
    #    backend/wp_templates/**.xlsx 与 docs/模版/*.docx 的守卫拼成 backend/backend/...
    #    而假红（实测 four_table 从 backend/ 跑 17 failed、从仓库根跑 0 failed）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -q
        working-directory: backend
      - name: Column alias coverage (both AST and regex paths)
        run: python -m pytest backend/tests/test_formula_column_alias_coverage.py -q
      - name: H cycle preset account coherence (range endpoints excluded)
        run: python -m pytest backend/tests/test_h_cycle_preset_account_coherence.py -q
      - name: H1~H4 adjudication prefill (no account => no key)
        run: python -m pytest backend/tests/four_table/test_h_cycle_adjudication_prefill.py -q
      - name: Accounting policy chapter (source docx is the arbiter)
        run: python -m pytest backend/tests/test_note_h_policy_chapter_structure.py -q
      - name: Right-of-use note structure (incl. source-docx text_sections cross-check)
        run: python -m pytest backend/tests/test_note_h8_right_of_use_structure.py -q
      - name: Expandable row marks (header expand vs row keep, per-cycle policy)
        run: python -m pytest backend/tests/test_h_cycle_expandable_rows.py -q
      - name: Accounting policy chapter idempotent check
        run: python backend/scripts/fix/fix_note_h_policy_chapter_structure.py --check
      - name: H cycle preset fix idempotent check
        run: python backend/scripts/fix/fix_h_cycle_prefill_presets_phase2.py --check
      # 双族真源守卫连库（CI 无 DB ⇒ 只作烟测，真实验收在本地/预发跑）
      - name: Dual family codes (DB-backed evidence; DB-less in CI)
        run: python -m pytest backend/tests/four_table/test_dual_family_codes.py -q || true
      # 变异检验（Task 17）：8 个变异必须逐条打红并还原；GREEN 或 ANCHOR-MISS ⇒ 非零退出。
      # 🔴 本步曾判出 3 个 GREEN，暴露 Task 6「H8/H9 兜底码接双族」是**假绿** ——
      #    scope 里仍写单族字面量 `("1641",)`，而守卫只测双族真源自身、
      #    一条都没钉「谁在用它」。补「运行时值比对 + 源码级禁字面量」双层判据后转红。
      - name: Mutation check (every guard must go red, then restore)
        run: python backend/scripts/diagnose/mutate_h_cycle_guards.py

