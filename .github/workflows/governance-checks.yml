name: Governance Checks

# P2-1: 平台治理检查 CI 集成
# 所有新增检查先 warning 两周，再 fail 新增违规。
# 历史债务只走 baseline，不阻塞当期 PR。

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  # 强制执行日期：此日期之后，新增违规从 warning 切换为 fail
  # 格式 YYYY-MM-DD，修改此值即可延长 warning 期
  GOVERNANCE_ENFORCE_DATE: "2026-07-01"

jobs:
  scale-snapshot-check:
    # P2-1.1: 规模快照检查
    # 验证 docs/architecture/scale-snapshot.md 是否与脚本输出一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check scale snapshot freshness
        run: |
          set -e
          SNAPSHOT_FILE="docs/architecture/scale-snapshot.md"

          # 如果快照文件不存在，提示但不阻断
          if [ ! -f "$SNAPSHOT_FILE" ]; then
            echo "::warning::规模快照文件 $SNAPSHOT_FILE 不存在，请运行 python backend/scripts/analyze/snapshot_scale.py --write"
            exit 0
          fi

          # 生成当前快照到临时文件
          python backend/scripts/analyze/snapshot_scale.py --write 2>/dev/null
          CURRENT_JSON=$(python backend/scripts/analyze/snapshot_scale.py 2>/dev/null)

          # 提取后端和前端数字进行比对（忽略 timestamp 差异）
          ROUTERS=$(echo "$CURRENT_JSON" | python -c "import sys,json; d=json.load(sys.stdin); print(d['backend']['routers'])")
          SERVICES=$(echo "$CURRENT_JSON" | python -c "import sys,json; d=json.load(sys.stdin); print(d['backend']['services'])")
          MODELS=$(echo "$CURRENT_JSON" | python -c "import sys,json; d=json.load(sys.stdin); print(d['backend']['models'])")
          VIEWS=$(echo "$CURRENT_JSON" | python -c "import sys,json; d=json.load(sys.stdin); print(d['frontend']['views'])")
          COMPONENTS=$(echo "$CURRENT_JSON" | python -c "import sys,json; d=json.load(sys.stdin); print(d['frontend']['components'])")

          # 检查文档中的数字是否匹配
          DOC_ROUTERS=$(grep -oP "Routers \| \K[0-9]+" "$SNAPSHOT_FILE" || echo "0")
          DOC_SERVICES=$(grep -oP "Services \| \K[0-9]+" "$SNAPSHOT_FILE" || echo "0")
          DOC_MODELS=$(grep -oP "Models \| \K[0-9]+" "$SNAPSHOT_FILE" || echo "0")
          DOC_VIEWS=$(grep -oP "Views \| \K[0-9]+" "$SNAPSHOT_FILE" || echo "0")
          DOC_COMPONENTS=$(grep -oP "Components \| \K[0-9]+" "$SNAPSHOT_FILE" || echo "0")

          MISMATCH=0
          if [ "$ROUTERS" != "$DOC_ROUTERS" ]; then
            echo "Routers: 实际=$ROUTERS 文档=$DOC_ROUTERS"
            MISMATCH=1
          fi
          if [ "$SERVICES" != "$DOC_SERVICES" ]; then
            echo "Services: 实际=$SERVICES 文档=$DOC_SERVICES"
            MISMATCH=1
          fi
          if [ "$MODELS" != "$DOC_MODELS" ]; then
            echo "Models: 实际=$MODELS 文档=$DOC_MODELS"
            MISMATCH=1
          fi
          if [ "$VIEWS" != "$DOC_VIEWS" ]; then
            echo "Views: 实际=$VIEWS 文档=$DOC_VIEWS"
            MISMATCH=1
          fi
          if [ "$COMPONENTS" != "$DOC_COMPONENTS" ]; then
            echo "Components: 实际=$COMPONENTS 文档=$DOC_COMPONENTS"
            MISMATCH=1
          fi

          if [ "$MISMATCH" -eq 1 ]; then
            # 判断是否已过强制执行日期
            TODAY=$(date +%Y-%m-%d)
            if [[ "$TODAY" > "$GOVERNANCE_ENFORCE_DATE" || "$TODAY" == "$GOVERNANCE_ENFORCE_DATE" ]]; then
              echo "::error::规模快照过期！请运行 python backend/scripts/analyze/snapshot_scale.py --write 更新"
              exit 1
            else
              echo "::warning::规模快照过期（warning 期，$GOVERNANCE_ENFORCE_DATE 后将 fail）。请运行 python backend/scripts/analyze/snapshot_scale.py --write 更新"
              exit 0
            fi
          fi

          echo "✅ 规模快照与脚本输出一致"

  sql-column-contract:
    # P2-1.2: SQL 列契约检查
    # 检测新增的不存在列引用（基于 allowlist baseline，历史债务不阻塞）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (uv accelerated)
        run: |
          pip install "uv>=0.7"
          uv pip install --system -r backend/requirements.txt || pip install -r backend/requirements.txt
      - name: Run SQL column contract check
        run: |
          set -e

          # 判断是否已过强制执行日期
          TODAY=$(date +%Y-%m-%d)
          if [[ "$TODAY" > "$GOVERNANCE_ENFORCE_DATE" || "$TODAY" == "$GOVERNANCE_ENFORCE_DATE" ]]; then
            echo "强制执行模式：新增违规将阻塞 PR"
            python backend/scripts/check/check_sql_column_contract.py --strict
          else
            echo "Warning 模式（$GOVERNANCE_ENFORCE_DATE 后切换为 fail）"
            python backend/scripts/check/check_sql_column_contract.py || true
            # 即使有违规也只输出 warning
            RESULT=$(python backend/scripts/check/check_sql_column_contract.py --strict 2>&1 || true)
            if echo "$RESULT" | grep -q "检测到违规"; then
              echo "::warning::SQL 列契约检测到新增违规（warning 期，$GOVERNANCE_ENFORCE_DATE 后将 fail）"
            fi
            exit 0
          fi

  acnr-ie-catalog-sync:
    # ACNR R18.5: IE manifest ↔ catalog import_export 一致性检查
    # 校验 d_cycle_ie_manifest.yaml 与 global_catalog.json 的 import_export 段同步
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install pyyaml
      - name: Check IE ↔ catalog sync (D cycle)
        run: python backend/scripts/acnr/check_ie_catalog_sync.py

  endpoint-auth-check:
    # P0-4: 端点授权声明覆盖检查
    # 检测写端点是否声明了授权依赖（require_operation / require_project_access）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check endpoint auth coverage
        run: |
          python scripts/check/check_endpoint_auth.py

  check-acnr-catalog-drift:
    # ACNR: catalog 漂移检查（R18.3）
    # 验证 global_catalog.json 与生成器重新生成的输出一致（无 drift）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (uv accelerated)
        run: |
          pip install "uv>=0.7"
          uv pip install --system -r backend/requirements.txt || pip install -r backend/requirements.txt
      - name: check-acnr-catalog-drift
        run: python backend/scripts/acnr/check_catalog_drift.py

  acnr-addr-id-unique:
    # ACNR: addr_id 全局唯一性校验
    # 确保 global_catalog.json 中所有 addr_id 无重复（含跨 sheets/cells 碰撞）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check addr_id global uniqueness
        run: python backend/scripts/acnr/check_addr_id_unique.py

  check-standard-wp-code-re-single:
    # ACNR R12.3: grep-ban 阻断新增 [A-I]\d / [A-S]\d 副本
    # 确保 STANDARD_WP_CODE_RE 只在 grammar_v1.json 中定义一次
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check standard wp code regex single definition
        run: python backend/scripts/acnr/check_standard_wp_code_re_single.py

  acnr-ccr-resolve:
    # ACNR R17.1: CCR resolve 自检（M1 报告模式）
    # 校验每条 CCR source 可 resolve 或标 semantic_only，产出缺口报告
    # M1 报告模式：continue-on-error: true，不阻断 PR
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check CCR resolve (report mode)
        run: python backend/scripts/acnr/check_ccr_resolve.py

  acnr-ccr-resolve-blocking:
    # ACNR R17.3: CCR resolve blocking 模式（M3）
    # 所有非 semantic_only 的 CCR source 必须 100% resolve，否则阻断 PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check CCR resolve (blocking mode)
        run: python backend/scripts/acnr/check_ccr_resolve.py --blocking

  check-sheet-labels-generated:
    # ACNR R3.2/R18.1: dSheetLabels.ts 生成一致性守卫（禁手改）
    # 验证前端 D-cycle sheet labels 文件与生成器输出一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check dSheetLabels.ts is generated (not hand-edited)
        run: python backend/scripts/acnr/check_sheet_labels_generated.py

  wp-ref-contract-check:
    # 工作底稿组件 ref 契约守卫（2026-07-11 F5+G+K ref-unwrap 清扫复盘）
    # 拦截 props ref-unwrap 崩溃反模式：子组件把 allResponses/wpId 等声明为 Ref<>
    # （父模板绑定会自动解包成纯值 → 子组件 props.x.value 取值崩溃/空表）。
    # 当前全树已清零，直接 strict 阻断新增违规。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check workpaper component ref contract
        run: python backend/scripts/check/check_wp_ref_contract.py --strict
      # composables 相对导入层级守卫（2026-07-11 K 类底稿 Playwright 实测）
      # 拦截 {cycle}/{sub}/*.vue 用错 ../ 深度 import composables（Vite transform 500 →
      # ErrorBoundary 崩溃；vitest/Volar 解析方式不同故漏检，必须浏览器/CI 兜底）。
      - name: Check workpaper composables import depth
        run: python backend/scripts/check/fix_wp_composables_import_depth.py --check
      # 版本链集成守卫（version-trail-full-coverage spec Req 14）
      # 确保 D~N 循环全部主入口组件已接入 useWorkpaperVersionToolbar + GtWpVersionTrail。
      # 当前全树已接入，直接 strict 阻断新增违规。
      - name: Version Trail Integration Guard
        run: python backend/scripts/check/check_wp_version_trail.py --strict

  disclosure-columns-coverage:
    # 披露表 _columns 覆盖守卫（disclosure-table-sync-convergence Task 13/15.1
    # → disclosure-columns-coverage-rollout R4/R6.7 复核）
    # 扫描 sync-from-workpaper 调用点是否携带 columns 列头元数据（供附注模块投影渲染）。
    # 严格模式：92/92 调用点已覆盖（rollout 批 1~4 收口），此后新增未覆盖同步调用点将阻断 CI。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check disclosure _columns coverage (strict)
        run: python backend/scripts/check/check_disclosure_columns_coverage.py --strict
      # 守卫自身的单测（rollout Task 5.3 新增，10 条）。ci.yml 的 backend-tests 虽然跑
      # `pytest backend/tests/` 全量，但它带 `-x` 且依赖 PG + 全量 requirements —— 前序
      # 任一失败就到不了这里。守卫脚本是 stdlib-only，故在本 job 内独立跑一遍，
      # 保证「守卫失效」这类回归不会被别的失败掩盖（与 note-inventory-structure /
      # procedure-delegation-architecture 两个 job 同款做法）。
      - name: Install guard self-test dependency
        run: python -m pip install pytest==8.4.2
      - name: Run disclosure columns coverage guard self-tests
        run: python -m pytest backend/tests/scripts/test_check_disclosure_columns_coverage.py -q
      # R6.7：账龄档位标签披露口径扫描 —— **warn 级，明确不阻断**（各循环随批次收敛）。
      # 不加 --strict，并额外 `|| true` 兜底，确保此步永不使本 job 变红。
      - name: Scan disclosure aging label coverage (warn only, non-blocking)
        run: python backend/scripts/check/check_disclosure_aging_label_coverage.py || true

  note-inventory-structure:
    # 附注存货章节结构守卫（f2-inventory-disclosure-template-alignment R12）
    # 背景：`note_template_*.json` 是 md 重建产物，`rebuild_note_from_md.py` 会把源模版
    # 的两级表头压扁（第二行表头降级成 row_type=header_label 假数据行）；且多会话并发
    # 已实测把存货章节对齐回退过。此处在 CI 拦住回退，红了就重跑修订脚本。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check note inventory section alignment (五、9 / 八、10)
        run: python backend/scripts/fix/fix_note_inventory_structure.py --check
      - name: Install test dependency
        run: python -m pip install pytest==8.4.2
      - name: Run note inventory structure contract tests
        run: python -m pytest backend/tests/services/test_note_inventory_structure.py -q

  note-g-cycle-structure:
    # 附注 G 循环（金融工具）披露章节结构守卫（disclosure-sync-path-buildout 批 1）
    # 背景：G 循环 66 张披露表原本 columns / guidance 全缺，且多处表名是表头首格
    # （`项  目` / `种  类`）——与前端子表名常量错位会产出孤儿子表（附注 TAB 永空 +
    # 底稿数据丢失）。已对齐 G8 / G9 / G12，此处拦住回退。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check note G-cycle section alignment (G8 / G9 / G12)
        run: python backend/scripts/fix/fix_note_g_cycle_structure.py --check
      - name: Install test dependency
        run: python -m pip install pytest==8.4.2
      - name: Run note G-cycle structure contract tests
        run: python -m pytest backend/tests/services/test_note_g_cycle_structure.py -q

  disclosure-sync-wiring:
    # 两类"只有浏览器实测才暴露"的披露同步接线缺陷静态守卫
    # （j1-disclosure-template-alignment Task 17 横向推广，2026-07-30）
    #
    # 1. setup 作用域 composable（useAuditContext / useRoute / useRouter /
    #    useDisplayPrefsStore）写进 async 处理器 → 运行时 inject 失效 → TypeError →
    #    整个处理器在发请求前抛错，功能静默全废。J1 两个披露 Tab 的同步按钮与自动同步
    #    因此**一直是死的**（库里 `_last_sync_at` 恒 NULL）；H8 两个 Tab 的「校对附注」
    #    与 ColumnMappingEditor 的路由回退同款。全 src 2344 个 .vue 已清零。
    # 2. `scheduleAutoSync(syncToDisclosureNotes)` 写在同步函数内 = 调度自己 →
    #    800ms 周期重复 POST；且让覆盖率守卫误判为"已接自动同步"（假接入）。
    #    静态扫出 16 处，横跨 G1/G2/G3/G6/H3/I4/I5/I6/K1，已全部改为监听实际数据。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check setup-scoped composables & sync self-trigger (all .vue)
        run: python backend/scripts/check/check_setup_scoped_composables.py --path .
      - name: Check disclosure self-schedule fix alignment
        run: python backend/scripts/fix/fix_disclosure_self_schedule.py --check

  note-j1-structure:
    # 附注 J1 应付职工薪酬章节结构守卫（j1-disclosure-template-alignment R1/R2/R7.1）
    # 背景：五、40 / 八、40 共 6 张披露表原本 columns / guidance 全缺（「本期增加」
    # 「本期减少」共享前缀「本期」→ seed 路径会被反猜出源模板不存在的「本期」父表头）；
    # 且 soe 第 3 张表与第 2 张**重名**（都叫「短期薪酬列示」），而前端推
    # 「设定提存计划列示」→ 孤儿子表（模板第 3 张表永空）。另拦 `……` 占位行回归
    # 与两侧说明文本区被清空（soe 曾只剩 3 个 `###` 表标题 → 文本区 seed 恒空）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check note J1 section alignment (五、40 / 八、40)
        run: python backend/scripts/fix/fix_note_j1_employee_comp_structure.py --check
      - name: Install test dependency
        run: python -m pip install pytest==8.4.2
      - name: Run note J1 structure contract tests
        run: python -m pytest backend/tests/services/test_note_j1_employee_comp_structure.py -q

  note-d1-structure:
    # 附注 D1 应收票据章节结构守卫（d1-notes-receivable-disclosure-alignment R1/R4.2）
    # 背景：五、4 / 八、4 共 26 张披露表原本 columns / guidance 全缺、两级表头被 md 重建
    # 脚本压扁，且「可无限量添加行」「出票人类型或账龄」等占位说明被当数据行落进 rows。
    # 另拦两类会渲染崩 / 静默失真的回退：`group` 含 `/`（前端 activeTableColumns 只认
    # 扁平 {group,start,span}）、国企「转回或收回前累计已计提坏账准备金额」被改回文本列。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check note D1 section alignment (五、4 / 八、4)
        run: python backend/scripts/fix/fix_note_d1_notes_receivable_structure.py --check
      - name: Install test dependency
        run: python -m pip install pytest==8.4.2
      - name: Run note D1 structure contract tests
        run: python -m pytest backend/tests/test_note_d1_structure.py -q

  d1-disclosure-hardening:
    # D1 披露第二阶段四条守卫（前三条均为 2026-07-30 浏览器实测暴露的既有缺陷）：
    # 1. AI section prompt —— 前端曾发 `section` 而后端要 `section_id` → 7 个按钮长期 422 空转；
    #    修好字段名后又须防「prompt 过短诱导自造披露内容」（每条 ≥20 字 + 不得虚构约束）
    # 2. 导入导出列名 —— 导出模板列名与界面/附注三方漂移（全角括号、缺「期末」前缀），
    #    且 `merge_cells("A1:A2")` 清空 A2 导致**导入自家导出的模板必然报「缺少列」**
    # 3. 往返自检 —— 导出模板 → 立刻用导入校验器验一遍，必须零错误
    # 4. Word 导出两级表头（P2-3）—— 9 张表含**混合分组**（部分列有 group、部分列
    #    rowspan=2 独立），`_build_two_level_header_rows` 的 row1 一旦为独立列补空占位，
    #    子列名会整体右移、末列被丢弃（存货章节曾实测中招）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest==8.4.2 openpyxl
      - name: Run D1 AI section prompt guard
        run: python -m pytest backend/tests/test_review_dialog_section_prompts.py -q
      - name: Run D1 disclosure import/export column contract
        run: python -m pytest backend/tests/test_d1_disclosure_export_columns.py -q
      - name: Run D1 note Word export two-level header guard
        run: python -m pytest backend/tests/services/test_note_word_export_d1.py -q

  d1-extraction-chain:
    # D1「四表库入库 → 底稿刷新取数 → 披露表 → 附注」链路守卫
    # （spec d1-extraction-chain-completion）。此前该链路中间断裂多处且测试恒绿：
    # 1. 科目映射：取数硬编码 `1121`/`1231`+名称关键字，与报表规则（BS-005 经
    #    report_config → 标准码 → account_mapping 反解原始码）脱节 → 客户自定义编码即取不到数
    # 2. 跨表锚点：披露①分类表读 `-current-audited` 后缀（审定数是 computed **从不持久化**）、
    #    前缀写 `baddebt-` 而实际是 `bd-` → 全平台无写入方，而两份 fixture 以**同款错误键**
    #    播种 → 测试恒绿、生产恒死
    # 3. Tier A 预设口径：`D1-adj-tb-amount` 原登记原值 `TB('1121')`，而源模板 D1-1
    #    E20=E18-E19 比的是**净值** → 核对行必然显示一个恰好等于坏账准备的假差异
    # 4. 表名/文案漂移：既有守卫全是自证（脚本常量 ↔ 模板 JSON），源模板从未参与裁决
    #    → 上市「转应收账款」表名多一个「将」、披露页 7 条小节标题 5 条漂移且撞小节号
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run D cycle extraction suite (D1 account resolver / detail seed / aux import)
        run: python -m pytest backend/tests/d_cycle_extraction -q
      - name: Run note D1 structure guard (含源 xlsx 表名交叉比对)
        run: python -m pytest backend/tests/test_note_d1_structure.py -q

  d1-extraction-chain-frontend:
    # 前端侧：共享锚点模型单一真源 + 披露页小节标题 ↔ 源模板 + 子表名契约
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audit-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm ci
      - name: Run D1 chain guards
        run: npx vitest run --silent=true d1 D1

  d-cycle-extraction-chain:
    # D2/D3/D5/D6/D7 取数科目 P0 修正 + 公式预设/溯源登记诚实化守卫
    # （d-cycle-extraction-chain-completion Wave 1/5）。
    # 背景：D6 预设取错整个科目族（1402 在途物资 vs 1141 合同资产，活体实证 1402 有
    # 12 行数据 → 不是恒空是显示错数）；D2 缺减备抵（假差异）；D5 引用不存在的科目
    # 1124（已移除并诚实化）；D5/D6/D7 三循环公式预设 sheet 名与 PREV() 环形错位
    # + 7 条彻底虚构的取数条目（客户 TOPn 排名等，源模板逐一核实后删除）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run D-cycle account code guards (含 openpyxl 源 xlsx 交叉比对)
        run: python -m pytest backend/tests/d_cycle_extraction -q
      - name: Run prefill_formula_mapping D5/D6/D7 sheet-name guards
        run: python -m pytest backend/tests/test_d_prefill_d567_fix.py backend/tests/test_d_cycle_revenue_properties.py backend/tests/test_d567_prefill_property.py backend/tests/test_d_prefill_extension.py -q

  note-d2-structure:
    # 附注 D2 应收账款章节结构守卫（d-cycle-extraction-chain-completion Wave 2）
    # 背景：D2 的表名/行骨架已由并发会话两个归档 spec 处理过，但两者都只做了同步载荷，
    # 没把 columns/guidance 写回模板 JSON —— 上市 17 表、国企 13 表全缺，且国企侧
    # 残留 4 处占位行/header_label 假行。本 job 还顺带抓出上市表名漂移
    # 「转移应收账款且继续涉入形成的资产、负债」漏「的金额」二字（源模板 R172 实证）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest==8.4.2 openpyxl
      - name: Check note D2 section alignment (五、5 / 八、5)
        run: python backend/scripts/fix/fix_note_d2_ar_structure.py --check
      - name: Run note D2 structure contract tests
        run: python -m pytest backend/tests/test_note_d2_structure.py -q

  applicable-standards-wiring:
    # 适用准则前端全链守卫（applicable-standards-frontend-wiring R1/R4）
    # 背景：DB 权威源是 `projects.applicable_standard_v2 = {entity_type, scope, stage}`，
    # 而前端门控要的是 `soe_standalone` 这类字符串。此前 render-config 的 60+ 份
    # `_load_project_context` 多数不下发、I1~I6 下发原始 v2 对象（前端归一函数不认）
    # → 门控恒空：D3 两版披露 Tab 对所有项目显示「当前项目不适用…」（用户不可达），
    # 其余循环门控恒开（可在国企项目编辑上市 Tab，而 sync_from_workpaper 不按
    # current_standard 定位 → 数据写进错误章节）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run applicable_standards derive guard
        run: python -m pytest backend/tests/test_applicable_standards_derive.py -q
      - name: Run render-config injection guard
        run: python -m pytest backend/tests/test_render_config_applicable_standards.py -q

  applicable-standards-runtime-guard:
    # 跨主体类型披露同步守卫 + runtime context 供给
    # （applicable-standards-runtime-and-sync-guard R4/R5）
    # 背景：`sync_from_workpaper` 的定位键只有 `(project_id, year, note_section)`，
    # 请求体里的 `current_standard` 既不参与匹配也不校验 → 在国企项目上编辑上市披露
    # Tab 会把数据写进上市章节号对应的记录（国企项目「五、xx」是另一套压缩编号，
    # 实测 五、19=应付职工薪酬 / 五、20=应交税费）→ 静默污染。前端门控可被绕过
    # （旧版本前端 / 直接 POST），服务端必须自守：只拦 entity 维度冲突（listed vs soe），
    # scope 差异与非准则字面量一律放行，查不到准则时 fail-open。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run cross-entity disclosure sync guard
        run: python -m pytest backend/tests/test_standard_conflict_guard.py -q
      - name: Run disclosure sync regression (fake-DB paths)
        run: >-
          python -m pytest backend/tests/test_wp_disclosure_sync.py
          backend/tests/test_wp_disclosure_sync_revive.py
          backend/tests/test_manual_override_hook.py -q

  applicable-standards-runtime-frontend:
    # 宿主取「适用准则」的前端守卫（applicable-standards-runtime-and-sync-guard R1~R3/R5.1）
    # 三类回归：
    # ① scaffold 不再 provide `applicableStandards`（宿主取值链回到「恒空」）
    # ② 宿主用 `(runtime as any)?.applicableStandards` 绕过守卫留死 fallback
    #    （上一轮守卫只匹配 `runtime?.applicableStandards`，I3/I5/I6 三个宿主借 as any 逃逸）
    # ③ 新宿主又抄一份取值链而不接共享 composable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: audit-platform/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: audit-platform/frontend
      - name: Run applicable standards host/runtime guards
        run: >-
          npx vitest run
          src/components/workpaper/__tests__/hostApplicableStandards.spec.ts
          src/components/workpaper/composables/__tests__/useWorkpaperScaffold.spec.ts
          src/components/workpaper/composables/__tests__/normalizeApplicableStandards.spec.ts
        working-directory: audit-platform/frontend

  note-d-cycle-rest-structure:
    # 附注 D 类剩余四循环披露章节结构守卫
    # （d-cycle-remaining-disclosure-alignment R1/R2/R3/R5）
    # 背景：五、38/八、38（D3 预收款项）、五、6/八、6（D5 应收款项融资）、
    # 五、10/八、11（D6 合同资产）、五、39/八、39（D7 合同负债）共 27 张表
    # `columns` 与 `guidance` 全缺；D6 上市 9 张表里 5 张是垃圾表名
    # （空名 / `续：` / `项  目` / 尾冒号），两版主表的两级表头被压扁成 3 列；
    # D5 上市「背书或贴现」两列共前缀「期末」→ 未表态时必然被反猜出凭空父表头；
    # D7 国企第 2 表名是占位「合同负债（表2）」。
    # 另验 D6 四张两级表头表在 Word 导出路径（混合分组：独立列 rowspan=2、
    # row1 不得为独立列补空占位）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check note D-cycle rest section alignment
        run: python backend/scripts/fix/fix_note_d_cycle_rest_structure.py --check
      - name: Install test dependency
        run: python -m pip install pytest==8.4.2
      - name: Run note D-cycle rest structure contract tests
        run: python -m pytest backend/tests/test_note_d_cycle_rest_structure.py -q
      - name: Run D-cycle note Word export two-level header guard
        run: python -m pytest backend/tests/services/test_note_word_export_d_cycle.py -q
      - name: Run D-cycle disclosure AI prompt guard
        # 四循环说明文本域接入共享 useDisclosureNoteAi 后，section_id 必须在
        # review_dialog._SECTION_PROMPTS 登记；未登记会回退通用 prompt（诱导自造披露内容）
        run: python -m pytest backend/tests/test_review_dialog_d_cycle_prompts.py -q

  note-deferred-tax-structure:
    # 附注 N1 递延所得税资产/负债章节结构守卫
    # （n1-deferred-tax-disclosure-template-alignment R4）
    # 背景：五、30 / 八、31 的第 1 张表在源模板是 **5 列两级表头**（期末余额 /
    # 上年年末|年初余额，各含「可抵扣/应纳税暂时性差异」与「递延所得税资产/负债」），
    # 被 `rebuild_note_from_md.py` 压扁成 3 列并残留 `row_type: header_label` 假数据行；
    # 国企第 2 张表同样被压成 3 列，且**整张缺失**源模板（2）B「互抵明细」表。
    # 另拦一类静默失真：两版表 1 的子列序在源模板里是**相反**的（上市暂时性差异在前、
    # 国企递延所得税资产/负债在前），被「统一」后附注列会串味。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check note deferred-tax section alignment (五、30 / 八、31)
        run: python backend/scripts/fix/fix_note_deferred_tax_structure.py --check
      - name: Install test dependency
        run: python -m pip install pytest==8.4.2 openpyxl==3.1.5
      - name: Run note deferred-tax structure contract tests
        run: python -m pytest backend/tests/services/test_note_deferred_tax_structure.py -q
      # 行集守卫（n1-four-table-extraction-and-disclosure-alignment R5）：
      # 上述结构守卫只校验**列**结构，对 `rows[].label` 无断言 → 上市表 1 曾长期携带
      # 源模板不存在的「开办费」、负债段 5 行里 4 行不符、国企残留 5 处 `……` 占位假行
      # 而全部测试通过。本步用 openpyxl **直读源 xlsx** 交叉比对行集，并拦
      # `report_row_code`（须 BS-036 / BS-067，曾错写 BS-018 = 流动资产合计/存货）
      # 与 `account_codes`（须 1811 / 2901，曾错挂 2601 租赁负债 / 1641~1643 使用权资产）。
      - name: Run note deferred-tax ROW alignment tests (openpyxl 直读源模板交叉比对)
        run: python -m pytest backend/tests/services/test_note_deferred_tax_row_alignment.py -q

  n1-four-table-extraction:
    # N1 四表取数 / 科目映射 / 公式预设守卫
    # （n1-four-table-extraction-and-disclosure-alignment R1 / R2 / R6 / R7）
    #
    # 拦四类已实测缺陷：
    # 1. **科目硬编码**：render 原写死 `1811`，未走 `report_config` 规则映射
    #    （DB 实证 `BS-036 递延所得税资产 = TB('1811','期末余额')` 四准则一致），
    #    项目级自定义映射带不到底稿；且**递延所得税负债 2901 完全没取数** →
    #    披露表负债段与抵销后净额表在四表入库后依然全空。
    # 2. **报表行编码三方冲突**：仓库里并存 BS-036 / BS-049 / BS-018 三种写法，
    #    实测只有 BS-036 正确（BS-049 = 应交税费、BS-018 = 流动资产合计/存货）。
    # 3. **叶子聚合双算**：科目级父行与子科目同时计入；且原实现只 `like '1811.%'`
    #    → 平铺层级科目表（`181102`）静默返回空预填。
    # 4. **公式预设污染**：`prefill_formula_mapping.json` 曾有 `wp_code=N1` 却名为
    #    「税金分析程序」的块（科目 2221 应交税费 / 6403 税金及附加 + 病态区间
    #    `TB_SUM('2221~6403')`），且其 `cell_ref`「上年审定数」与 N1-1 块撞键 ——
    #    `convert_prefill_presets` 的 `page_key` 忽略 sheet，同名必互相遮蔽。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: python -m pip install -r backend/requirements.txt
      - name: Run N1 account mapping / leaf aggregation / liability prefill guards
        run: python -m pytest backend/tests/test_n1_account_mapping.py backend/tests/test_n1_adjudication_prefill.py -q
      - name: Run N1 formula preset purity guard
        run: python -m pytest backend/tests/formula_management/test_n1_preset_purity.py -q

  n345-four-table-extraction:
    # N3 / N4 / N5 四表取数守卫
    # （n345-four-table-extraction-alignment R1 / R2 / R3 / R4 / R5 / R8 / R9）
    #
    # 拦五类已实测缺陷：
    # 1. **N5 `get_active_filter` 单参调用** —— 真实签名 `(db, table, project_id, year)`，
    #    单参必 TypeError 被 `except Exception` 吞 → `trial_balance` 恒 0、
    #    `adjudication_prefill` 恒 None。而既有 28 个 N5 测试全绿（从不真实调用取数函数）
    #    → 本 job 以**真实签名 + await** 调用并断言返回非零。
    # 2. **损益类「Σ借 − Σ贷」结构性恒为 0** —— 全年序时账必含年末「结转损益」分录
    #    （活体实证：凭证「计提当期所得税」借 110,445.40 / 凭证「结转损益」贷 110,445.40），
    #    9 个项目的 6403 / 6801 借贷两侧金额全部相等。权威口径 = `trial_balance`
    #    （`report_config` 的 `IS-003` / `IS-023` 即 `本期发生额`），兜底 `tb_balance.debit_amount`。
    # 3. **`1812` 是活体 0 命中的不存在科目码**（递延所得税负债是 `2901`）；
    #    **`6001` 是营业收入**（`IS-022 利润总额` 是 `ROW()` 派生行，不是科目）。
    # 4. **N3 只查科目级精确单行 + `.limit(1)`** → 客户按子科目挂账时恒 0；
    #    且审定表 seed 把数据全塞「其他」一行，分类信息全丢。
    # 5. **6403 子科目编码语义客户间冲突**（`6403.01` 某客户是印花税）→ 按税种取数
    #    只能用名称判据，且后端税种清单须与前端逐字同序（否则预填有孤儿税种）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: python -m pip install -r backend/requirements.txt
      - name: Check N3/N4/N5 prefill preset alignment
        run: python backend/scripts/fix/fix_n345_prefill_presets.py --check
      - name: Run N5 four-table extraction guards (real-signature calls)
        run: python -m pytest backend/tests/test_n5_four_table_extraction.py -q
      - name: Run N3/N4 + shared module guards
        run: python -m pytest backend/tests/test_n3_n4_four_table_extraction.py -q
      - name: Run N3/N4/N5 preset purity guards
        run: python -m pytest backend/tests/formula_management/test_n345_preset_purity.py -q
      - name: Run existing N4/N5 regression suites
        run: python -m pytest backend/tests/test_n4_taxes_and_surcharges.py backend/tests/test_n5_integration.py -q

  four-table-output-consumption:
    # 平台守卫：render 输出的四表键必须有前端消费点（禁 dead output）
    # + 共享件 `useLmnTbReconcile` 必须有 ≥3 个消费方（它曾 78 行 0 引用）
    # + N3 无披露 inert 残留（源模板无附注 sheet，披露与 N1 共节）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend deps
        working-directory: audit-platform/frontend
        run: npm ci
      - name: Run four-table output consumption guard
        working-directory: audit-platform/frontend
        run: npx vitest run src/components/workpaper/__tests__/fourTableOutputConsumption.spec.ts

  n1-disclosure-frontend:
    # N1 披露表四表直通 / 骨架 / 行镜像 / 二选一分支守卫
    # （n1-four-table-extraction-and-disclosure-alignment R3 / R4 / R7）
    #
    # 拦四类已实测缺陷：
    # 1. 亏损到期骨架原为 5 行（审计年度 +1~+5），源模板是 **6 行**（Y~Y+5）——
    #    期末列覆盖 Y+1~Y+5、上年年末列覆盖 Y~Y+4，两列并集 6 年，故源模板
    #    首行期末列与末行上年年末列写「——」。原实现漏掉上年年末列最早的到期年度。
    # 2. 国企表（2）A 行标签未跟随表（1）（源模板 A36=`=A13` … A50=`=A27`）。
    # 3. 披露口径二选一（源模板国企 R7）未实现，两分支表恒同时推送。
    # 4. 负债段语义槽用中文名作键 → 两版第 4 项用语不同（上市「使用权资产」/
    #    国企「租赁形成」）必有一版对不上。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend deps
        working-directory: audit-platform/frontend
        run: npm ci
      - name: Run N1 disclosure guards
        working-directory: audit-platform/frontend
        run: npx vitest run src/components/workpaper/composables/__tests__/n1DisclosurePrefillAndBranch.spec.ts src/components/workpaper/composables/__tests__/n1NoteSectionMap.spec.ts src/components/workpaper/composables/__tests__/n1NoteSubtableContract.spec.ts

  note-n-cycle-tax-structure:
    # 附注 N 循环税务类章节结构守卫（n-cycle-tax-disclosure-alignment R5）
    # 拦三类已实测缺陷：
    # 1. **表名同章节内重复** —— 表名是同步键，同名会让 `sub_table_data` 互相覆盖丢表。
    #    N5 两版原先各有两张同名表（上市 `项  目` ×2 是 md 重建把表头首格当表名泄漏；
    #    国企 `所得税费用` ×2）。
    # 2. **N2 两版列结构被"统一"** —— 上市是 3 列双期表（期末 / 上年年末），
    #    国企是 5 列变动表（期初 / 本期应交 / 本期已交 / 期末，末列行内公式）。
    #    md 重建把国企压成了 3 列；前端曾让上市误用国企口径。
    # 3. **N5 国企表 2 丢列** —— 源模板 3 列，被压扁成 2 列丢了「上期发生额」。
    # 另反向断言：国企版**不得**存在「税金及附加」章节（源模板 `附注披露信息：无`），
    # 防后来者"补齐"出一个源模板里不存在的披露表。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check note N-cycle tax section alignment
        run: python backend/scripts/fix/fix_note_n_cycle_tax_structure.py --check
      - name: Install test dependency
        run: python -m pip install pytest==8.4.2
      - name: Run note N-cycle tax structure contract tests
        run: python -m pytest backend/tests/services/test_note_n_cycle_tax_structure.py -q

  note-n-cycle-tax-frontend:
    # N 循环税务类披露前端守卫（n-cycle-tax-disclosure-alignment Task 8）
    # 拦四类只有实测才暴露的缺陷：
    # 1. **子表名 / 列头与附注模板漂移** → 孤儿子表（附注 TAB 永空 + 底稿数据丢失）
    # 2. **N2 两版共用列定义** → 上市误用国企变动口径（反向断言两版列键集不等）
    # 3. **N4 国企产出载荷** → 源模板 `附注披露信息：无`，`buildN4SyncPayload('soe')` 恒 null
    # 4. **sheet 名漂移**：披露判定被 wp_code 正则抢占 / 国企写法不全认 /
    #    N5 国企 tab 名缺右括号（`附注披露信息（国企`）被"修正"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: audit-platform/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: audit-platform/frontend
      - name: Run N-cycle tax disclosure guards
        run: >-
          npx vitest run
          src/components/workpaper/composables/__tests__/n2NoteSectionMap.spec.ts
          src/components/workpaper/composables/__tests__/n2NoteSubtableContract.spec.ts
          src/components/workpaper/composables/__tests__/n2SheetRouting.spec.ts
          src/components/workpaper/composables/__tests__/n4NoteSectionMap.spec.ts
          src/components/workpaper/composables/__tests__/n4NoteSubtableContract.spec.ts
          src/components/workpaper/composables/__tests__/n5NoteSectionMap.spec.ts
          src/components/workpaper/composables/__tests__/n5NoteSubtableContract.spec.ts
          src/components/workpaper/composables/__tests__/nCycleSheetRouting.spec.ts
          src/components/workpaper/composables/__tests__/nCycleTaxConsistency.spec.ts
          src/components/workpaper/composables/__tests__/disclosureSheetNameRegistry.spec.ts
          src/components/workpaper/__tests__/disclosureAutoSyncCoverage.spec.ts
          src/components/workpaper/__tests__/disclosureColumnsCoverage.spec.ts
        working-directory: audit-platform/frontend

