    #    **源码级**不引用任何注入符号（xlsx 内含时间戳与 zip 顺序，跑两次比字节天然不稳）；
    # 8. OO 编辑留痕（Property 13/14/15）：快照继承不洗白 stale、编辑人如实记录
    #    （解析不出记 None，**禁止**回退 created_by）、doc_key 确定性且与席位同源。
    #
    # 🔴 读源码型守卫一律先剥注释：本 spec 的说明注释里写了被禁形态的反例
    #    （`int(time.time())` / `ADD COLUMN IF NOT EXISTS`），不剥则守卫自己打红自己
    #    （2026-08-04 同一坑踩了两次，Python 与 SQL 各一次）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest==8.4.2 pytest-asyncio==0.24.0 hypothesis==6.112.1 python-docx==1.1.2 aiosqlite==0.20.0 sqlalchemy==2.0.36
      - name: Run anchor scan + export wiring guards
        run: >-
          python -m pytest
          backend/tests/test_section_anchor_scan.py
          backend/tests/test_note_export_anchor_wiring.py
          -q --tb=short
      - name: Run section state persist + contract guards
        run: >-
          python -m pytest
          backend/tests/test_deliverable_section_state_persist.py
          backend/tests/test_deliverable_section_state_contract.py
          -q --tb=short
      - name: Run writeback rowcount + refresh in-place guards
        run: >-
          python -m pytest
          backend/tests/test_deliverable_writeback_rowcount.py
          backend/tests/test_deliverable_refresh_inplace.py
          -q --tb=short
      - name: Run capability matrix + zero-regression guards
        run: >-
          python -m pytest
          backend/tests/test_deliverable_capabilities_matrix.py
          backend/tests/test_deliverable_lineage_zero_regression.py
          -q --tb=short
      - name: Run OO edit provenance guards (Wave 2)
        run: >-
          python -m pytest
          backend/tests/test_deliverable_oo_edit_provenance.py
          -q --tb=short
      # 合规护栏接线（Wave 2 Task 15）：表格数字 / 章节标题必须被拒并留痕。
      # 反向自检钉死「主流程硬编码 ChangeKind.TEXT」这一历史缺陷形态 ——
      # 硬编码时 130 行护栏零生产调用方，rejected 恒空、需求 8.4 留痕从未产生。
      - name: Run writeback guardrail wiring guards (Wave 2)
        run: >-
          python -m pytest
          backend/tests/test_deliverable_writeback_guardrail.py
          -q --tb=short
      # 报告正文段落锚点与回填适配器（Wave 3 Task 17/18/19）：
      # 1. 章节定位以**真实致同源模板**为判据（中文序号会随可选段落漂移、
      #    docx 标题不带「段」字，故名称表必须从 SECTION_ID_MAP 派生）；
      # 2. 锚点命名空间隔离 —— sec_rb_* 必须对附注回填的扫描器不可见，
      #    否则附注回填会把报告正文文字写进 disclosure_notes；
      # 3. 回填上游按 doc_type 走适配器，主流程不得再硬编码 DisclosureNote；
      # 4. JSONB 写入判据必须查 **DB 列真值** —— 就地改嵌套对象 + 整体重赋值时
      #    新旧值相等 ⇒ 工作单元判无净变更 ⇒ 内存看着对、列没写进去。
      - name: Run report body anchors + writeback adapters (Wave 3)
        run: >-
          python -m pytest
          backend/tests/test_report_body_section_blocks.py
          backend/tests/test_writeback_target_adapters.py
          -q --tb=short
      # 真实链路验收脚本的腐烂防护（Wave 3 Task 20）：CI 不连库，故只静态自检
      # 「可 import + --help 可解析」。真实验收（--apply 写库并自动复原）由人工
      # 在有库环境执行；本 spec 已在真实项目上跑过 18/18 全 PASS。
      - name: Smoke-check live verification scripts (no DB)
        run: >-
          python backend/scripts/diagnose/verify_report_body_writeback_live.py --help
          && python backend/scripts/diagnose/verify_deliverable_lineage_live.py --help
      # xlsx 差异告警（Wave 4 Task 21/22）：
      # 1. 三态判定收敛在 should_block_confirm ——「非空即拒绝」会把
      #    `{"diffs": []}`（已比对且一致）误判成有差异，使配了映射的报表永远确认不了；
      # 2. 解析失败必须 fail-closed —— 否则弄坏一个映射文件即可绕过需求 10.4；
      # 3. **接线**必须存在且只挂 OO 保存路径 —— Task 21 交付时零生产调用方，
      #    `drift_report` 恒 NULL、闸门恒放行（「additive 列 + 未接线 = 死列」）；
      #    挂到生成路径会让「映射坐标与模板布局不一致」的配置问题变成业务阻塞；
      # 4. 基线归因：既存差异不得被归因为手工改动（审计场景里误指控比不告警更坏）。
      # 5. **映射保真**（2026-08-05 修正）：差异检测的映射解析必须与 exporter 同源
      #    （逐 sheet 扫内联 `{{row:}}` 占位符、按**真实 sheet 名**取值）。
      #    资产负债表拆「主表 + 续表」而 cell_mapping.json 两侧共用 `balance_sheet`
      #    键且坐标重叠（主表 C6=货币资金 / 续表 C6=短期借款），按 sheet_aliases 只取
      #    第一个匹配 sheet 会让续表 49 个 row_code 全去主表取值 ⇒ 报出「应付票据拿到
      #    应收票据余额」这类系统性假差异（真实库 22 处全由此而来）。
      #    判据落在**真实模板文件**上：同一 (sheet, 坐标) 不得对应多个 row_code、
      #    主表/续表必须是不同 sheet 名、每个 spec 的 row_name 与模板同行 A 列一致。
      - name: Run financial report drift + wiring guards (Wave 4)
        run: >-
          python -m pytest
          backend/tests/test_financial_report_drift.py
          backend/tests/test_financial_report_drift_wiring.py
          backend/tests/test_financial_report_drift_mapping.py
          -q --tb=short
      # 复用了 exporter 的模板加载与 sheet 解析（只读私有方法）⇒ 报表导出侧需一并回归
      - name: Run report exporter + cell mapping regression (Wave 4)
        run: >-
          python -m pytest
          backend/tests/test_report_excel_exporter.py
          backend/tests/test_financial_template_cell_mapping.py
          -q --tb=short
      # 溯源可视化（Wave 4 Task 23/24）：
      # 1. 版本链派生字段 —— `is_stale` 必须三态（缺 hash 时返 None，
      #    退化成布尔会让历史版本一律显示「与上游一致」= 骗人）；
      #    编辑人只能取 `edited_by`（`created_by` 在 OO 路径只是回调处理占位）；
      # 2. 三件套一致性能指出**哪一类**滞后；无严格多数时不得凭空指名。
      - name: Run lineage visualization guards (Wave 4)
        run: >-
          python -m pytest
          backend/tests/test_deliverable_version_chain_view.py
          backend/tests/test_trio_consistency_lagging.py
          -q --tb=short
      - name: Run pre-existing lineage suites (no regression)
        run: >-
          python -m pytest
          backend/tests/test_deliverable_lineage_e2e.py
          backend/tests/test_deliverable_lineage_properties.py
          backend/tests/test_deliverable_lineage_characterization.py
          backend/tests/test_content_control_injector.py
          -q --tb=short

  deliverable-lineage-wiring-frontend:
    # 交付件溯源接线与回填闭环 —— 前端门控守卫（Task 16 / Property 11、12）
    # 覆盖：
    # 1. 能力矩阵**跨前后端交叉锁死** —— 守卫直读后端 `deliverable_capabilities.py`
    #    抽两个 frozenset 成员，与前端消费点比对；一旦分叉即打红
    #    （双真源改一处另一处不红，是平台反复踩的漂移范式）；
    # 2. 前端不得自写 doc_type 白名单（只消费后端下发的布尔），
    #    合法例外仅「提示文案措辞」；
    # 3. 无锚点提示（Property 12）：`/section-states` 返空 ⇒ 明确提示且不渲染空下拉
    #    —— `hasNoAnchors` 曾只声明 `ref(false)` 从不赋值 = 死 prop；
    # 4. `WritebackResultPanel` 五桶齐全（written/rejected/conflicts/skipped/failed），
    #    有 failed 时不得出成功 Toast。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: audit-platform/frontend/package-lock.json
      - name: Install deps
        run: npm ci
        working-directory: audit-platform/frontend
      - name: Run deliverable capability gating guards
        run: >-
          npx vitest run
          src/components/deliverable/__tests__/deliverableCapabilityGating.spec.ts
          src/components/deliverable/__tests__/LineagePanel.spec.ts
          src/components/deliverable/__tests__/WritebackPanel.spec.ts
        working-directory: audit-platform/frontend
      # 溯源展示守卫（Wave 4 Task 22/23/24/25）：
      # 1. `created_via` 中文化，且**交叉锁死**后端全部实参 —— 后端新增一种来源
      #    而前端漏加标签即打红（`refresh_stale` 就是这条守卫抓出来的）；
      # 2. `is_stale` 三态：不得用 v-else 兜底把「未知」渲染成确定结论；
      # 3. 差异告警可见性与后端 should_block_confirm 同口径（`{"diffs":[]}` 不告警），
      #    文案中性归因，不得断言「有人改了数字」；
      # 4. 三件套三列对照的中文名与后端 `_TRIO_LABEL` 逐字一致；
      # 5. 行级溯源抽屉复用 useDeliverableLineage（504 文案不得写两份），
      #    链条阶段顺序固定，空阶段/无锚点必须给明确原因。
      - name: Run lineage display guards (Wave 4)
        run: >-
          npx vitest run
          src/components/deliverable/__tests__/deliverableLineageDisplay.spec.ts
        working-directory: audit-platform/frontend
  sampling-evaluation-governance-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest==8.4.2 pytest-asyncio==0.24.0 hypothesis==6.112.1 sqlalchemy==2.0.36

      # R1：撤销回填必须同步软删两张投影表（改造前撤销后投影仍活着 →
      # 跨底稿排除/重复检测/项目级统计四个消费方全部被污染）
      - name: Run undo projection guards
        run: python -m pytest backend/tests/test_sampling_undo_registration.py -q --tb=short

      # R6：QC 引擎门控三态。改造前 qc_rule_definitions 空表 → active_rules 为
      # 空集 → 全部 20 条内置规则静默不执行且无 WARNING（真实库实测 0 行）
      - name: Run QC engine rule gating guards
        run: python -m pytest backend/tests/test_qc_engine_rule_gating.py -q --tb=short

      # R7：QC-12 判据重写（改造前遍历 SamplingConfig 0 行 → 循环体永不执行）
      - name: Run sampling QC rule guards
        run: python -m pytest backend/tests/test_sampling_qc_rules.py -q --tb=short

      # R8：归档章节 06 + 完整性第 5 类
      - name: Run archive sampling section guards
        run: python -m pytest backend/tests/test_archive_sampling_records_section.py backend/tests/test_archive_completeness_report.py -q --tb=short

      # R10：复核 prompt 前后端交叉锁死（前端新增 sampling-* section 必须后端跟上）
      - name: Run sampling review prompt cross-lock guards
        run: python -m pytest backend/tests/test_review_dialog_sampling_prompts.py -q --tb=short

      # 诊断脚本必须可导入且全部 import 符号与真实导出对账一致 ——
      # 本轮连踩 3 次「import 名不符被运行时才炸」，get_diagnostics 零诊断
      - name: Assert live verifier imports resolve (no stale symbol names)
        run: |
          python - <<'PY'
          import ast, importlib, pathlib, sys
          sys.path.insert(0, 'backend')
          p = pathlib.Path('backend/scripts/diagnose/verify_sampling_governance_live.py')
          tree = ast.parse(p.read_text(encoding='utf-8'))
          bad = []
          checked = 0
          for node in ast.walk(tree):
              if isinstance(node, ast.ImportFrom) and node.module and node.module.startswith('app'):
                  try:
                      mod = importlib.import_module(node.module)
                  except Exception as exc:
                      bad.append((node.module, '<module>', type(exc).__name__))
                      continue
                  for alias in node.names:
                      checked += 1
                      if hasattr(mod, alias.name):
                          continue
                      # `from app.services import archive_section_registry` 形态：
                      # 子模块未被父包加载时 hasattr 为 False，须显式再导一次
                      try:
                          importlib.import_module(f'{node.module}.{alias.name}')
                      except Exception:
                          bad.append((node.module, alias.name, 'AttributeError'))
          if bad:
              print('::error::诊断脚本引用了不存在的符号（会在运行时才炸）:', bad)
              sys.exit(1)
          if checked == 0:
              print('::error::未扫到任何 app.* 导入，自检可能已空转')
              sys.exit(1)
          print(f'all {checked} imported symbols resolve')
          PY

