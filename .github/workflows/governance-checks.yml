    # 附注 H9 租赁负债（五、47 / 八、52）+ H10 资产处置损益（三、资产处置收益（损 / 八、75）
    # （h9-h10-remaining-disclosure-alignment Task 8）
    # H10 原有两个 P0：
    # ①上市章节号常量写 `三、资产处置收益`，模板 section_number 实为 md 截断值
    #   `三、资产处置收益（损`（10 字符）→ sync_from_workpaper 精确定位落空、会新建垃圾章节；
    # ②上市两张表**同名** `项  目`（表头首格泄漏）→ sub_table_data 以表名为键，同名互相覆盖
    #   丢整张表；载荷用 `项  目__trial` + `_trial_detail` 双写绕过，但那两个键在模板里不存在
    #   = 孤儿，试运行销售明细永远进不了附注。
    # 另修：两版主表各缺源模板 3 行（债务重组/使用权资产/油气资产）、上市试运行表两级表头被
