  render-fetch-smoke:
    # 取数路径冒烟：判据 = 取数没走进 fail-open 分支（捕获 WARNING 即红）
    # 对照实验：同一 regression 旧测试集 989 全绿放过，本 job 判红并点名策略
    runs-on: ubuntu-latest
    defaults:
