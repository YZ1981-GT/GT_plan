  parent-company-note-chapter:
    # 母公司附注章节结构与取数（parent-company-note-chapter-and-sourcing Task 17）
    # 四个后端守卫 + 幂等脚本 --check + 变异检验 + 真实库诚实报告：
    # 1. 结构守卫：判据真源是 docs/模版/ 两份 docx（python-docx 直读 Heading 1），
    #    不得以 note_template_*.json 自证；源 docx 缺失必须明确失败不静默跳过。
    #    两版子节集合**不对称且禁对齐**（listed 独有「应收票据」/ soe 独有
    #    「现金流量表补充资料」）；soe 长期股权投资表 1(5 列)/表 2(7 列) 结构**已正确**，
    #    只有表 3 与 listed 全部 3 表需还原两级表头 —— 按「三张全压扁」的错误前提
    #    改会破坏正确结构。
    # 2. 口径守卫：resolve_parent_standalone_project 三条件（company_code /
    #    audit_year / report_scope='standalone'）齐备，去掉任一条必红；与展示层
    #    project_display.get_project_display_name（函数名逐字为此，按 build_* 写会
    #    0 命中空转）交叉锁死。
    # 3. 取数守卫：母公司章 ctx 切到母公司单体项目；**兄弟项目缺失时 _tb_cache 置空
    #    ⇒ 金额 None 而非 0**（回落合并缓存是错数，比取不到更坏）；resolution_failed
    #    与 is_consolidated=False 必须两态。另含本轮实测的两个 P0 回归钉子 ——
    #    _attach_parent_source_meta 必须**返回 table_data** 且容忍 ctx=None，
    #    否则 legacy 路径对每张无 binding 的表返 None / 抛 AttributeError（四层验证全绿）。
    # 4. 报表守卫：_load_parent_row_index 不得再引用 parent_company_code（**上级公司**
    #    ≠ 同代码 standalone 兄弟）。判据必须剥 docstring —— 代码级 0 处、docstring
    #    3 处是需求 9.1 要求写明的口径对比说明，裸 count() 会误红。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -q
        working-directory: backend
      # 🔴 pytest 一律从**仓库根**跑 —— 从 backend/ 跑会让用相对路径读
      #    docs/模版/*.docx 与 backend/data/*.json 的守卫拼成 backend/backend/... 而假红
      - name: Parent company chapter structure (source docx three-way)
        run: python -m pytest backend/tests/test_note_parent_company_chapter.py -q
      - name: Parent company scope helper (three conditions + display cross-lock)
        run: python -m pytest backend/tests/test_parent_company_scope.py -q
      - name: Parent company note sourcing (ctx switch, blank-not-zero, provenance)
        run: python -m pytest backend/tests/test_parent_company_note_sourcing.py -q
      - name: Report parent column scope (old behaviour reproduced must fail)
        run: python -m pytest backend/tests/test_report_parent_column_scope.py -q
      - name: Exporter parent column end-to-end (same-code standalone sibling)
        run: python -m pytest backend/tests/test_financial_template_cell_mapping.py -q
      - name: variant_matrix additive (parent_company_sections, 102 variants unchanged)
        run: python -m pytest backend/tests/test_variant_matrix_null_audit.py -q
      - name: Parent company chapter idempotent check
        run: python backend/scripts/fix/fix_note_parent_company_chapter.py --check
      - name: Mutation check (every guard must go red, then restore)
        run: python backend/scripts/diagnose/mutate_parent_company_note_guards.py
      # 真实库验收：无合并项目时诚实输出「无法验收」并 exit 0（禁 fixture 冒充）。
      # CI 无 DB ⇒ 脚本连不上库返 2，故用 || true 只作烟测；真实验收在本地/预发跑。
      - name: Live verification (honest report; DB-less in CI)
        run: python backend/scripts/diagnose/verify_parent_company_note_live.py || true

