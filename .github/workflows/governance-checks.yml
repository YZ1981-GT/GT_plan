  note-f1-four-table:
    # F1 预付款项：四表库取数口径 + 披露/附注列头字面 + 公式管理预设 守卫
    # （f1-four-table-extraction-and-disclosure-alignment）
    # 背景（全部 DB / 源 xlsx 实证）：
    # ① render 曾用硬编码前缀 + 缺点号边界的 `_is_leaf`（`1123.1` 会被 `1123.10` 误判为非叶子；
    #    前缀 `2202` 误吃 `22020`），且报表映射解析结果只喂 trial_balance、tb_balance 侧仍硬编码；
    # ② 完全没有 `adjudication_prefill` —— 而 `1123` 叶子子科目名天然对应 F1-1「按性质分类」
    #    五行（`.01 预付货款`→货款 / `.02.03 长期资产款_工程款`→工程款 / `.03 短期待摊费用`→服务费）；
    # ③ 备抵 `1231-04 坏账准备-预付账款` 从未取数，且 `BS-008` 公式不含备抵 → 必须兜底 + 叠「预付」
    #    名称过滤（实证 9 个项目均无 `1231-04` 映射，宽前缀 `1231` 会把应收账款坏账算进 F1）；
    # ④ F1-4「存货余额」用前缀 `1401`（**材料采购**，实证两项目均为空）而非 `BS-010` 区间 → 恒 0；
    # ⑤ 列头字面丢了源 xlsx 空格（`账  龄` / 上市 `金  额` 双空格 / 国企 `金 额` 单空格），
    #    上市两级表头父组名误写「期末余额/上年年末余额」（源为「期末数/上年年末数」）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check note F1 section alignment (五、7 / 八、7)
        run: python backend/scripts/fix/fix_note_prepayment_structure.py --check
      - name: Check F1 formula presets
        run: python backend/scripts/fix/fix_f1_prefill_presets.py --check
      - name: Install test dependencies
        run: python -m pip install pytest==8.4.2 openpyxl==3.1.5 hypothesis==6.112.1
      - name: Run F1 four-table extraction guards
        run: python -m pytest backend/tests/test_f1_four_table_extraction.py backend/tests/four_table -q
      - name: Run note F1 structure contract tests (three-way vs source xlsx)
        run: >-
          python -m pytest
          backend/tests/services/test_note_prepayment_structure.py
          backend/tests/services/test_note_prepayment_backfill.py -q

