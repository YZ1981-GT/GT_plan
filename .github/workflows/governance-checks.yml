        working-directory: audit-platform/frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: audit-platform/frontend
      - name: Run render smoke tests (blocking mode)
        run: |
          # render 冒烟需要前后端服务运行；CI 环境服务不可用时优雅跳过
          if [ -z "$RENDER_SMOKE_BACKEND_URL" ]; then
