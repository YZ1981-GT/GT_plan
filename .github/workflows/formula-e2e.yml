name: Formula Hub E2E

# formula-e2e-ci-gate ADR-FEC-01
# 独立工作流：起 PG + Redis + 后端 + 前端，跑公式链路 Playwright 规格。
# 不改 ci.yml / governance-checks.yml 的任何现有 job。

# 触发路径：用例直接调用的接口 / 页面，push 与 pull_request 两份保持一致
# （spec formula-management-repair-closure R7.3：原先漏了 routers/formula.py、底稿公式、报表配置、
#  地址库与全局设置页，PR 一侧只有 6 条）。
on:
  push:
    branches: [master, main, 'work/**', 'spec/**']
    paths:
      - 'backend/app/services/formula*/**'
      - 'backend/app/services/formula_settings/**'
      - 'backend/app/services/formula_management/**'
      - 'backend/app/services/consistency_gate/**'
      - 'backend/app/services/report_*'
      - 'backend/app/services/address_registry*'
      - 'backend/app/routers/formula*'
      - 'backend/app/routers/draft_refresh*'
      - 'backend/app/routers/wp_formula*'
      - 'backend/app/routers/wp_user_formulas*'
      - 'backend/app/routers/report_config*'
      - 'backend/app/routers/import_templates.py'
      - 'backend/app/routers/address_registry*'
      - 'backend/app/routers/qc_vr_heatmap.py'
      - 'backend/app/routers/lineage.py'
      - 'backend/app/routers/wp_render_config*'
      - 'audit-platform/frontend/src/components/formula/**'
      - 'audit-platform/frontend/src/composables/formula/**'
      - 'audit-platform/frontend/src/views/FormulaGlobalSettings.vue'
      - 'audit-platform/frontend/src/views/WorkpaperEditor.vue'
      - 'audit-platform/frontend/src/components/workpaper/GtWpRenderer.vue'
      - 'audit-platform/frontend/src/services/formulaSettingsApi.ts'
      - 'audit-platform/frontend/src/services/apiPaths/formula*.ts'
      - 'audit-platform/frontend/e2e/formula-hub/**'
      - 'audit-platform/frontend/playwright.formula-e2e.config.ts'
      - '.github/workflows/formula-e2e.yml'
      - 'backend/scripts/e2e/**'
      - 'backend/scripts/seed/init_tables.py'
      - 'backend/data/e2e_formula_manifest.json'
  pull_request:
    branches: [master, main]
    paths:
      - 'backend/app/services/formula*/**'
      - 'backend/app/services/formula_settings/**'
      - 'backend/app/services/formula_management/**'
      - 'backend/app/services/consistency_gate/**'
      - 'backend/app/services/report_*'
      - 'backend/app/services/address_registry*'
      - 'backend/app/routers/formula*'
      - 'backend/app/routers/draft_refresh*'
      - 'backend/app/routers/wp_formula*'
      - 'backend/app/routers/wp_user_formulas*'
      - 'backend/app/routers/report_config*'
      - 'backend/app/routers/import_templates.py'
      - 'backend/app/routers/address_registry*'
      - 'backend/app/routers/qc_vr_heatmap.py'
      - 'backend/app/routers/lineage.py'
      - 'backend/app/routers/wp_render_config*'
      - 'audit-platform/frontend/src/components/formula/**'
      - 'audit-platform/frontend/src/composables/formula/**'
      - 'audit-platform/frontend/src/views/FormulaGlobalSettings.vue'
      - 'audit-platform/frontend/src/views/WorkpaperEditor.vue'
      - 'audit-platform/frontend/src/components/workpaper/GtWpRenderer.vue'
      - 'audit-platform/frontend/src/services/formulaSettingsApi.ts'
      - 'audit-platform/frontend/src/services/apiPaths/formula*.ts'
      - 'audit-platform/frontend/e2e/formula-hub/**'
      - 'audit-platform/frontend/playwright.formula-e2e.config.ts'
      - '.github/workflows/formula-e2e.yml'
      - 'backend/scripts/e2e/**'
      - 'backend/scripts/seed/init_tables.py'
      - 'backend/data/e2e_formula_manifest.json'
  workflow_dispatch:

jobs:
  formula-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # pgvector 镜像：ORM 建表里有 VECTOR(1024) 列，裸 postgres:16 上 create_all 报
        # `type "vector" does not exist`（governance-checks.yml 同一引导已实测）
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gt_e2e_formula
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gt_e2e_formula
      REDIS_URL: redis://localhost:6379/0
      GT_BACKEND_NO_RELOAD: "1"
      GT_BOOTSTRAP_DONE: "0"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      # ── Python + 后端依赖 ──
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: |
          pip install "uv>=0.7"
          uv pip install --system -r backend/requirements.txt || pip install -r backend/requirements.txt

      # ── Node + 前端依赖 + Playwright ──
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: audit-platform/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: audit-platform/frontend
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: audit-platform/frontend

      # ── 建库：ORM 建基础表 → 删 V147 自建的 4 张表 → 迁移（有失败即停）──
      # 平台基础 schema 由 ORM create_all 建，迁移多是 ALTER 增量：空库直接跑迁移会有上百条失败，
      # run_pending() 却照样返回（原先这一步就是这样，接着种子在没有 users / projects 表的库上报错）。
      # 顺序与 governance-checks.yml「Bootstrap schema」一致（那边的长注释写了为什么不能换序）。
      - name: Bootstrap schema (create_all → drop V147-owned tables → migrations)
        working-directory: backend
        env:
          PGPASSWORD: postgres
          PYTHONPATH: ${{ github.workspace }}/backend
          # init_tables 建完表会登录这个地址调种子端点：指向不存在的地址 ⇒ 只建表
          API_BASE_URL: http://127.0.0.1:1
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d gt_e2e_formula -c "CREATE EXTENSION IF NOT EXISTS vector;"
          python scripts/seed/init_tables.py
          # create_all 只建 ORM 侧（Python）默认值、不建库级默认：V106 往 service_identities 插行不带 id，
          # 它自带 DEFAULT gen_random_uuid() 的 CREATE TABLE IF NOT EXISTS 又因表已存在被跳过 ⇒ 不补就 NOT NULL 失败
          psql -h localhost -U postgres -d gt_e2e_formula -c "ALTER TABLE service_identities ALTER COLUMN id SET DEFAULT gen_random_uuid();"
          psql -h localhost -U postgres -d gt_e2e_formula -c "DROP TABLE IF EXISTS ai_chat_action_receipts, ai_chat_tool_calls, ai_chat_attachments, ai_chat_runs CASCADE;"
          python -c "import asyncio,sys; from app.core.migration_runner import MigrationRunner; r=asyncio.run(MigrationRunner(database_url='postgresql+asyncpg://postgres:postgres@localhost:5432/gt_e2e_formula').run_pending()); print('migrations executed:', len(r.executed), 'failed:', [f.version for f in r.failed]); sys.exit(1 if r.failed else 0)"

      # ── 种子 ──
      - name: Seed formula E2E data
        run: python scripts/e2e/seed_formula_e2e.py
        working-directory: backend

      # ── 启动后端 ──
      - name: Start backend server
        run: |
          nohup python -m uvicorn app.main:app \
            --host 0.0.0.0 --port 9980 \
            --workers 1 \
            > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
        working-directory: backend

      # healthy / degraded 都是 200（PG、Redis 可用，degraded 只说明有漂移等需关注项），与用例里 assertHealthy 同口径；
      # 冷启动要跑启动任务，给 180 秒
      - name: Wait for backend healthy
        run: |
          echo "等待后端 /api/health 返回 healthy / degraded …"
          for i in $(seq 1 180); do
            STATUS=$(curl -sf http://127.0.0.1:9980/api/health | python -c "
          import sys, json
          try:
            d = json.load(sys.stdin)
            print((d.get('data') or d).get('status', ''))
          except: print('')
          " 2>/dev/null || echo "")
            if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "degraded" ]; then
              echo "✅ 后端 ${STATUS}（第 ${i} 次探测）"
              exit 0
            fi
            sleep 1
          done
          echo "❌ 后端 180 次探测内未就绪"
          cat /tmp/backend.log || true
          curl -s http://127.0.0.1:9980/api/health || true
          exit 1

      # ── 运行 Playwright ──
      - name: Run formula-hub Playwright specs
        run: npx playwright test --config=playwright.formula-e2e.config.ts
        working-directory: audit-platform/frontend

      # ── 失败时上传证据 ──
      - name: Upload traces & screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: formula-e2e-traces
          path: |
            audit-platform/frontend/test-results/
            /tmp/backend.log
          retention-days: 7

      # ── 清理 ──
      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill $(cat /tmp/backend.pid) 2>/dev/null || true
          fi
