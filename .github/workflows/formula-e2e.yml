name: Formula Hub E2E

# formula-e2e-ci-gate ADR-FEC-01
# 独立工作流：起 PG + Redis + 后端 + 前端，跑公式链路 Playwright 规格。
# 不改 ci.yml / governance-checks.yml 的任何现有 job。

on:
  push:
    branches: [master, main, 'work/**', 'spec/**']
    paths:
      - 'backend/app/services/formula*/**'
      - 'backend/app/services/formula_settings/**'
      - 'backend/app/services/formula_management/**'
      - 'backend/app/services/consistency_gate/**'
      - 'backend/app/services/report_*'
      - 'backend/app/routers/formula_*'
      - 'backend/app/routers/draft_refresh*'
      - 'audit-platform/frontend/src/components/formula/**'
      - 'audit-platform/frontend/e2e/formula-hub/**'
      - 'audit-platform/frontend/playwright.formula-e2e.config.ts'
      - '.github/workflows/formula-e2e.yml'
      - 'backend/scripts/e2e/seed_formula_e2e.py'
  pull_request:
    branches: [master, main]
    paths:
      - 'backend/app/services/formula*/**'
      - 'backend/app/services/formula_settings/**'
      - 'backend/app/services/formula_management/**'
      - 'backend/app/services/consistency_gate/**'
      - 'audit-platform/frontend/e2e/formula-hub/**'
      - '.github/workflows/formula-e2e.yml'
  workflow_dispatch:

jobs:
  formula-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gt_e2e_formula
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gt_e2e_formula
      REDIS_URL: redis://localhost:6379/0
      GT_BACKEND_NO_RELOAD: "1"
      GT_BOOTSTRAP_DONE: "0"
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      # ── Python + 后端依赖 ──
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: |
          pip install "uv>=0.7"
          uv pip install --system -r backend/requirements.txt || pip install -r backend/requirements.txt

      # ── Node + 前端依赖 + Playwright ──
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: audit-platform/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: audit-platform/frontend
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: audit-platform/frontend

      # ── 迁移 ──
      - name: Run database migrations
        run: |
          python -c "
          import asyncio
          from app.core.migration_runner import MigrationRunner
          asyncio.run(MigrationRunner(
            database_url='postgresql+asyncpg://postgres:postgres@localhost:5432/gt_e2e_formula'
          ).run_pending())
          "
        working-directory: backend

      # ── 种子 ──
      - name: Seed formula E2E data
        run: python scripts/e2e/seed_formula_e2e.py
        working-directory: backend

      # ── 启动后端 ──
      - name: Start backend server
        run: |
          nohup python -m uvicorn app.main:app \
            --host 0.0.0.0 --port 9980 \
            --workers 1 \
            > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
        working-directory: backend

      - name: Wait for backend healthy
        run: |
          echo "等待后端 /api/health 返回 healthy …"
          for i in $(seq 1 60); do
            STATUS=$(curl -sf http://127.0.0.1:9980/api/health | python -c "
          import sys, json
          try:
            d = json.load(sys.stdin)
            print((d.get('data') or d).get('status', ''))
          except: print('')
          " 2>/dev/null || echo "")
            if [ "$STATUS" = "healthy" ]; then
              echo "✅ 后端 healthy（第 ${i} 秒）"
              exit 0
            fi
            sleep 1
          done
          echo "❌ 后端 60 秒内未 healthy"
          cat /tmp/backend.log || true
          curl -sf http://127.0.0.1:9980/api/health || true
          exit 1

      # ── 运行 Playwright ──
      - name: Run formula-hub Playwright specs
        run: npx playwright test --config=playwright.formula-e2e.config.ts
        working-directory: audit-platform/frontend

      # ── 失败时上传证据 ──
      - name: Upload traces & screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: formula-e2e-traces
          path: |
            audit-platform/frontend/test-results/
            /tmp/backend.log
          retention-days: 7

      # ── 清理 ──
      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill $(cat /tmp/backend.pid) 2>/dev/null || true
          fi
